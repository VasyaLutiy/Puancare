мир: цель-стенд

объекты:
  зовутся: модуль

  видимое:
    сигнал: [сильный, слабый]

  скрытое:
    мощность: [высокая, средняя, нулевая]

  ловушки:
    - если мощность=высокая то сигнал=сильный (65%)

  гарантии:
    - минимум 3 объектов с мощность=высокая

действия:
  просветить:
    - если мощность=высокая то пик
    - если мощность=средняя то полка
    - иначе провал

  нагрузить:
    - если мощность=высокая то мощно
    - если мощность=средняя то слабо
    - иначе глохнет

динамика:
  каждый_шаг:
    - если мощность=высокая то шанс_стать средняя (9%)
    - если мощность=средняя то шанс_стать нулевая (14%)
    - если мощность=нулевая то шанс_стать высокая (6%)

вмешательство:
  активировать:
    фиксировано: мощность=высокая

экзамены:
  - зонд просветить вопрос нагрузить

объектов: 8
