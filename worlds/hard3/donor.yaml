мир: донор-мотор

объекты:
  зовутся: мотор

  видимое:
    индикатор: [горит, тускл]

  скрытое:
    заряд: [полный, средний, пустой]

  ловушки:
    - если заряд=полный то индикатор=горит (70%)

  гарантии:
    - минимум 3 объектов с заряд=полный

действия:
  просветить:
    - если заряд=полный то пик
    - если заряд=средний то полка
    - иначе провал

  нагрузить:
    - если заряд=полный то мощно
    - если заряд=средний то слабо
    - иначе глохнет

динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (8%)
    - если заряд=средний то шанс_стать пустой (15%)
    - если заряд=пустой то шанс_стать полный (7%)   # цикл

вмешательство:
  зарядить:
    фиксировано: заряд=полный

объектов: 8
