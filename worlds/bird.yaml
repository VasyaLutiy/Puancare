мир: птица

объекты:
  зовутся: птица

  видимое:
    вес: [грузная, поджарая]          # ловушка: сытая → грузная (80%)
    оперение: [яркое, тусклое]        # шумовой

  скрытое:
    жир: [сытая, в_пути, истощённая]  # лестница из трёх ступеней

  ловушки:
    - если жир=сытая то вес=грузная (80%)

  гарантии:
    - минимум 3 объектов с жир=сытая
    - минимум 2 объектов с жир=истощённая

действия:
  осмотреть_грудку:                   # дешёвый зонд, различает все три ступени
    - если жир=сытая то набитая
    - если жир=в_пути то впалая
    - иначе кости

  лететь:                             # дорогое, но птица не исчезает
    - если жир=истощённая то села
    - иначе летит

  взвесить_взглядом:                  # объясняется видимым
    - если вес=грузная то тяжёлой_кажется
    - иначе лёгкой_кажется

динамика:                             # медленная односторонняя лестница вниз
  каждый_шаг:
    - если жир=сытая то шанс_стать в_пути (3%)
    - если жир=в_пути то шанс_стать истощённая (3%)

вмешательство:
  покормить_на_стоянке:
    выбираешь: [вес, оперение]
    фиксировано: жир=сытая

экзамены:
  - зонд осмотреть_грудку вопрос лететь

объектов: 8
