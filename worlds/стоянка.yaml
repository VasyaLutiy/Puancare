мир: стоянка

# Два механизма-бака в одном мире, общий словарь, но разный темп:
# машина сохнет быстро (6%), птица — медленно (3%). Вид виден на зонде.
# Конфаунд снят: мало объектов, без наводняющего вмешательства.
# Вопрос к судье: k=2 (объединить в абстрактный бак) или k=4 (различить)?

объекты:
  зовутся: штука

  видимое:
    бирка: [красная, синяя]           # шумовой

  скрытое:
    нутро: [авто_полный, авто_сухой, птица_сытая, птица_пустая]

  гарантии:
    - минимум 2 объектов с нутро=авто_полный
    - минимум 2 объектов с нутро=птица_сытая

действия:
  посмотреть:                         # зонд: видоспецифичная поверхность (4 строки)
    - если нутро=авто_полный то бак_полон
    - если нутро=авто_сухой то бак_сух
    - если нутро=птица_сытая то грудка_полная
    - иначе грудка_впалая

  использовать:                       # абстрактный общий исход
    - если нутро=авто_полный то поехало
    - если нутро=птица_сытая то поехало
    - иначе застряло

динамика:                             # двусторонняя (сам пополняется), разный темп
  каждый_шаг:
    - если нутро=авто_полный то шанс_стать авто_сухой (6%)
    - если нутро=авто_сухой то шанс_стать авто_полный (6%)
    - если нутро=птица_сытая то шанс_стать птица_пустая (3%)
    - если нутро=птица_пустая то шанс_стать птица_сытая (3%)

экзамены:
  - зонд посмотреть вопрос использовать

объектов: 8
