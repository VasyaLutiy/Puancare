мир: числовые_ряды

объекты:
  зовутся: ряд

  видимое:
    члены_убывают: [да, нет]
    знаки: [чередуются, постоянные]
    скорость: [быстро, медленно]     # шумовой: не влияет ни на одно действие

  скрытое:
    предел: [сходится, расходится]

  ловушки:
    - если предел=сходится то члены_убывают=да (90%)
    - если предел=сходится то знаки=чередуются (70%)
    # двойная ловушка: агент выучит «убывают + чередуются → сходится»,
    # но ∑(-1)^n*(1+1/n) — убывают, чередуются, РАСХОДИТСЯ (члены не → 0)

  гарантии:
    - минимум 2 объектов с предел=сходится

сущности:
  зовутся: оценка
  штук: 2
  состояния: [точная, ошибочная]
  связаны_с: 1 (предел=сходится)

действия:
  взять_частичные_суммы:          # дешёвый зонд скрытого
    - если предел=сходится то стабилизируется
    - иначе уходит

  просуммировать:                 # дорогое действие с последствиями
    - если предел=расходится то нет_предела
    - иначе сумма_найдена [исчезает, каскад]

  перегруппировать:               # объясняется видимым (знаки)
    - если знаки=чередуются то сумма_изменилась
    - иначе сумма_прежняя

  осмотреть @оценка:
    - если состояние=точная то корректна
    - иначе расхождение

  уточнить @оценка:
    - если состояние=точная то уже_точная
    - если связанный_отсутствует то нет_ряда
    - иначе ок [починка]

вмешательство:
  построить:
    выбираешь: [члены_убывают, знаки]
    фиксировано: предел=расходится

экзамены:
  - зонд взять_частичные_суммы вопрос просуммировать

объектов: 8
