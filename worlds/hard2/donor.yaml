мир: донор-мотор

объекты:
  зовутся: мотор

  видимое:
    индикатор: [горит, тускл]

  скрытое:
    заряд: [рабочий, мертвый]

  ловушки:
    - если заряд=рабочий то индикатор=горит (95%)

  гарантии:
    - минимум 5 объектов с заряд=рабочий

действия:
  просветить:
    - если заряд=рабочий то пик
    - иначе провал

  нагрузить:
    - если заряд=рабочий то мощно
    - иначе глохнет

динамика:
  каждый_шаг:
    - если заряд=рабочий то шанс_стать мертвый (25%)

вмешательство:
  зарядить:
    фиксировано: заряд=рабочий

объектов: 8
