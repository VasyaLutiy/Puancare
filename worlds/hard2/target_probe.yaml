мир: цель-зонд

объекты:
  зовутся: генератор

  видимое:
    индикатор: [яркий, слабый]

  скрытое:
    статус: [живой, мертвый]

  ловушки:
    - если статус=живой то индикатор=яркий (92%)

  гарантии:
    - минимум 5 объектов с статус=живой

действия:
  просветить:
    - если статус=живой то пик
    - иначе провал

динамика:
  каждый_шаг:
    - если статус=живой то шанс_стать мертвый (22%)

вмешательство:
  перезапустить:
    фиксировано: статус=живой

объектов: 8
