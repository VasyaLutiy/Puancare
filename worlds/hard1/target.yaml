мир: цель-стенд

объекты:
  зовутся: блок

  видимое:
    лампа: [светит, темно]

  скрытое:
    режим: [максимум, хороший, слабый, отказ]

  ловушки:
    - если режим=максимум то лампа=светит (78%)

  гарантии:
    - минимум 2 объектов с режим=максимум
    - минимум 3 объектов с режим=отказ

действия:
  просветить:
    - если режим=максимум то пик
    - если режим=хороший то высокий_сигнал
    - если режим=слабый то слабый_сигнал
    - иначе провал

  нагрузить:
    - если режим=максимум то мощно
    - если режим=хороший то сильно
    - если режим=слабый то слабо
    - иначе глохнет

динамика:
  каждый_шаг:
    - если режим=максимум то шанс_стать хороший (4%)
    - если режим=хороший то шанс_стать слабый (5%)
    - если режим=слабый то шанс_стать отказ (7%)

вмешательство:
  сброс:
    фиксировано: режим=максимум

экзамены:
  - зонд просветить вопрос нагрузить

объектов: 10
