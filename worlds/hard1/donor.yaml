мир: донор-мотор

объекты:
  зовутся: мотор

  видимое:
    индикатор: [горит, тускл]

  скрытое:
    заряд: [полный, высокий, низкий, пустой]

  ловушки:
    - если заряд=полный то индикатор=горит (85%)

  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 3 объектов с заряд=пустой

действия:
  просветить:
    - если заряд=полный то пик
    - если заряд=высокий то высокий_сигнал
    - если заряд=низкий то слабый_сигнал
    - иначе провал

  нагрузить:
    - если заряд=полный то мощно
    - если заряд=высокий то сильно
    - если заряд=низкий то слабо
    - иначе глохнет

динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать высокий (3%)
    - если заряд=высокий то шанс_стать низкий (4%)
    - если заряд=низкий то шанс_стать пустой (6%)

вмешательство:
  зарядить:
    фиксировано: заряд=полный

объектов: 10
