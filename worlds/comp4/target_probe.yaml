мир: цель-зонд

объекты:
  зовутся: генератор

  видимое:
    индикатор: [яркий, слабый]

  скрытое:
    уровень: [высокий, средний, низкий]

  ловушки:
    - если уровень=высокий то индикатор=яркий (65%)

  гарантии:
    - минимум 4 объектов с уровень=высокий

действия:
  просветить:
    - если уровень=высокий то пик
    - если уровень=средний то полка
    - иначе провал

динамика:
  каждый_шаг:
    - если уровень=высокий то шанс_стать средний (12%)
    - если уровень=средний то шанс_стать низкий (18%)

вмешательство:
  перезапустить:
    фиксировано: уровень=высокий

объектов: 7
