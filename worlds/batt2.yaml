мир: термос

# held-out: 2-состоянийный бак, МЕДЛЕННЫЙ (2%), чужие слова.
# прогноз: тоже семья-бак — темп другой, форма та же.

объекты:
  зовутся: термос

  видимое:
    крышка: [плотная, разболтана]   # ловушка: горячий → плотная (85%)
    корпус: [блестящий, матовый]    # шум

  скрытое:
    тепло: [горячий, остыл]

  ловушки:
    - если тепло=горячий то крышка=плотная (85%)

  гарантии:
    - минимум 3 объектов с тепло=горячий

действия:
  тронуть:                          # зонд
    - если тепло=горячий то жжёт
    - иначе прохладный

  налить:                           # использование
    - если тепло=горячий то пар
    - иначе тепловато

  стукнуть:                         # объясняется видимым
    - если крышка=плотная то глухо
    - иначе дребезг

динамика:
  каждый_шаг:
    - если тепло=горячий то шанс_стать остыл (2%)

вмешательство:
  вскипятить:
    выбираешь: [крышка, корпус]
    фиксировано: тепло=горячий

экзамены:
  - зонд тронуть вопрос налить

объектов: 6
