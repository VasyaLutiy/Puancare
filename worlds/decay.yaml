мир: частицы

объекты:
  зовутся: частица

  видимое:
    свечение: [яркое, тусклое]    # ловушка: возбуждённая → яркое (80%)
    размер: [большой, малый]      # шумовой

  скрытое:
    энергия: [возбуждённая, покой]

  ловушки:
    - если энергия=возбуждённая то свечение=яркое (80%)

  гарантии:
    - минимум 4 объектов с энергия=возбуждённая

сущности:
  зовутся: детектор
  штук: 2
  состояния: [активен, выключен]
  связаны_с: 1 (энергия=возбуждённая)

действия:
  измерить:                        # дешёвый зонд (не разрушает)
    - если энергия=возбуждённая то высокая
    - иначе низкая

  поглотить:                       # дорогое действие с последствиями
    - если энергия=возбуждённая то фотон_испущен [исчезает, каскад]
    - иначе ничего [исчезает]

  осветить:                        # объясняется видимым
    - если свечение=яркое то отражает
    - иначе поглощает

  проверить @детектор:
    - если состояние=активен то сигнал_есть
    - иначе нет_сигнала

  перезапустить @детектор:
    - если состояние=активен то уже_активен
    - если связанный_отсутствует то нет_частицы
    - иначе ок [починка]

динамика:
  каждый_шаг:
    - если энергия=возбуждённая то шанс_стать покой (25%)

вмешательство:
  накачать:
    выбираешь: [свечение, размер]
    фиксировано: энергия=возбуждённая

экзамены:
  - зонд измерить вопрос поглотить

объектов: 8
