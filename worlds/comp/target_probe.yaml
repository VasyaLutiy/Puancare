мир: цель-зонд

# ЦЕЛЬ ДЛЯ ЖИЗНИ: та же форма, но при жизни доступен ТОЛЬКО зонд
# (просветить). Использование (нагрузить) организм не пробует НИ РАЗУ —
# значит карту использования выучить неоткуда. Экзамен (в target.yaml)
# спросит нагрузить → голая цель обязана провалиться, ввоз донора — вытащить.

объекты:
  зовутся: блок

  видимое:
    лампа: [светит, темно]           # ловушка: активный → светит (80%)

  скрытое:
    режим: [активный, вялый, стоп]

  ловушки:
    - если режим=активный то лампа=светит (80%)

  гарантии:
    - минимум 3 объектов с режим=активный
    - минимум 2 объектов с режим=стоп

действия:
  просветить:                        # ТОЛЬКО зонд
    - если режим=активный то пик
    - если режим=вялый то полка
    - иначе провал

динамика:
  каждый_шаг:
    - если режим=активный то шанс_стать вялый (5%)
    - если режим=вялый то шанс_стать стоп (5%)

вмешательство:
  сброс:
    фиксировано: режим=активный

объектов: 8
