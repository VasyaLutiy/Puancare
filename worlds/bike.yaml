мир: велосипед

объекты:
  зовутся: велосипед

  видимое:
    дыхание: [ровное, рваное]         # ловушка: свежие → ровное (80%)
    рама: [лёгкая, тяжёлая]           # шумовой

  скрытое:
    ноги: [свежие, забитые]

  ловушки:
    - если ноги=свежие то дыхание=ровное (80%)

  гарантии:
    - минимум 3 объектов с ноги=свежие

действия:
  пощупать_икры:                      # дешёвый зонд (не расходует)
    - если ноги=свежие то упругие
    - иначе деревянные

  рвануть_в_горку:                    # дорогое, но велосипед не исчезает
    - если ноги=свежие то взлетел
    - иначе встал

  качнуть:                            # объясняется видимым
    - если рама=лёгкая то звонко
    - иначе глухо

динамика:                             # двусторонняя: устал и сам восстановился
  каждый_шаг:
    - если ноги=свежие то шанс_стать забитые (5%)
    - если ноги=забитые то шанс_стать свежие (9%)

вмешательство:
  взять_велосипед:
    выбираешь: [дыхание, рама]
    фиксировано: ноги=свежие

экзамены:
  - зонд пощупать_икры вопрос рвануть_в_горку

объектов: 6
