мир: цель-стенд

# ЦЕЛЬ: та же ФОРМА (лестница вниз, 3 ступени), но скрытые слова СВОИ.

объекты:
  зовутся: куст

  видимое:
    ветка: [сочная, сухая]           # ловушка: активный → сочная (80%)

  скрытое:
    жизненность: [активная, вялая, мёртвая]

  ловушки:
    - если жизненность=активная то ветка=сочная (80%)

  гарантии:
    - минимум 3 объектов с жизненность=активная
    - минимум 2 объектов с жизненность=мёртвая

действия:
  просветить:                       # зонд: острое чтение трёх ступеней
    - если жизненность=активная то пик
    - если жизненность=вялая то полка
    - иначе провал

  нагрузить:                        # использование: исход зависит от ступени
    - если жизненность=активная то мощно
    - если жизненность=вялая то слабо
    - иначе вянет

динамика:                           # лестница вниз
  каждый_шаг:
    - если жизненность=активная то шанс_стать вялая (5%)
    - если жизненность=вялая то шанс_стать мёртвая (5%)

вмешательство:
  удобрить:
    фиксировано: жизненность=активная

экзамены:
  - зонд просветить вопрос нагрузить

объектов: 8
