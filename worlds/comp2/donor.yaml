мир: донор-мотор

# ДОНОР: проживается целиком. Умеет и зондировать (просветить), и
# использовать (нагрузить) — карту использования выучивает начисто.
# Форма: лестница вниз, 3 ступени.

объекты:
  зовутся: росток

  видимое:
    лист: [зелёный, бледный]         # ловушка: полный → зелёный (80%)

  скрытое:
    сила: [полная, средняя, пустая]

  ловушки:
    - если сила=полная то лист=зелёный (80%)

  гарантии:
    - минимум 3 объектов с сила=полная
    - минимум 2 объектов с сила=пустая

действия:
  просветить:                       # зонд: острое чтение трёх ступеней
    - если сила=полная то пик
    - если сила=средняя то полка
    - иначе провал

  нагрузить:                        # использование: исход зависит от ступени
    - если сила=полная то мощно
    - если сила=средняя то слабо
    - иначе вянет

динамика:                           # лестница вниз
  каждый_шаг:
    - если сила=полная то шанс_стать средняя (5%)
    - если сила=средняя то шанс_стать пустая (5%)

вмешательство:
  полить:
    фиксировано: сила=полная

объектов: 8
