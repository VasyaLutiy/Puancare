мир: цель-зонд

# ЦЕЛЬ ДЛЯ ЖИЗНИ: та же форма, но при жизни доступен ТОЛЬКО зонд.
# Использование (нагрузить) организм не пробует НИ РАЗУ.

объекты:
  зовутся: куст

  видимое:
    ветка: [сочная, сухая]           # ловушка: активный → сочная (80%)

  скрытое:
    жизненность: [активная, вялая, мёртвая]

  ловушки:
    - если жизненность=активная то ветка=сочная (80%)

  гарантии:
    - минимум 3 объектов с жизненность=активная
    - минимум 2 объектов с жизненность=мёртвая

действия:
  просветить:                       # ТОЛЬКО зонд
    - если жизненность=активная то пик
    - если жизненность=вялая то полка
    - иначе провал

динамика:
  каждый_шаг:
    - если жизненность=активная то шанс_стать вялая (5%)
    - если жизненность=вялая то шанс_стать мёртвая (5%)

вмешательство:
  удобрить:
    фиксировано: жизненность=активная

объектов: 8
