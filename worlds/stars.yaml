мир: звёзды

объекты:
  зовутся: звезда

  видимое:
    цвет: [синий, жёлтый, красный]
    яркость: [яркая, тусклая]
    мерцание: [мерцает, стабильная]    # шумовой: не влияет ни на одно действие

  скрытое:
    температура: [горячая, холодная]
    масса: [массивная, лёгкая]

  ловушки:
    - если температура=горячая то цвет=синий (80%)
    - если масса=массивная то яркость=яркая (75%)
    # агент выучит «синяя + яркая → горячая + массивная → сверхновая»,
    # но холодная массивная звезда ломает это через вмешательство

  гарантии:
    - минимум 2 объектов с температура=горячая
    - минимум 2 объектов с масса=массивная

сущности:
  зовутся: телескоп
  штук: 2
  состояния: [работает, сломан]
  связаны_с: 1 (масса=массивная)

действия:
  измерить_спектр:                     # дешёвый зонд температуры (не разрушает)
    - если температура=горячая то синие_линии
    - иначе красные_линии

  взорвать:                            # три условия — агент с MAX_CONDS=2 не выразит
    - если температура=горячая и масса=массивная и яркость=яркая то сверхновая [исчезает, каскад]
    - если температура=горячая и масса=массивная то коллапс [исчезает, каскад]
    - если масса=массивная то красный_гигант [исчезает]
    - иначе белый_карлик [исчезает]

  наблюдать:                           # объясняется видимым (яркость)
    - если яркость=яркая то чёткий_сигнал
    - иначе слабый_сигнал

  проверить @телескоп:
    - если состояние=работает то данные_поступают
    - иначе нет_сигнала

  откалибровать @телескоп:
    - если состояние=работает то уже_работает
    - если связанный_отсутствует то нет_звезды
    - иначе ок [починка]

вмешательство:
  зажечь:
    выбираешь: [цвет, яркость]
    фиксировано: температура=холодная, масса=массивная

экзамены:
  - зонд измерить_спектр вопрос взорвать

объектов: 8
