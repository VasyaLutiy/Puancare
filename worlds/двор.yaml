мир: двор

# машины, велосипеды, птицы в ОДНОМ мире, общий словарь действий,
# но разная скрытая динамика (шесть значений = три вида × два заряда).
# Вопрос к судье: одна ось-«бак» на два состояния или шесть?

объекты:
  зовутся: штука

  видимое:
    бирка: [красная, синяя]           # шумовой

  скрытое:
    нутро: [машина_заряжена, машина_севшая, вело_свежее, вело_забитое, птица_сытая, птица_голодная]

  гарантии:
    - минимум 2 объектов с нутро=машина_заряжена
    - минимум 2 объектов с нутро=вело_свежее
    - минимум 2 объектов с нутро=птица_сытая

действия:
  посмотреть:                         # зонд: видоспецифичная поверхность (6 строк)
    - если нутро=машина_заряжена то мотор_ровно
    - если нутро=машина_севшая то мотор_глохнет
    - если нутро=вело_свежее то дыхание_ровное
    - если нутро=вело_забитое то дыхание_рваное
    - если нутро=птица_сытая то поёт
    - иначе молчит

  использовать:                       # абстрактный общий исход: заряжен -> поехало
    - если нутро=машина_заряжена то поехало
    - если нутро=вело_свежее то поехало
    - если нутро=птица_сытая то поехало
    - иначе застряло

динамика:                             # у каждого вида свой темп и направленность
  каждый_шаг:
    - если нутро=машина_заряжена то шанс_стать машина_севшая (6%)
    - если нутро=вело_свежее то шанс_стать вело_забитое (5%)
    - если нутро=вело_забитое то шанс_стать вело_свежее (9%)
    - если нутро=птица_сытая то шанс_стать птица_голодная (3%)

вмешательство:
  пригнать:
    выбираешь: [бирка]
    фиксировано: нутро=машина_заряжена

экзамены:
  - зонд посмотреть вопрос использовать

объектов: 12
