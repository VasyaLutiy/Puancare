мир: растения

объекты:
  зовутся: растение

  видимое:
    листья: [широкие, узкие]
    стебель: [сочный, сухой]
    цветки: [яркие, нет]              # шумовой: не влияет ни на одно действие

  скрытое:
    токсичность: [токсичное, безопасное]
    светолюбивость: [светолюбивое, теневыносливое]
    влагозависимость: [влаголюбивое, засухоустойчивое]

  ловушки:
    - если токсичность=токсичное то цветки=яркие (70%)
    - если светолюбивость=светолюбивое то листья=широкие (80%)
    - если влагозависимость=влаголюбивое то стебель=сочный (75%)
    # три ловушки — по одной на ось; агент с MAX_CONDS=2 не выразит
    # правило высадить полностью и склеит агрессивно с опасно_медленно

  гарантии:
    - минимум 2 объектов с токсичность=токсичное
    - минимум 2 объектов с светолюбивость=светолюбивое
    - минимум 2 объектов с влагозависимость=влаголюбивое

сущности:
  зовутся: парник
  штук: 2
  состояния: [рабочий, заброшен]
  связаны_с: 1 (светолюбивость=светолюбивое)

действия:
  понюхать:                           # дешёвый зонд токсичности (не разрушает)
    - если токсичность=токсичное то едкий_запах
    - иначе нейтральный

  наклонить:                          # дешёвый зонд светолюбивости (не разрушает)
    - если светолюбивость=светолюбивое то тянется
    - иначе безразлично

  убрать_от_света:                    # разрушает — ценой объекта даёт светолюбивость
    - если светолюбивость=светолюбивое то вянет [исчезает]
    - иначе не_меняется [исчезает]

  высадить:                           # три условия — ложная склейка на MAX_CONDS=2
    - если токсичность=токсичное и светолюбивость=светолюбивое и влагозависимость=влаголюбивое то агрессивно_распространяется [исчезает, каскад]
    - если токсичность=токсичное и светолюбивость=светолюбивое то опасно_медленно [исчезает, каскад]
    - если токсичность=токсичное то слабо_ядовито [исчезает]
    - иначе растёт_нормально

  полить:                             # объясняется видимым (стебель)
    - если стебель=сочный то переполнено
    - иначе впиталось

  осмотреть @парник:
    - если состояние=рабочий то урожай_есть
    - иначе запустело

  восстановить @парник:
    - если состояние=рабочий то уже_работает
    - если связанный_отсутствует то нет_растения
    - иначе ок [починка]

вмешательство:
  вырастить:
    выбираешь: [листья, стебель]
    фиксировано: токсичность=токсичное, влагозависимость=влаголюбивое

экзамены:
  - зонд наклонить вопрос высадить

объектов: 8
