мир: тригонометрия

объекты:
  зовутся: выражение

  видимое:
    период: [π, 2π]
    область_значений: [ограниченная, неограниченная]
    значение_в_нуле: [ноль, единица, не_определено]   # шумовой: не влияет ни на одно действие

  скрытое:
    чётность: [чётная, нечётная]

  ловушки:
    - если чётность=чётная то область_значений=ограниченная (75%)
    # агент выучит «ограниченная → чётная», но sin(x) это ломает:
    # sin — нечётная, но ограниченная

  гарантии:
    - минимум 2 объектов с чётность=чётная

сущности:
  зовутся: тождество
  штук: 2
  состояния: [верно, ложно]
  связаны_с: 1 (чётность=чётная)

действия:
  проверить_симметрию:            # дешёвый зонд скрытого
    - если чётность=чётная то зеркало_по_оси_Y
    - иначе поворот_на_180°

  разложить_в_ряд:                # дорогое действие с последствиями
    - если чётность=нечётная то нечётные_степени
    - иначе чётные_степени [исчезает, каскад]

  найти_период:                   # объясняется видимым (период)
    - если период=π то шаг_π
    - иначе шаг_2π

  осмотреть @тождество:
    - если состояние=верно то работает
    - иначе противоречие

  вывести @тождество:
    - если состояние=верно то уже_верно
    - если связанный_отсутствует то нет_компонента
    - иначе ок [починка]

вмешательство:
  ввести:
    выбираешь: [период, область_значений]
    фиксировано: чётность=чётная

экзамены:
  - зонд проверить_симметрию вопрос разложить_в_ряд

объектов: 8
