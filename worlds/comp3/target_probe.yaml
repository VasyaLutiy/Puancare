мир: цель-зонд

объекты:
  зовутся: блок

  видимое:
    лампа: [светит, темно]

  скрытое:
    режим: [активный, ослабленный, истощённый, стоп]

  ловушки:
    - если режим=активный то лампа=светит (75%)

  гарантии:
    - минимум 3 объектов с режим=активный
    - минимум 2 объектов с режим=стоп

действия:
  просветить:
    - если режим=активный то пик
    - если режим=ослабленный то полка
    - если режим=истощённый то слабый_сигнал
    - иначе провал

динамика:
  каждый_шаг:
    - если режим=активный то шанс_стать ослабленный (8%)
    - если режим=ослабленный то шанс_стать истощённый (10%)
    - если режим=истощённый то шанс_стать стоп (7%)

вмешательство:
  сброс:
    фиксировано: режим=активный

объектов: 9
