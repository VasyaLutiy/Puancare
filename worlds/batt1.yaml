мир: телефон

# held-out для узнавания: 2-состоянийный бак, быстрый, ЧУЖИЕ слова.
# прогноз (до прогона): узнан как семья-бак (батарейка/машина).

объекты:
  зовутся: телефон

  видимое:
    значок: [полоски, пусто]        # ловушка: есть → полоски (85%)
    чехол: [чёрный, белый]          # шум

  скрытое:
    питание: [есть, село]

  ловушки:
    - если питание=есть то значок=полоски (85%)

  гарантии:
    - минимум 3 объектов с питание=есть

действия:
  тапнуть:                          # зонд, не разрушает
    - если питание=есть то экран_горит
    - иначе экран_тёмный

  позвонить:                        # использование, телефон остаётся
    - если питание=есть то дозвонился
    - иначе оборвалось

  потрясти:                         # объясняется видимым
    - если значок=полоски то щелчок
    - иначе тишина

динамика:
  каждый_шаг:
    - если питание=есть то шанс_стать село (5%)

вмешательство:
  подзарядить:
    выбираешь: [значок, чехол]
    фиксировано: питание=есть

экзамены:
  - зонд тапнуть вопрос позвонить

объектов: 6
