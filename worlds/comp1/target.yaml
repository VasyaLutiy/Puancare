мир: цель-стенд

# ЦЕЛЬ: та же ФОРМА (лестница вниз, 3 ступени), но скрытые слова СВОИ.
# Экзамен: зонд просветить → вопрос нагрузить.

объекты:
  зовутся: блок

  видимое:
    лампа: [светит, темно]           # ловушка: активный → светит (80%)

  скрытое:
    режим: [активный, вялый, стоп]

  ловушки:
    - если режим=активный то лампа=светит (80%)

  гарантии:
    - минимум 3 объектов с режим=активный
    - минимум 2 объектов с режим=стоп

действия:
  просветить:                       # зонд: острое чтение трёх ступеней
    - если режим=активный то пик
    - если режим=вялый то полка
    - иначе провал

  нагрузить:                        # использование: исход зависит от ступени
    - если режим=активный то мощно
    - если режим=вялый то слабо
    - иначе глохнет

динамика:                           # лестница вниз
  каждый_шаг:
    - если режим=активный то шанс_стать вялый (5%)
    - если режим=вялый то шанс_стать стоп (5%)

вмешательство:
  сброс:
    фиксировано: режим=активный

экзамены:
  - зонд просветить вопрос нагрузить

объектов: 8
