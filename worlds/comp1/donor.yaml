мир: донор-мотор

# ДОНОР: проживается целиком. Умеет и зондировать (просветить), и
# использовать (нагрузить) — карту использования выучивает начисто.
# Форма: лестница вниз, 3 ступени.

объекты:
  зовутся: мотор

  видимое:
    индикатор: [горит, тускл]        # ловушка: полный → горит (80%)

  скрытое:
    заряд: [полный, средний, пустой]

  ловушки:
    - если заряд=полный то индикатор=горит (80%)

  гарантии:
    - минимум 3 объектов с заряд=полный
    - минимум 2 объектов с заряд=пустой

действия:
  просветить:                       # зонд: острое чтение трёх ступеней
    - если заряд=полный то пик
    - если заряд=средний то полка
    - иначе провал

  нагрузить:                        # использование: исход зависит от ступени
    - если заряд=полный то мощно
    - если заряд=средний то слабо
    - иначе глохнет

динамика:                           # лестница вниз
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (5%)
    - если заряд=средний то шанс_стать пустой (5%)

вмешательство:
  зарядить:
    фиксировано: заряд=полный

объектов: 8
