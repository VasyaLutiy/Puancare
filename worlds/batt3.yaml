мир: повербанк

# held-out-остриё: ТРИ ступени (полный→половина→ноль), чужие слова.
# по имени «батарейка», по ФОРМЕ — лестница. прогноз: узнан как ПТИЦА,
# не как батарейка. если форма бьёт имя — уйдёт к лестнице.

объекты:
  зовутся: повербанк

  видимое:
    диод: [зелёный, красный]        # ловушка: полный → зелёный (85%)
    ремешок: [есть, нет]            # шум

  скрытое:
    ёмкость: [полный, половина, ноль]

  ловушки:
    - если ёмкость=полный то диод=зелёный (85%)

  гарантии:
    - минимум 3 объектов с ёмкость=полный
    - минимум 2 объектов с ёмкость=ноль

действия:
  индикатор:                        # зонд, различает три ступени
    - если ёмкость=полный то три_деления
    - если ёмкость=половина то одно_деление
    - иначе пусто

  воткнуть:                         # использование, бинарно (мертво лишь у нуля)
    - если ёмкость=ноль то мертво
    - иначе питает

  тряхнуть:                         # объясняется видимым
    - если диод=зелёный то бряк
    - иначе молчит

динамика:                           # лестница вниз
  каждый_шаг:
    - если ёмкость=полный то шанс_стать половина (4%)
    - если ёмкость=половина то шанс_стать ноль (4%)

вмешательство:
  зарядить_банк:
    выбираешь: [диод, ремешок]
    фиксировано: ёмкость=полный

экзамены:
  - зонд индикатор вопрос воткнуть

объектов: 8
