мир: машина

объекты:
  зовутся: машина

  видимое:
    датчик: [стрелка_вверх, стрелка_вниз]    # ловушка: полный → стрелка_вверх (85%)
    цвет: [серая, красная]                    # шумовой

  скрытое:
    бак: [полный, пустой]

  ловушки:
    - если бак=полный то датчик=стрелка_вверх (85%)

  гарантии:
    - минимум 3 объектов с бак=полный

действия:
  завести_на_секунду:                 # дешёвый зонд (не расходует)
    - если бак=полный то мотор_рычит
    - иначе мотор_чихает

  ехать:                              # дорогое — машина уезжает
    - если бак=полный то поехала [исчезает]
    - иначе заглохла [исчезает]

  посигналить:                        # объясняется видимым
    - если датчик=стрелка_вверх то бибикнул
    - иначе молчок

динамика:
  каждый_шаг:
    - если бак=полный то шанс_стать пустой (6%)

вмешательство:
  заправить:
    выбираешь: [датчик, цвет]
    фиксировано: бак=полный

экзамены:
  - зонд завести_на_секунду вопрос ехать

объектов: 6
