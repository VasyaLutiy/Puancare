мир: яблоки

объекты:
  зовутся: яблоко

  видимое:
    кожура: [глянцевая, матовая]     # ловушка: свежая → глянцевая (75%)
    запах: [свежий, кисловатый]      # шумовой

  скрытое:
    свежесть: [свежая, испорченная]

  ловушки:
    - если свежесть=свежая то кожура=глянцевая (75%)

  гарантии:
    - минимум 4 объектов с свежесть=свежая

действия:
  понюхать:                         # дешёвый зонд
    - если свежесть=свежая то ароматный
    - иначе воняет

  откусить:                         # дорогое
    - если свежесть=свежая то вкусно [исчезает]
    - иначе горько [исчезает]

  постучать:                        # видимое
    - если кожура=глянцевая то звонко
    - иначе глухо

динамика:
  каждый_шаг:
    - если свежесть=свежая то шанс_стать испорченная (8%)

вмешательство:
  положить_в_холодильник:
    выбираешь: [кожура, запах]
    фиксировано: свежесть=свежая

экзамены:
  - зонд понюхать вопрос откусить

объектов: 8
