мир: баллон

# held-out-остриё: ТРИ ступени (полный→половина→пустой), чужие слова.
# по имени «батарейка», по ФОРМЕ — лестница.

объекты:
  зовутся: баллон

  видимое:
    манометр: [зелёный, жёлтый]      # ловушка: полный → зелёный (85%)
    вентиль: [блестит, тусклый]      # шум

  скрытое:
    давление: [полный, половина, пустой]

  ловушки:
    - если давление=полный то манометр=зелёный (85%)

  гарантии:
    - минимум 3 объектов с давление=полный
    - минимум 2 объектов с давление=пустой

действия:
  проверить_давление:               # зонд, различает три ступени
    - если давление=полный то высокое
    - если давление=половина то среднее
    - иначе нулевое

  открыть_вентиль:                  # использование, бинарно (мертво лишь у пустого)
    - если давление=пустой то шипит_пусто
    - иначе газ_идёт

  встряхнуть:                       # объясняется видимым
    - если манометр=зелёный то тяжёлый
    - иначе лёгкий

динамика:                           # лестница вниз
  каждый_шаг:
    - если давление=полный то шанс_стать половина (4%)
    - если давление=половина то шанс_стать пустой (6%)

вмешательство:
  заправить:
    выбираешь: [манометр, вентиль]
    фиксировано: давление=полный

экзамены:
  - зонд проверить_давление вопрос открыть_вентиль

объектов: 8
