мир: лампочки

объекты:
  зовутся: лампочка

  видимое:
    стекло: [прозрачное, потемневшее]   # ловушка: рабочая → прозрачное (70%)
    цоколь: [чистый, ржавый]            # шумовой

  скрытое:
    исправность: [рабочая, перегоревшая]

  ловушки:
    - если исправность=рабочая то стекло=прозрачное (70%)

  гарантии:
    - минимум 3 объектов с исправность=рабочая

действия:
  вкрутить_в_патрон:                # дешёвый зонд
    - если исправность=рабочая то зажглась
    - иначе темно

  включить_надолго:                 # дорогое
    - если исправность=рабочая то светит [исчезает]
    - иначе не_горит [исчезает]

  потрясти:                         # видимое
    - если цоколь=чистый то тихо
    - иначе дребезжит

динамика:
  каждый_шаг:
    - если исправность=рабочая то шанс_стать перегоревшая (6%)

вмешательство:
  заменить_нить:
    выбираешь: [стекло, цоколь]
    фиксировано: исправность=рабочая

экзамены:
  - зонд вкрутить_в_патрон вопрос включить_надолго

объектов: 6
