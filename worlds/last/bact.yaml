мир: бактерии

# held-out-остриё: ТРИ ступени (здоровые→ослабленные→мёртвые)
# живой организм с постепенным угасанием

объекты:
  зовутся: колония

  видимое:
    цвет: [ярко-белый, бледный]      # ловушка: здоровые → ярко-белый (80%)
    запах: [нейтральный, кислый]     # шумовой

  скрытое:
    жизнеспособность: [здоровые, ослабленные, мёртвые]

  ловушки:
    - если жизнеспособность=здоровые то цвет=ярко-белый (80%)

  гарантии:
    - минимум 3 объектов с жизнеспособность=здоровые
    - минимум 2 объектов с жизнеспособность=мёртвые

действия:
  рассмотреть_под_микроскопом:     # зонд, различает три ступени
    - если жизнеспособность=здоровые то активно_делятся
    - если жизнеспособность=ослабленные то вялые
    - иначе неподвижны

  использовать_в_культуре:          # дорогое действие (бинарно)
    - если жизнеспособность=мёртвые то культура_не_растёт
    - иначе культура_растёт

  встряхнуть_пробирку:              # объясняется видимым
    - если цвет=ярко-белый то равномерно
    - иначе комками

динамика:                           # лестница вниз
  каждый_шаг:
    - если жизнеспособность=здоровые то шанс_стать ослабленные (5%)
    - если жизнеспособность=ослабленные то шанс_стать мёртвые (6%)

вмешательство:
  добавить_питательную_среду:
    выбираешь: [цвет, запах]
    фиксировано: жизнеспособность=здоровые

экзамены:
  - зонд рассмотреть_под_микроскопом вопрос использовать_в_культуре

объектов: 8
