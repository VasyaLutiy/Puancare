мир: бактерии

# held-out-остриё: ТРИ ступени роста (малая→средняя→большая)
# живой организм, который разрастается

объекты:
  зовутся: колония

  видимое:
    размер: [маленькая, большая]      # ловушка: большая → большая (75%)
    цвет: [молочный, насыщенный]      # шумовой

  скрытое:
    размер_колонии: [малая, средняя, большая]

  ловушки:
    - если размер_колонии=большая то размер=большая (75%)

  гарантии:
    - минимум 3 объектов с размер_колонии=большая
    - минимум 2 объектов с размер_колонии=малая

действия:
  рассмотреть_под_микроскопом:      # зонд, различает три ступени
    - если размер_колонии=малая то редкие_клетки
    - если размер_колонии=средняя то умеренный_рост
    - иначе бурно_размножается

  использовать_в_ферментации:       # дорогое действие (бинарно)
    - если размер_колонии=малая то процесс_слабый
    - иначе процесс_активный

  встряхнуть_пробирку:              # объясняется видимым
    - если размер=большая то густая
    - иначе жидкая

динамика:                           # лестница вверх (рост)
  каждый_шаг:
    - если размер_колонии=малая то шанс_стать средняя (12%)
    - если размер_колонии=средняя то шанс_стать большая (10%)

вмешательство:
  добавить_питательную_среду:
    выбираешь: [размер, цвет]
    фиксировано: размер_колонии=большая

экзамены:
  - зонд рассмотреть_под_микроскопом вопрос использовать_в_ферментации

объектов: 8
