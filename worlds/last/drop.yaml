мир: капли

# Стробоскопический эффект на падающих каплях.
# Классический физический пример: при определённой частоте съёмки
# быстрые капли выглядят как медленно падающие или даже ползущие вверх.

объекты:
  зовутся: капля

  видимое:
    положение: [высоко, низко]       # ловушка: стабильная → высоко (70%)
    форма: [круглая, вытянутая]      # шумовой

  скрытое:
    скорость: [стабильная, быстрая]

  ловушки:
    - если скорость=стабильная то положение=высоко (70%)

  гарантии:
    - минимум 4 объектов с скорость=стабильная

действия:
  подсветить:                       # дешёвый зонд (стробоскопическое наблюдение)
    - если скорость=стабильная то кажется_медленной
    - иначе кажется_вверх

  поймать:                          # дорогое — расходует каплю
    - если скорость=стабильная то поймана [исчезает]
    - иначе проскочила [исчезает]

  встряхнуть:                       # объясняется видимым
    - если форма=круглая то упругая
    - иначе вялая

динамика:
  каждый_шаг:
    - если скорость=стабильная то шанс_стать быстрая (18%)
    - если скорость=быстрая то шанс_стать стабильная (82%)   # быстрые перевороты

вмешательство:
  изменить_напор:
    выбираешь: [положение, форма]
    фиксировано: скорость=стабильная

экзамены:
  - зонд подсветить вопрос поймать

объектов: 7
