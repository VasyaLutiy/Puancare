мир: мигалки

# Стробоскопический тест: быстрые перевороты + aliasing/folding
# Два семейства (медленный дрейф vs быстрый переворот) дают похожую
# статистику при редких наблюдениях, но расходятся на коротком интервале

объекты:
  зовутся: мигалка

  видимое:
    цвет: [зелёный, красный]         # ловушка: активная → зелёный (65%)
    размер: [крупная, мелкая]        # шумовой

  скрытое:
    режим: [активный, пассивный]

  ловушки:
    - если режим=активный то цвет=зелёный (65%)

  гарантии:
    - минимум 4 объектов с режим=активный

действия:
  посмотреть:                       # дешёвый зонд (редкое наблюдение)
    - если режим=активный то зелёный_всплеск
    - иначе красный_тусклый

  активировать:                     # дорогое — расходует мигалку
    - если режим=активный то сработала [исчезает]
    - иначе отказ [исчезает]

  постучать:                        # объясняется видимым
    - если размер=крупная то глухо
    - иначе звонко

динамика:
  каждый_шаг:
    - если режим=активный то шанс_стать пассивный (82%)
    - если режим=пассивный то шанс_стать активный (78%)

вмешательство:
  дать_импульс:
    выбираешь: [цвет, размер]
    фиксировано: режим=активный

экзамены:
  - зонд посмотреть вопрос активировать

объектов: 7
