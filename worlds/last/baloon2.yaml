мир: резервуар

# held-out-остриё: ТРИ ступени (полный→половина→пустой), чужие слова.
# по имени «батарейка», по ФОРМЕ — лестница.

объекты:
  зовутся: резервуар

  видимое:
    уровень: [высокий, средний]      # ловушка: полный → высокий (80%)
    краска: [свежая, облупленная]   # шум

  скрытое:
    наполнение: [полный, половина, пустой]

  ловушки:
    - если наполнение=полный то уровень=высокий (80%)

  гарантии:
    - минимум 3 объектов с наполнение=полный
    - минимум 2 объектов с наполнение=пустой

действия:
  измерить:                         # зонд, различает три ступени
    - если наполнение=полный то полный_уровень
    - если наполнение=половина то средний_уровень
    - иначе пустой_уровень

  подключить:                       # использование, бинарно (мертво лишь у пустого)
    - если наполнение=пустой то не_течёт
    - иначе течёт

  постучать:                        # объясняется видимым
    - если уровень=высокий то гулко
    - иначе глухо

динамика:                           # лестница вниз
  каждый_шаг:
    - если наполнение=полный то шанс_стать половина (5%)
    - если наполнение=половина то шанс_стать пустой (5%)

вмешательство:
  залить:
    выбираешь: [уровень, краска]
    фиксировано: наполнение=полный

экзамены:
  - зонд измерить вопрос подключить

объектов: 8
