мир: семена

объекты:
  зовутся: семечко

  видимое:
    оболочка: [целая, потрескавшаяся]   # ловушка: живое → целая (80%)
    цвет: [светлый, тёмный]             # шумовой

  скрытое:
    жизнь: [живое, мёртвое]

  ловушки:
    - если жизнь=живое то оболочка=целая (80%)

  гарантии:
    - минимум 4 объектов с жизнь=живое

действия:
  намочить:                         # дешёвый зонд (не разрушает)
    - если жизнь=живое то набухло
    - иначе размокло_без_толку

  посадить:                         # дорогое — семечко расходуется
    - если жизнь=живое то росток [исчезает]
    - иначе ничего_не_взошло [исчезает]

  сжать:                            # объясняется видимым
    - если оболочка=целая то твёрдое
    - иначе хрустит

динамика:
  каждый_шаг:
    - если жизнь=живое то шанс_стать мёртвое (10%)
    - если жизнь=мёртвое то шанс_стать живое (2%)   # небольшая двусторонность

вмешательство:
  замочить_в_стимуляторе:
    выбираешь: [оболочка, цвет]
    фиксировано: жизнь=живое

экзамены:
  - зонд намочить вопрос посадить

объектов: 9
