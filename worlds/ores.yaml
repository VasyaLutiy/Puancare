мир: руды

объекты:
  зовутся: образец

  видимое:
    блеск: [металлический, стеклянный]
    форма: [кристаллическая, аморфная]
    цвет: [светлый, тёмный]             # шумовой: не влияет ни на одно действие

  скрытое:
    проводимость: [проводит, изолятор]
    реакционность: [активный, инертный]

  ловушки:
    - если проводимость=проводит то блеск=металлический (80%)
    - если реакционность=активный то форма=кристаллическая (75%)
    # две ловушки — каждая по своей оси; вместе складываются в ложное правило:
    # «металлический + кристаллическая → проводит + активный»

  гарантии:
    - минимум 2 объектов с проводимость=проводит
    - минимум 2 объектов с реакционность=активный

сущности:
  зовутся: установка
  штук: 2
  состояния: [рабочая, сломана]
  связаны_с: 1 (проводимость=проводит)

действия:
  потрогать:                           # дешёвый зонд реакционности (не разрушает)
    - если реакционность=активный то тепловатое
    - иначе холодное

  сжечь:                               # разрушает — проводимость по-прежнему без зонда
    - если реакционность=активный то сгорает [исчезает, каскад]
    - иначе не_горит [исчезает]

  растворить:                          # три условия — агент с MAX_CONDS=2 не выразит
    - если проводимость=проводит и реакционность=активный и блеск=металлический то стремительно [исчезает, каскад]
    - если проводимость=проводит и реакционность=активный то бурно [исчезает, каскад]
    - если реакционность=активный то медленно [исчезает]
    - иначе не_реагирует

  взвесить:                            # объясняется видимым (блеск)
    - если блеск=металлический то тяжело
    - иначе легко

  осмотреть @установка:
    - если состояние=рабочая то ток_есть
    - иначе ток_отсутствует

  подключить @установка:
    - если состояние=рабочая то уже_работает
    - если связанный_отсутствует то нет_проводника
    - иначе ок [починка]

вмешательство:
  синтезировать:
    выбираешь: [блеск, форма]
    фиксировано: проводимость=изолятор, реакционность=активный

экзамены:
  - зонд потрогать вопрос сжечь

объектов: 8
