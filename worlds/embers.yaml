мир: угли

# Держи-аут по мотивам батареек, для охоты на хардкод ядра (13 июля).
# Твисты против batteries.yaml: скорость 12% (не 5), динамика
# ДВУСТОРОННЯЯ (погасший может затлеть от соседа — у батареек распад
# поглощающий), ловушка на мёртвом состоянии (не на живом), 7 объектов.

объекты:
  зовутся: уголёк

  видимое:
    цвет: [серый, чёрный]        # ловушка: погас -> серый (пепел), 80%
    размер: [крупный, мелкий]    # влияет только на постучать

  скрытое:
    жар: [тлеет, погас]

  ловушки:
    - если жар=погас то цвет=серый (80%)

  гарантии:
    - минимум 3 объектов с жар=тлеет

действия:
  подуть:                        # дешёвый зонд (не разрушает)
    - если жар=тлеет то вспыхнул
    - иначе только_пепел

  пустить_на_растопку:           # дорогое — уголёк расходуется
    - если жар=тлеет то костёр_занялся [исчезает]
    - иначе костёр_не_занялся [исчезает]

  постучать:                     # объясняется видимым
    - если размер=крупный то глухо
    - иначе звонко

динамика:
  каждый_шаг:
    - если жар=тлеет то шанс_стать погас (12%)
    - если жар=погас то шанс_стать тлеет (3%)

вмешательство:
  принести_из_костра:
    выбираешь: [цвет, размер]
    фиксировано: жар=тлеет

экзамены:
  - зонд подуть вопрос пустить_на_растопку

объектов: 7
