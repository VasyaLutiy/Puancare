мир: батарейки

объекты:
  зовутся: батарейка

  видимое:
    индикатор: [горит, не_горит]    # ловушка: заряжена → горит (85%)
    наклейка: [синяя, красная]      # шумовой

  скрытое:
    заряд: [заряжена, разряжена]

  ловушки:
    - если заряд=заряжена то индикатор=горит (85%)

  гарантии:
    - минимум 3 объектов с заряд=заряжена

действия:
  проверить:                        # дешёвый зонд (не разрушает)
    - если заряд=заряжена то ток_есть
    - иначе ток_нет

  использовать:                     # дорогое — расходует батарейку
    - если заряд=заряжена то работает [исчезает]
    - иначе не_работает [исчезает]

  встряхнуть:                       # объясняется видимым
    - если индикатор=горит то мигнул
    - иначе тихо

динамика:
  каждый_шаг:
    - если заряд=заряжена то шанс_стать разряжена (5%)

вмешательство:
  зарядить:
    выбираешь: [индикатор, наклейка]
    фиксировано: заряд=заряжена

экзамены:
  - зонд проверить вопрос использовать

объектов: 6
