# Кухня, пересобранная из анкеты — регрессия конструктора против exp7.

мир: кухня

объекты:
  зовутся: вещество
  видимое:
    цвет: [красный, зелёный, белый]
    форма: [твёрдое, жидкое]
    происхождение: [лес, сад, рынок]
  скрытое:
    род: [еда, яд]
  ловушки:
    - если род=яд то происхождение=лес (90%)
    - если род=еда то происхождение=сад (50%)
  гарантии:
    - минимум 2 объекта с род=еда

сущности:
  зовутся: блюдо
  штук: 2
  состояния: [свежее, испорчено]
  связаны_с: 1 (род=еда)

действия:
  попробовать:
    - если род=еда то вкусно
    - иначе горько
  съесть:
    - если род=яд то тошнит
    - иначе ок [исчезает, каскад]
  нагреть:
    - если форма=жидкое то кипит
    - иначе обугливается
  порезать:
    - если форма=жидкое то брызги
    - иначе нарезано
  подать @сущность:
    - если состояние=свежее то аплодисменты
    - иначе жалобы
  переделать @сущность:
    - если состояние=свежее то уже_свежее
    - если связанный_отсутствует то нет_ингредиента
    - иначе ок [починка]

вмешательство:
  купить:
    выбираешь: [цвет, форма]
    фиксировано: род=еда, происхождение=рынок

экзамены:
  - зонд попробовать вопрос съесть

объектов: 8
