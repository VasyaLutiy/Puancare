мир: лампочки_изоморф_обращённый_алфавит

объекты:
  зовутся: лампочка

  видимое:
    п_стекло: [а_прозрачное, я_потемневшее]   # ловушка: рабочая → прозрачное (70%)
    а_цоколь: [а_чистый, я_ржавый]            # шумовой

  скрытое:
    я_исправность: [а_рабочая, я_перегоревшая]

  ловушки:
    - если я_исправность=а_рабочая то п_стекло=а_прозрачное (70%)

  гарантии:
    - минимум 3 объектов с я_исправность=а_рабочая

действия:
  п_вкрутить_в_патрон:                # дешёвый зонд
    - если я_исправность=а_рабочая то я_зажглась
    - иначе а_темно

  я_включить_надолго:                 # дорогое
    - если я_исправность=а_рабочая то а_светит [исчезает]
    - иначе я_не_горит [исчезает]

  а_потрясти:                         # видимое
    - если а_цоколь=а_чистый то а_тихо
    - иначе я_дребезжит

динамика:
  каждый_шаг:
    - если я_исправность=а_рабочая то шанс_стать я_перегоревшая (6%)

вмешательство:
  заменить_нить:
    выбираешь: [п_стекло, а_цоколь]
    фиксировано: я_исправность=а_рабочая

экзамены:
  - зонд п_вкрутить_в_патрон вопрос я_включить_надолго

объектов: 6
