мир: донор-мотор-изоморф-обращённый-алфавит

объекты:
  зовутся: движок

  видимое:
    я_индикатор: [я_горит, а_тускл]        # ловушка: полный → горит (80%)

  скрытое:
    а_заряд: [я_полный, а_средний, п_пустой]

  ловушки:
    - если а_заряд=я_полный то я_индикатор=я_горит (80%)

  гарантии:
    - минимум 3 объектов с а_заряд=я_полный
    - минимум 2 объектов с а_заряд=п_пустой

действия:
  а_просветить:                       # зонд: острое чтение трёх ступеней
    - если а_заряд=я_полный то я_пик
    - если а_заряд=а_средний то п_полка
    - иначе а_провал

  я_нагрузить:                        # использование: исход зависит от ступени
    - если а_заряд=я_полный то п_мощно
    - если а_заряд=а_средний то а_слабо
    - иначе я_глохнет

динамика:                           # лестница вниз
  каждый_шаг:
    - если а_заряд=я_полный то шанс_стать а_средний (5%)
    - если а_заряд=а_средний то шанс_стать п_пустой (5%)

вмешательство:
  зарядить:
    фиксировано: а_заряд=я_полный

объектов: 8
