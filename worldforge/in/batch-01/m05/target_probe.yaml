мир: жила_песка
объекты:
  зовутся: комок
  видимое:
    зерно: [мелкое, крупное, пёстрое]
  скрытое:
    степень: [плотный, рыхлый, пыль]
  ловушки:
    - если степень=плотный то зерно=мелкое (68%)
    - если степень=пыль то зерно=пёстрое (62%)
  гарантии:
    - минимум 2 объектов с степень=плотный
    - минимум 2 объектов с степень=рыхлый
    - минимум 1 объектов с степень=пыль
действия:
  прощупать:
    - если степень=плотный то упруго
    - если степень=рыхлый то сыпется
    - иначе пустота
динамика:
  каждый_шаг:
    - если степень=плотный то шанс_стать рыхлый (17%)
    - если степень=рыхлый то шанс_стать пыль (17%)
вмешательство:
  слепить:
    выбираешь: [зерно]
    фиксировано: степень=плотный
объектов: 8
