мир: жила_камня
объекты:
  зовутся: глыба
  видимое:
    оттенок: [серый, рыжий, чёрный]
  скрытое:
    фаза: [целый, трещиноватый, прах]
  ловушки:
    - если фаза=целый то оттенок=серый (70%)
    - если фаза=прах то оттенок=чёрный (65%)
  гарантии:
    - минимум 2 объектов с фаза=целый
    - минимум 2 объектов с фаза=трещиноватый
    - минимум 1 объектов с фаза=прах
действия:
  прощупать:
    - если фаза=целый то звонко
    - если фаза=трещиноватый то глухо
    - иначе крошится
  надавить:
    - если фаза=целый то устояло
    - если фаза=трещиноватый то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если фаза=целый то шанс_стать трещиноватый (20%)
    - если фаза=трещиноватый то шанс_стать прах (20%)
вмешательство:
  высечь:
    выбираешь: [оттенок]
    фиксировано: фаза=целый
экзамены:
  - зонд прощупать вопрос надавить
объектов: 8
