мир: цикл_оборотов
объекты:
  зовутся: сфера
  видимое:
    блеск: [матовый, глянцевый, искристый]
  скрытое:
    оборот: [первый, второй, третий]
  ловушки:
    - если оборот=первый то блеск=матовый (65%)
    - если оборот=третий то блеск=искристый (50%)
  гарантии:
    - минимум 2 объектов с оборот=первый
    - минимум 2 объектов с оборот=второй
    - минимум 2 объектов с оборот=третий
действия:
  покрутить:
    - если оборот=первый то тепло
    - если оборот=второй то холодно
    - иначе горячо
  нажать:
    - если оборот=первый то вспыхнуло
    - если оборот=второй то погасло
    - иначе мигнуло
динамика:
  каждый_шаг:
    - если оборот=первый то шанс_стать второй (28%)
    - если оборот=второй то шанс_стать третий (28%)
    - если оборот=третий то шанс_стать первый (28%)
вмешательство:
  выковать_первый:
    выбираешь: [блеск]
    фиксировано: оборот=первый
экзамены:
  - зонд покрутить вопрос нажать
объектов: 8
