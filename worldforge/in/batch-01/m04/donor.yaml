мир: кольцо_зарядов
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [ясный, мутный, пёстрый]
  скрытое:
    фаза: [заря, полдень, сумерки]
  ловушки:
    - если фаза=заря то оттенок=ясный (70%)
    - если фаза=сумерки то оттенок=пёстрый (55%)
  гарантии:
    - минимум 2 объектов с фаза=заря
    - минимум 2 объектов с фаза=полдень
    - минимум 2 объектов с фаза=сумерки
действия:
  покрутить:
    - если фаза=заря то звенит
    - если фаза=полдень то гудит
    - иначе дребезжит
  нажать:
    - если фаза=заря то вспыхнуло
    - если фаза=полдень то погасло
    - иначе мигнуло
динамика:
  каждый_шаг:
    - если фаза=заря то шанс_стать полдень (28%)
    - если фаза=полдень то шанс_стать сумерки (28%)
    - если фаза=сумерки то шанс_стать заря (28%)
вмешательство:
  добыть_зарю:
    выбираешь: [оттенок]
    фиксировано: фаза=заря
экзамены:
  - зонд покрутить вопрос нажать
объектов: 8
