мир: тумблер_цель
объекты:
  зовутся: сгусток
  видимое:
    фактура: [рыхлый, плотный]
  скрытое:
    режим: [горячий, холодный]
  ловушки:
    - если режим=горячий то фактура=плотный (70%)
  гарантии:
    - минимум 3 объектов с режим=горячий
    - минимум 3 объектов с режим=холодный
действия:
  пощупать:
    - если режим=горячий то пульсирует
    - иначе застыл
динамика:
  каждый_шаг:
    - если режим=горячий то шанс_стать холодный (28%)
    - если режим=холодный то шанс_стать горячий (24%)
вмешательство:
  выделить:
    выбираешь: [фактура]
    фиксировано: режим=горячий
объектов: 8
