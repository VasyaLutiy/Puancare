мир: тумблер_донор
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [матовый, глянцевый]
  скрытое:
    полюс: [плюс, минус]
  ловушки:
    - если полюс=плюс то оттенок=глянцевый (75%)
  гарантии:
    - минимум 3 объектов с полюс=плюс
    - минимум 3 объектов с полюс=минус
действия:
  пощупать:
    - если полюс=плюс то вибрирует
    - иначе молчит
  ударить:
    - если полюс=плюс то вспыхнул
    - иначе погас
динамика:
  каждый_шаг:
    - если полюс=плюс то шанс_стать минус (35%)
    - если полюс=минус то шанс_стать плюс (30%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: полюс=плюс
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
