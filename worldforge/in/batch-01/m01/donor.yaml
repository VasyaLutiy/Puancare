мир: лестница_медленная
объекты:
  зовутся: глыба
  видимое:
    оттенок: [бледный, яркий, тусклый]
  скрытое:
    целостность: [целый, надтреснутый, рыхлый]
  ловушки:
    - если целостность=целый то оттенок=яркий (75%)
    - если целостность=рыхлый то оттенок=тусклый (70%)
  гарантии:
    - минимум 2 объектов с целостность=целый
    - минимум 2 объектов с целостность=надтреснутый
    - минимум 2 объектов с целостность=рыхлый
действия:
  пощупать:
    - если целостность=целый то твёрдый
    - если целостность=надтреснутый то пружинит
    - иначе крошится
  разбить:
    - если целостность=целый то звон
    - если целостность=надтреснутый то хруст
    - иначе пыль [исчезает]
динамика:
  каждый_шаг:
    - если целостность=целый то шанс_стать надтреснутый (5%)
    - если целостность=надтреснутый то шанс_стать рыхлый (5%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: целостность=целый
экзамены:
  - зонд пощупать вопрос разбить
объектов: 8
