мир: спад_мягкий
объекты:
  зовутся: сфера
  видимое:
    блеск: [матовый, глянцевый, мутный]
  скрытое:
    плотность: [сжатый, средний, рассыпчатый]
  ловушки:
    - если плотность=сжатый то блеск=глянцевый (75%)
    - если плотность=рассыпчатый то блеск=мутный (70%)
  гарантии:
    - минимум 2 объектов с плотность=сжатый
    - минимум 2 объектов с плотность=средний
    - минимум 2 объектов с плотность=рассыпчатый
действия:
  пощупать:
    - если плотность=сжатый то гладкий
    - если плотность=средний то податливый
    - иначе сыпется
динамика:
  каждый_шаг:
    - если плотность=сжатый то шанс_стать средний (5%)
    - если плотность=средний то шанс_стать рассыпчатый (5%)
вмешательство:
  отлить:
    выбираешь: [блеск]
    фиксировано: плотность=сжатый
объектов: 8
