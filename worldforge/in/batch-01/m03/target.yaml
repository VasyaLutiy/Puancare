мир: каскад_четырёх_бета
объекты:
  зовутся: слиток
  видимое:
    цвет: [светлый, тёмный]
  скрытое:
    слой: [нутро, корка, щель, пепел]
  ловушки:
    - если слой=нутро то цвет=светлый (72%)
    - если слой=пепел то цвет=тёмный (68%)
  гарантии:
    - минимум 2 объектов с слой=нутро
    - минимум 1 объектов с слой=корка
    - минимум 1 объектов с слой=щель
    - минимум 2 объектов с слой=пепел
действия:
  пощупать:
    - если слой=нутро то упруго
    - если слой=корка то жёстко
    - если слой=щель то ломко
    - иначе пустота
  ударить:
    - если слой=нутро то разлетелось
    - если слой=корка то раскололось
    - если слой=щель то треснуло
    - иначе устояло
динамика:
  каждый_шаг:
    - если слой=нутро то шанс_стать корка (14%)
    - если слой=корка то шанс_стать щель (14%)
    - если слой=щель то шанс_стать пепел (14%)
вмешательство:
  отлить:
    выбираешь: [цвет]
    фиксировано: слой=нутро
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
