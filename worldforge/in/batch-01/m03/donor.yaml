мир: лестница_четырёх_альфа
объекты:
  зовутся: реликт
  видимое:
    поверхность: [гладкая, шершавая]
  скрытое:
    фаза: [целый, надтреснутый, трещиноватый, разрушенный]
  ловушки:
    - если фаза=целый то поверхность=гладкая (75%)
    - если фаза=разрушенный то поверхность=шершавая (70%)
  гарантии:
    - минимум 2 объектов с фаза=целый
    - минимум 1 объектов с фаза=надтреснутый
    - минимум 1 объектов с фаза=трещиноватый
    - минимум 2 объектов с фаза=разрушенный
действия:
  пощупать:
    - если фаза=целый то звенит
    - если фаза=надтреснутый то глухо
    - если фаза=трещиноватый то скрипит
    - иначе крошится
  ударить:
    - если фаза=целый то разлетелось
    - если фаза=надтреснутый то раскололось
    - если фаза=трещиноватый то треснуло
    - иначе устояло
динамика:
  каждый_шаг:
    - если фаза=целый то шанс_стать надтреснутый (14%)
    - если фаза=надтреснутый то шанс_стать трещиноватый (14%)
    - если фаза=трещиноватый то шанс_стать разрушенный (14%)
вмешательство:
  выточить:
    выбираешь: [поверхность]
    фиксировано: фаза=целый
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
