мир: трёхступ_грубый_донор
объекты:
  зовутся: глыба
  видимое:
    оттенок: [рыжий, сизый]
  скрытое:
    заряд: [полный, полу, пуст]
  ловушки:
    - если заряд=полный то оттенок=рыжий (75%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=полу
    - минимум 2 объектов с заряд=пуст
действия:
  пощупать:
    - если заряд=пуст то холодно
    - иначе тёпло
  ударить:
    - если заряд=полный то вспышка
    - если заряд=полу то тление
    - иначе пепел [исчезает]
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать полу (12%)
    - если заряд=полу то шанс_стать пуст (12%)
вмешательство:
  добыть:
    выбираешь: [оттенок]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
