мир: трёхступ_грубый_цель
объекты:
  зовутся: крупинка
  видимое:
    блеск: [матовый, зеркальный]
  скрытое:
    накал: [жар, тепл, выстыл]
  ловушки:
    - если накал=жар то блеск=зеркальный (75%)
  гарантии:
    - минимум 2 объектов с накал=жар
    - минимум 2 объектов с накал=тепл
    - минимум 2 объектов с накал=выстыл
действия:
  пощупать:
    - если накал=выстыл то звон
    - иначе глухо
динамика:
  каждый_шаг:
    - если накал=жар то шанс_стать тепл (12%)
    - если накал=тепл то шанс_стать выстыл (12%)
вмешательство:
  выточить:
    выбираешь: [блеск]
    фиксировано: накал=жар
объектов: 8
