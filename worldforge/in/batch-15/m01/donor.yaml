мир: кристалл_памяти
объекты:
  зовутся: фрагмент
  видимое:
    яркость: [тусклый, мерцающий, яркий]
  скрытое:
    заряд: [нулевой, слабый, критический]
  ловушки:
    - если заряд=нулевой то яркость=тусклый (90%)
  гарантии:
    - минимум 3 объектов с заряд=нулевой
    - минимум 3 объектов с заряд=слабый
действия:
  анализ:
    - если заряд=нулевой то отклик_холод
    - если заряд=слабый то отклик_теплый
    - иначе отклик_жгучий
  активация:
    - если заряд=критический то вспышка [исчезает]
    - иначе гул [починка]
динамика:
  каждый_шаг:
    - если заряд=нулевой то шанс_стать слабый (5%)
    - если заряд=слабый то шанс_стать критический (5%)
вмешательство:
  подзарядка:
    выбираешь: [яркость]
    фиксировано: заряд=слабый
экзамены:
  - зонд анализ вопрос активация
объектов: 9
