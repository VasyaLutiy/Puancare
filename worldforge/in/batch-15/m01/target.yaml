мир: призма_сути
объекты:
  зовутся: грань
  видимое:
    оттенок: [серый, синий, золотой]
  скрытое:
    потенциал: [пустой, накопленный, предел]
  ловушки:
    - если потенциал=пустой то оттенок=серый (90%)
  гарантии:
    - минимум 3 объектов с потенциал=пустой
    - минимум 3 объектов с потенциал=накопленный
действия:
  анализ:
    - если потенциал=пустой то веет_пустотой
    - если потенциал=накопленный то веет_силой
    - иначе веет_опасностью
  активация:
    - если потенциал=предел то вспышка [исчезает]
    - иначе гул [починка]
динамика:
  каждый_шаг:
    - если потенциал=пустой то шанс_стать накопленный (5%)
    - если потенциал=накопленный то шанс_стать предел (5%)
вмешательство:
  питание:
    выбираешь: [оттенок]
    фиксировано: потенциал=накопленный
экзамены:
  - зонд анализ вопрос активация
объектов: 9
