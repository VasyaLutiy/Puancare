мир: кристалл
объекты:
  зовутся: фрагмент
  видимое:
    сияние: [тусклый, яркий]
  скрытое:
    заряд: [низкий, средний, высокий]
  ловушки:
    - если заряд=низкий то сияние=тусклый (90%)
  гарантии:
    - минимум 3 объектов с заряд=низкий
    - минимум 3 объектов с заряд=высокий
действия:
  проверить:
    - если заряд=низкий то холодный
    - если заряд=средний то теплый
    - если заряд=высокий то теплый
  разрядить:
    - если заряд=низкий то щелчок [исчезает]
    - если заряд=средний то треск [исчезает]
    - если заряд=высокий то треск [исчезает]
динамика:
  каждый_шаг:
    - если заряд=низкий то шанс_стать средний (15%)
    - если заряд=средний то шанс_стать высокий (15%)
вмешательство:
  активировать:
    выбираешь: [сияние]
    фиксировано: заряд=высокий
экзамены:
  - зонд проверить вопрос разрядить
объектов: 9
