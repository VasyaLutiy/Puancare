мир: слепок_памяти
объекты:
  зовутся: осколок
  видимое:
    яркость: [тусклый, яркий]
  скрытое:
    вибрация: [высокая, средняя, низкая]
  ловушки:
    - если вибрация=высокая то яркость=яркий (85%)
  гарантии:
    - минимум 3 объектов с вибрация=высокая
действия:
  пощупать:
    - если вибрация=высокая то пульсирует
    - если вибрация=средняя то дрожит
    - иначе замерло
  ударить:
    - если вибрация=низкая то звенит [починка]
    - иначе треснуло [исчезает]
динамика:
  каждый_шаг:
    - если вибрация=высокая то шанс_стать средняя (15%)
    - если вибрация=средняя то шанс_стать низкая (45%)
вмешательство:
  добыть:
    выбираешь: [яркость]
    фиксировано: вибрация=высокая
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
