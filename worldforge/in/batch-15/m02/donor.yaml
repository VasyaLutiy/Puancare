мир: кристалл_судьбы
объекты:
  зовутся: фрагмент
  видимое:
    оттенок: [матовый, блестящий]
  скрытое:
    суть: [активный, затухающий, инертный]
  ловушки:
    - если суть=активный то оттенок=блестящий (90%)
  гарантии:
    - минимум 3 объектов с суть=активный
действия:
  пощупать:
    - если суть=активный то тепло
    - если суть=затухающий то прохладно
    - иначе холодно
  ударить:
    - если суть=инертный то звенит [починка]
    - иначе треснуло [исчезает]
динамика:
  каждый_шаг:
    - если суть=активный то шанс_стать затухающий (20%)
    - если суть=затухающий то шанс_стать инертный (50%)
вмешательство:
  добыть:
    выбираешь: [оттенок]
    фиксировано: суть=активный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
