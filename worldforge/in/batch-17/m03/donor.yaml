мир: Каскад_Лун
объекты:
  зовутся: камень
  видимое:
    цвет: [янтарный, сизый, молочный]
    форма: [гранёная, гладкая]
  скрытое:
    ступень: [искринка, жар, тление, уголь, пепел]
  ловушки:
    - если ступень=искринка то цвет=янтарный (80%)
    - если ступень=жар то форма=гранёная (75%)
    - если ступень=тление то цвет=сизый (80%)
    - если ступень=уголь то форма=гладкая (75%)
  гарантии:
    - минимум 2 объектов с ступень=искринка
    - минимум 2 объектов с ступень=жар
    - минимум 1 объектов с ступень=тление
    - минимум 1 объектов с ступень=уголь
    - минимум 1 объектов с ступень=пепел
действия:
  пощупать:
    - если ступень=искринка то звенит
    - если ступень=жар то щекочет
    - если ступень=тление то гудит
    - если ступень=уголь то немеет
    - если ступень=пепел то осыпается
  ударить:
    - если ступень=искринка то эхо
    - если ступень=жар то щербина
    - если ступень=тление то скол
    - если ступень=уголь то крошево
    - если ступень=пепел то прах
динамика:
  каждый_шаг:
    - если ступень=искринка то шанс_стать жар (30%)
    - если ступень=жар то шанс_стать тление (30%)
    - если ступень=тление то шанс_стать уголь (30%)
    - если ступень=уголь то шанс_стать пепел (30%)
вмешательство:
  добыть:
    выбираешь: [цвет, форма]
    фиксировано: ступень=искринка
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
