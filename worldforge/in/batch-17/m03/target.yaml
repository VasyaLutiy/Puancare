мир: Река_Серых_Семян
объекты:
  зовутся: фрагмент
  видимое:
    оттенок: [медный, ледяной, зелёный]
    поверхность: [ребристая, матовая]
  скрытое:
    фаза: [вспышка, насыщение, дымка, корка, осадок]
  ловушки:
    - если фаза=вспышка то оттенок=медный (80%)
    - если фаза=насыщение то поверхность=ребристая (75%)
    - если фаза=дымка то оттенок=ледяной (80%)
    - если фаза=корка то поверхность=матовая (75%)
  гарантии:
    - минимум 2 объектов с фаза=вспышка
    - минимум 2 объектов с фаза=насыщение
    - минимум 1 объектов с фаза=дымка
    - минимум 1 объектов с фаза=корка
    - минимум 1 объектов с фаза=осадок
действия:
  пощупать:
    - если фаза=вспышка то искрит
    - если фаза=насыщение то пульсирует
    - если фаза=дымка то шелестит
    - если фаза=корка то цепенеет
    - если фаза=осадок то рассыпается
  ударить:
    - если фаза=вспышка то эхо
    - если фаза=насыщение то щербина
    - если фаза=дымка то скол
    - если фаза=корка то крошево
    - если фаза=осадок то прах
динамика:
  каждый_шаг:
    - если фаза=вспышка то шанс_стать насыщение (30%)
    - если фаза=насыщение то шанс_стать дымка (30%)
    - если фаза=дымка то шанс_стать корка (30%)
    - если фаза=корка то шанс_стать осадок (30%)
вмешательство:
  добыть:
    выбираешь: [оттенок, поверхность]
    фиксировано: фаза=вспышка
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
