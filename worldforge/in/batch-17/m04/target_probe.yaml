мир: Лунный_карниз
объекты:
  зовутся: осколок
  видимое:
    тон: [медный, дымчатый, жемчужный]
  скрытое:
    наполнение: [звонкое, редеющее, выжженное]
  ловушки:
    - если наполнение=звонкое то тон=медный (80%)
    - если наполнение=редеющее то тон=дымчатый (75%)
  гарантии:
    - минимум 3 объектов с наполнение=звонкое
    - минимум 2 объектов с наполнение=редеющее
    - минимум 2 объектов с наполнение=выжженное
действия:
  просветить:
    - если наполнение=звонкое то засиял
    - иначе затих
динамика:
  каждый_шаг:
    - если наполнение=звонкое то шанс_стать редеющее (20%)
    - если наполнение=редеющее то шанс_стать выжженное (35%)
вмешательство:
  добыть:
    выбираешь: [тон]
    фиксировано: наполнение=звонкое
объектов: 8
