мир: Седой_предел
объекты:
  зовутся: камень
  видимое:
    оттенок: [янтарный, сизый, молочный]
  скрытое:
    заряд: [искристый, гаснущий, пустой]
  ловушки:
    - если заряд=искристый то оттенок=янтарный (80%)
    - если заряд=гаснущий то оттенок=сизый (75%)
  гарантии:
    - минимум 3 объектов с заряд=искристый
    - минимум 2 объектов с заряд=гаснущий
    - минимум 2 объектов с заряд=пустой
действия:
  просветить:
    - если заряд=искристый то вспыхнул
    - иначе померк
  разломать:
    - если заряд=искристый то отскок
    - если заряд=гаснущий то крошево [исчезает]
    - иначе впитано [исчезает]
динамика:
  каждый_шаг:
    - если заряд=искристый то шанс_стать гаснущий (30%)
    - если заряд=гаснущий то шанс_стать пустой (30%)
вмешательство:
  добыть:
    выбираешь: [оттенок]
    фиксировано: заряд=искристый
экзамены:
  - зонд просветить вопрос разломать
объектов: 8
