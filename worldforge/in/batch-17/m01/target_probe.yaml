мир: Кольцевая_пустошь
объекты:
  зовутся: осколок
  видимое:
    оттенок: [медный, туманный, жемчужный, чернильный]
  скрытое:
    оборот: [восход, полдень, закат]
  ловушки:
    - если оборот=восход то оттенок=медный (79%)
    - если оборот=полдень то оттенок=жемчужный (72%)
    - если оборот=закат то оттенок=чернильный (83%)
  гарантии:
    - минимум 3 объектов с оборот=восход
    - минимум 2 объектов с оборот=полдень
    - минимум 2 объектов с оборот=закат
действия:
  пощупать:
    - если оборот=восход то шелк
    - если оборот=полдень то трель
    - если оборот=закат то иней
динамика:
  каждый_шаг:
    - если оборот=восход то шанс_стать полдень (100%)
    - если оборот=полдень то шанс_стать закат (100%)
    - если оборот=закат то шанс_стать восход (100%)
вмешательство:
  добыть:
    выбираешь: [оттенок]
    фиксировано: оборот=восход
объектов: 8
