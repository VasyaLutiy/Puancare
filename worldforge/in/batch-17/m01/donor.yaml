мир: Кольцевой_сад
объекты:
  зовутся: камень
  видимое:
    цвет: [янтарный, сизый, молочный, угольный]
  скрытое:
    фаза: [заря, зенит, сумерки]
  ловушки:
    - если фаза=заря то цвет=янтарный (78%)
    - если фаза=зенит то цвет=молочный (74%)
    - если фаза=сумерки то цвет=угольный (81%)
  гарантии:
    - минимум 3 объектов с фаза=заря
    - минимум 2 объектов с фаза=зенит
    - минимум 2 объектов с фаза=сумерки
действия:
  пощупать:
    - если фаза=заря то бархат
    - если фаза=зенит то звон
    - если фаза=сумерки то холод
  ударить:
    - если фаза=заря то эхо
    - если фаза=зенит то искры
    - если фаза=сумерки то гул
динамика:
  каждый_шаг:
    - если фаза=заря то шанс_стать зенит (100%)
    - если фаза=зенит то шанс_стать сумерки (100%)
    - если фаза=сумерки то шанс_стать заря (100%)
вмешательство:
  добыть:
    выбираешь: [цвет]
    фиксировано: фаза=заря
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
