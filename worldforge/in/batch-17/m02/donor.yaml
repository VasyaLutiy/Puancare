мир: Перекатный_свод
объекты:
  зовутся: камень
  видимое:
    цвет: [янтарный, синий, белый]
  скрытое:
    заряд: [заряжен, разряжен]
  ловушки:
    - если заряд=заряжен то цвет=янтарный (80%)
  гарантии:
    - минимум 3 объектов с заряд=заряжен
    - минимум 3 объектов с заряд=разряжен
действия:
  проверить:
    - если заряд=заряжен то звенит
    - иначе немой
  применить:
    - если заряд=заряжен то сработало [починка]
    - иначе сорвалось [исчезает]
динамика:
  каждый_шаг:
    - если заряд=заряжен то шанс_стать разряжен (35%)
    - если заряд=разряжен то шанс_стать заряжен (35%)
вмешательство:
  добыть:
    выбираешь: [цвет]
    фиксировано: заряд=заряжен
экзамены:
  - зонд проверить вопрос применить
объектов: 8
