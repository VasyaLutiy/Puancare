мир: Переливчатая_расщелина
объекты:
  зовутся: фрагмент
  видимое:
    оттенок: [медный, лазурный, молочный]
  скрытое:
    импульс: [искристый, глухой]
  ловушки:
    - если импульс=искристый то оттенок=медный (80%)
  гарантии:
    - минимум 3 объектов с импульс=искристый
    - минимум 3 объектов с импульс=глухой
действия:
  проверить:
    - если импульс=искристый то шелестит
    - иначе молчит
  применить:
    - если импульс=искристый то сработало [починка]
    - иначе сорвалось [исчезает]
динамика:
  каждый_шаг:
    - если импульс=искристый то шанс_стать глухой (28%)
    - если импульс=глухой то шанс_стать искристый (28%)
вмешательство:
  добыть:
    выбираешь: [оттенок]
    фиксировано: импульс=искристый
экзамены:
  - зонд проверить вопрос применить
объектов: 8
