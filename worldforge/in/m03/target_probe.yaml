мир: каскад_ярусов
объекты:
  зовутся: оболочка
  видимое:
    фактура: [гладкая, шероховатая, зернистая]
  скрытое:
    ярус: [верхний, средний, нижний, донный]
  ловушки:
    - если ярус=верхний то фактура=гладкая (70%)
    - если ярус=донный то фактура=зернистая (75%)
  гарантии:
    - минимум 2 объектов с ярус=верхний
    - минимум 2 объектов с ярус=донный
действия:
  пощупать:
    - если ярус=верхний то упруго
    - если ярус=средний то вязко
    - если ярус=нижний то ломко
    - иначе пыль
динамика:
  каждый_шаг:
    - если ярус=верхний то шанс_стать средний (12%)
    - если ярус=средний то шанс_стать нижний (12%)
    - если ярус=нижний то шанс_стать донный (12%)
вмешательство:
  сотворить:
    выбираешь: [фактура]
    фиксировано: ярус=верхний
объектов: 8
