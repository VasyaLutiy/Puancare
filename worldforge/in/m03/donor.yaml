мир: цепь_глубин
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [бледный, яркий, тусклый]
  скрытое:
    ступень: [нулевая, первая, вторая, третья]
  ловушки:
    - если ступень=нулевая то оттенок=яркий (70%)
    - если ступень=третья то оттенок=тусклый (75%)
  гарантии:
    - минимум 2 объектов с ступень=нулевая
    - минимум 2 объектов с ступень=третья
действия:
  пощупать:
    - если ступень=нулевая то звонко
    - если ступень=первая то глухо
    - если ступень=вторая то хрупко
    - иначе молчит
  ударить:
    - если ступень=нулевая то отскочило
    - если ступень=первая то треснуло
    - если ступень=вторая то раскололось
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если ступень=нулевая то шанс_стать первая (12%)
    - если ступень=первая то шанс_стать вторая (12%)
    - если ступень=вторая то шанс_стать третья (12%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: ступень=нулевая
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
