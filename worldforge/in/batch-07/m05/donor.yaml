мир: лестница_четырёх_донор
объекты:
  зовутся: узел
  видимое:
    блеск: [яркий, средний, тусклый]
  скрытое:
    фаза: [первая, вторая, третья, четвёртая]
  ловушки:
    - если фаза=первая то блеск=яркий (72%)
    - если фаза=четвёртая то блеск=тусклый (78%)
  гарантии:
    - минимум 2 объектов с фаза=первая
    - минимум 2 объектов с фаза=вторая
действия:
  пощупать:
    - если фаза=первая то упруго
    - если фаза=вторая то вязко
    - если фаза=третья то рыхло
    - если фаза=четвёртая то порошок
  ударить:
    - если фаза=первая то звон
    - если фаза=вторая то хруст
    - если фаза=третья то осыпалось
    - если фаза=четвёртая то прах [исчезает]
динамика:
  каждый_шаг:
    - если фаза=первая то шанс_стать вторая (14%)
    - если фаза=вторая то шанс_стать третья (14%)
    - если фаза=третья то шанс_стать четвёртая (14%)
вмешательство:
  выковать:
    выбираешь: [блеск]
    фиксировано: фаза=первая
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
