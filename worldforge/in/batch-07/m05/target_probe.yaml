мир: лестница_четырёх_цель
объекты:
  зовутся: плита
  видимое:
    зерно: [крупное, среднее, мелкое]
  скрытое:
    запас: [избыток, норма, дефицит, истощение]
  ловушки:
    - если запас=избыток то зерно=крупное (72%)
    - если запас=истощение то зерно=мелкое (78%)
  гарантии:
    - минимум 2 объектов с запас=избыток
    - минимум 2 объектов с запас=норма
действия:
  пощупать:
    - если запас=избыток то плотно
    - если запас=норма то податливо
    - если запас=дефицит то тонко
    - если запас=истощение то пусто
динамика:
  каждый_шаг:
    - если запас=избыток то шанс_стать норма (14%)
    - если запас=норма то шанс_стать дефицит (14%)
    - если запас=дефицит то шанс_стать истощение (14%)
вмешательство:
  отлить:
    выбираешь: [зерно]
    фиксировано: запас=избыток
объектов: 8
