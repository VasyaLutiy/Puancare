мир: фазовый_кувырок
объекты:
  зовутся: капля
  видимое:
    фактура: [ровная, рябая]
  скрытое:
    фаза: [вход, выход]
  ловушки:
    - если фаза=вход то фактура=ровная (72%)
  гарантии:
    - минимум 3 объектов с фаза=вход
    - минимум 3 объектов с фаза=выход
действия:
  потрогать:
    - если фаза=вход то упруго
    - иначе вязко
  разбить:
    - если фаза=вход то звон
    - иначе треск [исчезает]
динамика:
  каждый_шаг:
    - если фаза=вход то шанс_стать выход (33%)
    - если фаза=выход то шанс_стать вход (33%)
вмешательство:
  отлить:
    выбираешь: [фактура]
    фиксировано: фаза=вход
экзамены:
  - зонд потрогать вопрос разбить
объектов: 8
