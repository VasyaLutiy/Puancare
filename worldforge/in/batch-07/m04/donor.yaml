мир: полярный_перещёлк
объекты:
  зовутся: осколок
  видимое:
    оттенок: [тусклый, сияющий]
  скрытое:
    полюс: [северный, южный]
  ловушки:
    - если полюс=северный то оттенок=сияющий (75%)
  гарантии:
    - минимум 3 объектов с полюс=северный
    - минимум 3 объектов с полюс=южный
действия:
  потрогать:
    - если полюс=северный то тепло
    - иначе стужа
  разбить:
    - если полюс=северный то звон
    - иначе треск [исчезает]
динамика:
  каждый_шаг:
    - если полюс=северный то шанс_стать южный (30%)
    - если полюс=южный то шанс_стать северный (30%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: полюс=северный
экзамены:
  - зонд потрогать вопрос разбить
объектов: 8
