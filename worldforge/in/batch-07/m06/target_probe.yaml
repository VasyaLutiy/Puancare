мир: валун_сток_цель
объекты:
  зовутся: валун
  видимое:
    фактура: [шершавый, гладкий]
  скрытое:
    стадия: [мягкий, сбитый, окаменелый]
  ловушки:
    - если стадия=мягкий то фактура=шершавый (70%)
  гарантии:
    - минимум 3 объектов с стадия=мягкий
    - минимум 2 объектов с стадия=сбитый
действия:
  пощупать:
    - если стадия=мягкий то пухнеет
    - если стадия=сбитый то плотно
    - иначе холодит
динамика:
  каждый_шаг:
    - если стадия=мягкий то шанс_стать сбитый (12%)
    - если стадия=сбитый то шанс_стать окаменелый (22%)
вмешательство:
  высечь:
    выбираешь: [фактура]
    фиксировано: стадия=мягкий
объектов: 8
