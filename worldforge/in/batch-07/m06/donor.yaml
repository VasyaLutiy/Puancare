мир: глыба_сток_донор
объекты:
  зовутся: глыба
  видимое:
    блеск: [матовый, глянцевый]
  скрытое:
    фаза: [рыхлый, слежавшийся, кристалл]
  ловушки:
    - если фаза=рыхлый то блеск=матовый (75%)
  гарантии:
    - минимум 3 объектов с фаза=рыхлый
    - минимум 2 объектов с фаза=слежавшийся
действия:
  пощупать:
    - если фаза=рыхлый то крошится
    - если фаза=слежавшийся то упруго
    - иначе звенело
  ударить:
    - если фаза=кристалл то отскочило
    - если фаза=слежавшийся то гул
    - иначе треск [исчезает]
динамика:
  каждый_шаг:
    - если фаза=рыхлый то шанс_стать слежавшийся (15%)
    - если фаза=слежавшийся то шанс_стать кристалл (25%)
вмешательство:
  добыть:
    выбираешь: [блеск]
    фиксировано: фаза=рыхлый
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
