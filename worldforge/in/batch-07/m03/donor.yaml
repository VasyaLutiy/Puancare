мир: капсульный_распад
объекты:
  зовутся: капсула
  видимое:
    цвет: [светлый, тёмный]
  скрытое:
    заряд: [полный, средний, пустой]
  ловушки:
    - если заряд=полный то цвет=светлый (70%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=средний
    - минимум 2 объектов с заряд=пустой
действия:
  пощупать:
    - если заряд=полный то твёрдо
    - если заряд=средний то упруго
    - иначе рыхло
  ударить:
    - если заряд=полный то отскочило
    - если заряд=средний то смялось
    - иначе разбилось [исчезает]
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (12%)
    - если заряд=средний то шанс_стать пустой (12%)
вмешательство:
  зарядить:
    выбираешь: [цвет]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
