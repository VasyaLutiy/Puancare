мир: сгусток_истечение
объекты:
  зовутся: сгусток
  видимое:
    блеск: [матовый, глянцевый]
  скрытое:
    густота: [густой, жидкий, тонкий]
  ловушки:
    - если густота=густой то блеск=глянцевый (65%)
  гарантии:
    - минимум 2 объектов с густота=густой
    - минимум 2 объектов с густота=жидкий
    - минимум 2 объектов с густота=тонкий
действия:
  пощупать:
    - если густота=густой то вязко
    - иначе склизко
  ударить:
    - если густота=густой то отскочило
    - если густота=жидкий то смялось
    - иначе разбилось [исчезает]
динамика:
  каждый_шаг:
    - если густота=густой то шанс_стать жидкий (12%)
    - если густота=жидкий то шанс_стать тонкий (12%)
вмешательство:
  сгустить:
    выбираешь: [блеск]
    фиксировано: густота=густой
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
