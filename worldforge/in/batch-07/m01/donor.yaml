мир: кольцо_фаз_донор
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, глянцевый, искрящийся]
  скрытое:
    фаза: [альфа, бета, гамма]
  ловушки:
    - если фаза=альфа то блеск=матовый (70%)
  гарантии:
    - минимум 2 объектов с фаза=альфа
    - минимум 2 объектов с фаза=бета
    - минимум 2 объектов с фаза=гамма
действия:
  пощупать:
    - если фаза=альфа то тепло
    - если фаза=бета то вибрация
    - иначе холод
  ударить:
    - если фаза=альфа то гудит
    - если фаза=бета то треск
    - иначе вспышка
динамика:
  каждый_шаг:
    - если фаза=альфа то шанс_стать бета (30%)
    - если фаза=бета то шанс_стать гамма (30%)
    - если фаза=гамма то шанс_стать альфа (30%)
вмешательство:
  выплавить:
    выбираешь: [блеск]
    фиксировано: фаза=альфа
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
