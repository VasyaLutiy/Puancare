мир: цикл_нод_цель
объекты:
  зовутся: узел
  видимое:
    тон: [низкий, средний, высокий]
  скрытое:
    цикл: [узел_р, узел_с, узел_т]
  ловушки:
    - если цикл=узел_р то тон=низкий (70%)
  гарантии:
    - минимум 2 объектов с цикл=узел_р
    - минимум 2 объектов с цикл=узел_с
    - минимум 2 объектов с цикл=узел_т
действия:
  пощупать:
    - если цикл=узел_р то шелест
    - если цикл=узел_с то пульс
    - иначе звон
динамика:
  каждый_шаг:
    - если цикл=узел_р то шанс_стать узел_с (30%)
    - если цикл=узел_с то шанс_стать узел_т (30%)
    - если цикл=узел_т то шанс_стать узел_р (30%)
вмешательство:
  внедрить:
    выбираешь: [тон]
    фиксировано: цикл=узел_р
объектов: 8
