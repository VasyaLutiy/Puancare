мир: кольцо_стадий
объекты:
  зовутся: сфера
  видимое:
    блеск: [тусклый, яркий, мерцающий]
  скрытое:
    стадия: [нуль, один, два]
  ловушки:
    - если стадия=нуль то блеск=тусклый (65%)
    - если стадия=один то блеск=яркий (80%)
  гарантии:
    - минимум 2 объектов с стадия=нуль
    - минимум 2 объектов с стадия=один
    - минимум 2 объектов с стадия=два
действия:
  пощупать:
    - если стадия=нуль то гладко
    - если стадия=один то шершаво
    - иначе липко
  ударить:
    - если стадия=нуль то звенит
    - если стадия=один то глухо
    - иначе треснуло
динамика:
  каждый_шаг:
    - если стадия=нуль то шанс_стать один (15%)
    - если стадия=один то шанс_стать два (15%)
    - если стадия=два то шанс_стать нуль (15%)
вмешательство:
  выплавить:
    выбираешь: [блеск]
    фиксировано: стадия=нуль
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
