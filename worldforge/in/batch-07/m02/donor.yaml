мир: орбита_потока
объекты:
  зовутся: камень
  видимое:
    отлив: [серый, рыжий, сизый]
  скрытое:
    фаза: [альфа, бета, гамма]
  ловушки:
    - если фаза=альфа то отлив=серый (75%)
    - если фаза=гамма то отлив=сизый (70%)
  гарантии:
    - минимум 2 объектов с фаза=альфа
    - минимум 2 объектов с фаза=бета
    - минимум 2 объектов с фаза=гамма
действия:
  пощупать:
    - если фаза=альфа то тепло
    - если фаза=бета то зябко
    - иначе влажно
  ударить:
    - если фаза=альфа то звенит
    - если фаза=бета то глухо
    - иначе треснуло
динамика:
  каждый_шаг:
    - если фаза=альфа то шанс_стать бета (12%)
    - если фаза=бета то шанс_стать гамма (12%)
    - если фаза=гамма то шанс_стать альфа (12%)
вмешательство:
  выточить:
    выбираешь: [отлив]
    фиксировано: фаза=альфа
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
