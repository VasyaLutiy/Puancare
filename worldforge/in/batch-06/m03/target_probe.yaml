мир: цикл_назад
объекты:
  зовутся: осколок
  видимое:
    фактура: [гладкая, шершавая]
  скрытое:
    виток: [зенит, клин, надир]
  ловушки:
    - если виток=зенит то фактура=гладкая (70%)
  гарантии:
    - минимум 2 объектов с виток=зенит
    - минимум 2 объектов с виток=клин
    - минимум 2 объектов с виток=надир
действия:
  пощупать:
    - если виток=зенит то липко
    - если виток=клин то сухо
    - иначе звонко
динамика:
  каждый_шаг:
    - если виток=зенит то шанс_стать надир (28%)
    - если виток=надир то шанс_стать клин (28%)
    - если виток=клин то шанс_стать зенит (28%)
вмешательство:
  выплавить:
    выбираешь: [фактура]
    фиксировано: виток=зенит
объектов: 8
