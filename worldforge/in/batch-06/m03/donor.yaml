мир: цикл_вперёд
объекты:
  зовутся: глыба
  видимое:
    блеск: [матовый, зеркальный]
  скрытое:
    ступень: [искра, пламя, уголь]
  ловушки:
    - если ступень=искра то блеск=зеркальный (75%)
  гарантии:
    - минимум 2 объектов с ступень=искра
    - минимум 2 объектов с ступень=пламя
    - минимум 2 объектов с ступень=уголь
действия:
  пощупать:
    - если ступень=искра то тепло
    - если ступень=пламя то вибрация
    - иначе холод
  ударить:
    - если ступень=искра то гул
    - если ступень=пламя то треск
    - иначе пыль
динамика:
  каждый_шаг:
    - если ступень=искра то шанс_стать пламя (28%)
    - если ступень=пламя то шанс_стать уголь (28%)
    - если ступень=уголь то шанс_стать искра (28%)
вмешательство:
  высечь:
    выбираешь: [блеск]
    фиксировано: ступень=искра
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
