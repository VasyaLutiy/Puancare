мир: кольцо_медленной_фазы
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [голубой, янтарный, пепельный]
  скрытое:
    цикл: [заря, полдень, сумерки]
  ловушки:
    - если цикл=заря то оттенок=голубой (70%)
    - если цикл=полдень то оттенок=янтарный (65%)
  гарантии:
    - минимум 2 объектов с цикл=заря
    - минимум 2 объектов с цикл=полдень
    - минимум 2 объектов с цикл=сумерки
действия:
  пощупать:
    - если цикл=заря то тёплый
    - если цикл=полдень то горячий
    - иначе холодный
  ударить:
    - если цикл=заря то звон
    - если цикл=полдень то треск
    - иначе глухо
динамика:
  каждый_шаг:
    - если цикл=заря то шанс_стать полдень (3%)
    - если цикл=полдень то шанс_стать сумерки (3%)
    - если цикл=сумерки то шанс_стать заря (3%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: цикл=заря
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
