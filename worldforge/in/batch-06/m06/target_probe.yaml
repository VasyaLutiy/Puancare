мир: вихрь_быстрой_орбиты
объекты:
  зовутся: реликвия
  видимое:
    фактура: [гладкая, шершавая, узорчатая]
  скрытое:
    орбита: [ноль, один, два]
  ловушки:
    - если орбита=ноль то фактура=гладкая (68%)
    - если орбита=один то фактура=шершавая (60%)
  гарантии:
    - минимум 2 объектов с орбита=ноль
    - минимум 2 объектов с орбита=один
    - минимум 2 объектов с орбита=два
действия:
  пощупать:
    - если орбита=ноль то бархатный
    - если орбита=один то упругий
    - иначе гулкий
динамика:
  каждый_шаг:
    - если орбита=ноль то шанс_стать один (15%)
    - если орбита=один то шанс_стать два (15%)
    - если орбита=два то шанс_стать ноль (15%)
вмешательство:
  призвать:
    выбираешь: [фактура]
    фиксировано: орбита=ноль
объектов: 8
