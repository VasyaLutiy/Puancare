мир: кольцо_фаз
объекты:
  зовутся: сфера
  видимое:
    оттенок: [красный, синий]
  скрытое:
    фаза: [альфа, бета, гамма]
  ловушки:
    - если фаза=альфа то оттенок=красный (75%)
  гарантии:
    - минимум 2 объектов с фаза=альфа
    - минимум 2 объектов с фаза=бета
    - минимум 2 объектов с фаза=гамма
действия:
  пощупать:
    - если фаза=альфа то гудит
    - если фаза=бета то шепчет
    - иначе молчит
динамика:
  каждый_шаг:
    - если фаза=альфа то шанс_стать бета (35%)
    - если фаза=бета то шанс_стать гамма (35%)
    - если фаза=гамма то шанс_стать альфа (35%)
вмешательство:
  установить:
    выбираешь: [оттенок]
    фиксировано: фаза=альфа
объектов: 8
