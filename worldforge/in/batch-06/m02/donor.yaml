мир: лестница_заряда
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, зеркальный]
  скрытое:
    заряд: [полный, средний, пустой]
  ловушки:
    - если заряд=полный то блеск=зеркальный (70%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=средний
    - минимум 2 объектов с заряд=пустой
действия:
  пощупать:
    - если заряд=полный то тёплый
    - если заряд=средний то прохладный
    - иначе холодный
  вскрыть:
    - если заряд=полный то вспышка
    - если заряд=средний то искра
    - иначе тлеет
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (35%)
    - если заряд=средний то шанс_стать пустой (35%)
вмешательство:
  наполнить:
    выбираешь: [блеск]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос вскрыть
объектов: 8
