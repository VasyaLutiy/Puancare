мир: спуск_уровней
объекты:
  зовутся: слэб
  видимое:
    тон: [алый, серый, чёрный]
  скрытое:
    ступень: [верх, середина, низ]
  ловушки:
    - если ступень=верх то тон=алый (75%)
  гарантии:
    - минимум 2 объектов с ступень=верх
    - минимум 2 объектов с ступень=середина
    - минимум 2 объектов с ступень=низ
действия:
  тронуть:
    - если ступень=верх то гладко
    - если ступень=середина то шершаво
    - иначе остро
динамика:
  каждый_шаг:
    - если ступень=верх то шанс_стать середина (12%)
    - если ступень=середина то шанс_стать низ (12%)
вмешательство:
  вырезать:
    выбираешь: [тон]
    фиксировано: ступень=верх
объектов: 8
