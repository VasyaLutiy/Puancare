мир: кольцо_фаз
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [палевый, сизый, бурый]
  скрытое:
    цикл: [фаза_a, фаза_b, фаза_c]
  ловушки:
    - если цикл=фаза_a то оттенок=палевый (70%)
  гарантии:
    - минимум 2 объектов с цикл=фаза_a
    - минимум 2 объектов с цикл=фаза_b
    - минимум 2 объектов с цикл=фаза_c
действия:
  тронуть:
    - если цикл=фаза_a то тепло
    - если цикл=фаза_b то тепловато
    - иначе холодно
  встряхнуть:
    - если цикл=фаза_a то звенит
    - если цикл=фаза_b то молчит
    - иначе трещит
динамика:
  каждый_шаг:
    - если цикл=фаза_a то шанс_стать фаза_b (12%)
    - если цикл=фаза_b то шанс_стать фаза_c (12%)
    - если цикл=фаза_c то шанс_стать фаза_a (12%)
вмешательство:
  выплавить:
    выбираешь: [оттенок]
    фиксировано: цикл=фаза_a
экзамены:
  - зонд тронуть вопрос встряхнуть
объектов: 8
