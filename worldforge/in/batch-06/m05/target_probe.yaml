мир: спад_тока
объекты:
  зовутся: ваттник
  видимое:
    оттенок: [багровый, лазурный, оливковый]
    плотность: [рыхлый, плотный]
  скрытое:
    ток: [высокий, средний, низкий]
  ловушки:
    - если ток=высокий то оттенок=багровый (68%)
    - если ток=низкий то плотность=рыхлый (55%)
  гарантии:
    - минимум 2 объектов с ток=высокий
    - минимум 2 объектов с ток=средний
    - минимум 2 объектов с ток=низкий
действия:
  потрогать:
    - если ток=высокий то бархатный
    - если ток=средний то шершавый
    - иначе колючий
динамика:
  каждый_шаг:
    - если ток=высокий то шанс_стать средний (16%)
    - если ток=средний то шанс_стать низкий (16%)
вмешательство:
  извлечь:
    выбираешь: [оттенок]
    фиксировано: ток=высокий
объектов: 8
