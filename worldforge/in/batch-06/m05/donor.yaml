мир: каскад_искр
объекты:
  зовутся: кристалл
  видимое:
    цвет: [алый, сизый, зелёный]
    вес: [лёгкий, тяжёлый]
  скрытое:
    заряд: [полный, средний, пустой]
  ловушки:
    - если заряд=полный то цвет=алый (72%)
    - если заряд=пустой то вес=лёгкий (58%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=средний
    - минимум 2 объектов с заряд=пустой
действия:
  потрогать:
    - если заряд=полный то тёплый
    - если заряд=средний то прохладный
    - иначе холодный
  запустить:
    - если заряд=полный то гудит
    - если заряд=средний то шипит
    - иначе молчит
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (16%)
    - если заряд=средний то шанс_стать пустой (16%)
    - если заряд=пустой то шанс_стать полный (3%)
вмешательство:
  добыть:
    выбираешь: [цвет]
    фиксировано: заряд=полный
экзамены:
  - зонд потрогать вопрос запустить
объектов: 8
