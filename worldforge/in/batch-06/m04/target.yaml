мир: цикл_роста
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [прозрачный, мутный]
  скрытое:
    стадия: [росток, ствол, крона]
  ловушки:
    - если стадия=росток то оттенок=прозрачный (75%)
  гарантии:
    - минимум 2 объектов с стадия=росток
    - минимум 2 объектов с стадия=ствол
    - минимум 2 объектов с стадия=крона
действия:
  пощупать:
    - если стадия=росток то зыбко
    - если стадия=ствол то упруго
    - иначе твёрдо
  ударить:
    - если стадия=росток то гулко
    - если стадия=ствол то звонко
    - иначе глухо
динамика:
  каждый_шаг:
    - если стадия=росток то шанс_стать ствол (35%)
    - если стадия=ствол то шанс_стать крона (35%)
    - если стадия=крона то шанс_стать росток (35%)
вмешательство:
  вырастить:
    выбираешь: [оттенок]
    фиксировано: стадия=росток
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
