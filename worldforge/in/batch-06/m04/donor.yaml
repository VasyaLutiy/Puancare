мир: кольцо_фаз
объекты:
  зовутся: сфера
  видимое:
    блеск: [матовый, глянцевый]
  скрытое:
    фаза: [заря, полдень, закат]
  ловушки:
    - если фаза=заря то блеск=матовый (70%)
  гарантии:
    - минимум 2 объектов с фаза=заря
    - минимум 2 объектов с фаза=полдень
    - минимум 2 объектов с фаза=закат
действия:
  пощупать:
    - если фаза=заря то тепло
    - если фаза=полдень то обжигает
    - иначе прохладно
  ударить:
    - если фаза=заря то гулко
    - если фаза=полдень то звонко
    - иначе глухо
динамика:
  каждый_шаг:
    - если фаза=заря то шанс_стать полдень (35%)
    - если фаза=полдень то шанс_стать закат (35%)
    - если фаза=закат то шанс_стать заря (35%)
вмешательство:
  сотворить:
    выбираешь: [блеск]
    фиксировано: фаза=заря
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
