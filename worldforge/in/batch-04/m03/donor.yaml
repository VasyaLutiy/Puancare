мир: эхо_тумблер
объекты:
  зовутся: плита
  видимое:
    фактура: [шероховатая, гладкая]
  скрытое:
    полюс: [север, юг]
  ловушки:
    - если полюс=север то фактура=шероховатая (78%)
  гарантии:
    - минимум 3 объектов с полюс=север
    - минимум 3 объектов с полюс=юг
действия:
  пощупать:
    - если полюс=север то мягко
    - иначе колется
  ударить:
    - если полюс=юг то отскочило
    - иначе разбилось [исчезает]
динамика:
  каждый_шаг:
    - если полюс=север то шанс_стать юг (18%)
    - если полюс=юг то шанс_стать север (6%)
вмешательство:
  добыть:
    выбираешь: [фактура]
    фиксировано: полюс=север
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
