мир: пульс_сдвиг
объекты:
  зовутся: сфера
  видимое:
    тон: [холодный, тёплый]
  скрытое:
    заряд: [плюс, минус]
  ловушки:
    - если заряд=плюс то тон=холодный (72%)
  гарантии:
    - минимум 3 объектов с заряд=плюс
    - минимум 3 объектов с заряд=минус
действия:
  пощупать:
    - если заряд=плюс то звон
    - иначе глухо
  ударить:
    - если заряд=минус то отскочило
    - иначе разбилось [исчезает]
динамика:
  каждый_шаг:
    - если заряд=плюс то шанс_стать минус (20%)
    - если заряд=минус то шанс_стать плюс (5%)
вмешательство:
  сотворить:
    выбираешь: [тон]
    фиксировано: заряд=плюс
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
