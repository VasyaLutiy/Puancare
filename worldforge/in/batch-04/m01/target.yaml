мир: тихая_цепь
объекты:
  зовутся: сфера
  видимое:
    фактура: [гладкая, шершавая, пористая]
  скрытое:
    фаза: [заряжена, полузаряжена, исчерпана]
  ловушки:
    - если фаза=заряжена то фактура=гладкая (75%)
  гарантии:
    - минимум 3 объектов с фаза=заряжена
    - минимум 2 объектов с фаза=полузаряжена
действия:
  пощупать:
    - если фаза=заряжена то пульсирует
    - если фаза=полузаряжена то дрожит
    - иначе молчит
  ударить:
    - если фаза=заряжена то раскололось [исчезает]
    - если фаза=полузаряжена то треснуло
    - иначе отскочило
динамика:
  каждый_шаг:
    - если фаза=заряжена то шанс_стать полузаряжена (5%)
    - если фаза=полузаряжена то шанс_стать исчерпана (5%)
вмешательство:
  сотворить:
    выбираешь: [фактура]
    фиксировано: фаза=заряжена
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
