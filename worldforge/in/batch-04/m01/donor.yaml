мир: медленная_лестница
объекты:
  зовутся: камень
  видимое:
    оттенок: [красный, синий, зелёный]
  скрытое:
    уровень: [верх, середина, низ]
  ловушки:
    - если уровень=верх то оттенок=красный (70%)
  гарантии:
    - минимум 3 объектов с уровень=верх
    - минимум 2 объектов с уровень=середина
действия:
  пощупать:
    - если уровень=верх то тепло
    - если уровень=середина то тепловато
    - иначе холодно
  ударить:
    - если уровень=верх то раскололось [исчезает]
    - если уровень=середина то треснуло
    - иначе отскочило
динамика:
  каждый_шаг:
    - если уровень=верх то шанс_стать середина (5%)
    - если уровень=середина то шанс_стать низ (5%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: уровень=верх
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
