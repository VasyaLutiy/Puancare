мир: распад_ядра_альфа
объекты:
  зовутся: крупица
  видимое:
    оттенок: [ройный, пепельный]
  скрытое:
    ток: [бьёт, гас]
  ловушки:
    - если ток=бьёт то оттенок=ройный (78%)
  гарантии:
    - минимум 3 объектов с ток=бьёт
    - минимум 2 объектов с ток=гас
действия:
  пощупать:
    - если ток=бьёт то тёплое
    - иначе ледяное
  ударить:
    - если ток=бьёт то вспыхнуло
    - иначе труп
динамика:
  каждый_шаг:
    - если ток=бьёт то шанс_стать гас (20%)
вмешательство:
  зарядить:
    выбираешь: [оттенок]
    фиксировано: ток=бьёт
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
