мир: увядание_искры_бета
объекты:
  зовутся: сгусток
  видимое:
    рельеф: [гладкий, трещин]
  скрытое:
    пульс: [живой, стылый]
  ловушки:
    - если пульс=живой то рельеф=гладкий (72%)
  гарантии:
    - минимум 3 объектов с пульс=живой
    - минимум 2 объектов с пульс=стылый
действия:
  пощупать:
    - если пульс=живой то дрожит
    - иначе немой
  ударить:
    - если пульс=живой то вспыхнуло
    - иначе труп
динамика:
  каждый_шаг:
    - если пульс=живой то шанс_стать стылый (14%)
вмешательство:
  оживить:
    выбираешь: [рельеф]
    фиксировано: пульс=живой
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
