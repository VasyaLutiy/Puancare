мир: лесенка_медленная
объекты:
  зовутся: камень
  видимое:
    оттенок: [матовый, блестящий]
  скрытое:
    фаза: [плот, рых, пыль]
  ловушки:
    - если фаза=плот то оттенок=матовый (75%)
  гарантии:
    - минимум 3 объектов с фаза=плот
    - минимум 2 объектов с фаза=рых
действия:
  ощупать:
    - если фаза=плот то жестко
    - если фаза=рых то податливо
    - иначе крошится
  сжать:
    - если фаза=плот то упруго
    - если фаза=рых то подалось
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если фаза=плот то шанс_стать рых (5%)
    - если фаза=рых то шанс_стать пыль (5%)
вмешательство:
  выточить:
    выбираешь: [оттенок]
    фиксировано: фаза=плот
экзамены:
  - зонд ощупать вопрос сжать
объектов: 8
