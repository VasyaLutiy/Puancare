мир: каскад_быстрый
объекты:
  зовутся: глыба
  видимое:
    фактура: [гладкая, шероховатая]
  скрытое:
    ступень: [твёрдый, ломкий, пепельный]
  ловушки:
    - если ступень=твёрдый то фактура=гладкая (70%)
  гарантии:
    - минимум 3 объектов с ступень=твёрдый
    - минимум 2 объектов с ступень=ломкий
действия:
  ощупать:
    - если ступень=твёрдый то звонко
    - если ступень=ломкий то глухо
    - иначе сыпется
динамика:
  каждый_шаг:
    - если ступень=твёрдый то шанс_стать ломкий (35%)
    - если ступень=ломкий то шанс_стать пепельный (35%)
вмешательство:
  извлечь:
    выбираешь: [фактура]
    фиксировано: ступень=твёрдый
объектов: 8
