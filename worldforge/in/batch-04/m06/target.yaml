мир: плетение_шнуров
объекты:
  зовутся: шнур
  видимое:
    толщина: [тонкий, плотный]
  скрытое:
    натяг: [тугой, ослабший, порванный]
  ловушки:
    - если натяг=тугой то толщина=плотный (75%)
  гарантии:
    - минимум 2 объектов с натяг=тугой
    - минимум 2 объектов с натяг=ослабший
    - минимум 2 объектов с натяг=порванный
действия:
  пощупать:
    - если натяг=тугой то пружинит
    - если натяг=ослабший то провисает
    - иначе рвётся
  разбить:
    - если натяг=тугой то звон
    - если натяг=ослабший то треск
    - иначе пыль [исчезает]
динамика:
  каждый_шаг:
    - если натяг=тугой то шанс_стать ослабший (12%)
    - если натяг=ослабший то шанс_стать порванный (12%)
вмешательство:
  сплести:
    выбираешь: [толщина]
    фиксировано: натяг=тугой
экзамены:
  - зонд пощупать вопрос разбить
объектов: 8
