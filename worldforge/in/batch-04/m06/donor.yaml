мир: каскад_глыб
объекты:
  зовутся: глыба
  видимое:
    оттенок: [бледный, густой]
  скрытое:
    износ: [целый, щербатый, крошка]
  ловушки:
    - если износ=целый то оттенок=густой (75%)
  гарантии:
    - минимум 2 объектов с износ=целый
    - минимум 2 объектов с износ=щербатый
    - минимум 2 объектов с износ=крошка
действия:
  пощупать:
    - если износ=целый то гладко
    - если износ=щербатый то шершаво
    - иначе сыпется
  разбить:
    - если износ=целый то звон
    - если износ=щербатый то треск
    - иначе пыль [исчезает]
динамика:
  каждый_шаг:
    - если износ=целый то шанс_стать щербатый (12%)
    - если износ=щербатый то шанс_стать крошка (12%)
вмешательство:
  высечь:
    выбираешь: [оттенок]
    фиксировано: износ=целый
экзамены:
  - зонд пощупать вопрос разбить
объектов: 8
