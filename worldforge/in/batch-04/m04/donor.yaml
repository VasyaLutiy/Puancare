мир: лесенка_износа
объекты:
  зовутся: глыба
  видимое:
    оттенок: [серый, рыжий]
  скрытое:
    износ: [целый, потёртый, щербатый, труха]
  ловушки:
    - если износ=целый то оттенок=серый (75%)
  гарантии:
    - минимум 2 объектов с износ=целый
    - минимум 2 объектов с износ=труха
действия:
  пощупать:
    - если износ=целый то гладкий
    - если износ=потёртый то шершавый
    - если износ=щербатый то колкий
    - иначе сыпется
  ударить:
    - если износ=целый то звон
    - если износ=потёртый то стук
    - если износ=щербатый то треск
    - иначе прах
динамика:
  каждый_шаг:
    - если износ=целый то шанс_стать потёртый (5%)
    - если износ=потёртый то шанс_стать щербатый (5%)
    - если износ=щербатый то шанс_стать труха (5%)
вмешательство:
  выточить:
    выбираешь: [оттенок]
    фиксировано: износ=целый
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
