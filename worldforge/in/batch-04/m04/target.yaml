мир: спад_пламени
объекты:
  зовутся: фитиль
  видимое:
    длина: [короткая, длинная]
  скрытое:
    жар: [пылающий, ровный, тлеющий, мёртвый]
  ловушки:
    - если жар=пылающий то длина=длинная (75%)
  гарантии:
    - минимум 2 объектов с жар=пылающий
    - минимум 2 объектов с жар=мёртвый
действия:
  пощупать:
    - если жар=пылающий то обжигает
    - если жар=ровный то тепло
    - если жар=тлеющий то едва_тепло
    - иначе холодно
  ударить:
    - если жар=пылающий то звон
    - если жар=ровный то стук
    - если жар=тлеющий то треск
    - иначе прах
динамика:
  каждый_шаг:
    - если жар=пылающий то шанс_стать ровный (5%)
    - если жар=ровный то шанс_стать тлеющий (5%)
    - если жар=тлеющий то шанс_стать мёртвый (5%)
вмешательство:
  зажечь:
    выбираешь: [длина]
    фиксировано: жар=пылающий
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
