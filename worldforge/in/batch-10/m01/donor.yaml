мир: распад_заряда
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [ясный, мутный]
  скрытое:
    заряд: [полный, полу, пуст]
  ловушки:
    - если заряд=полный то оттенок=ясный (75%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=полу
    - минимум 2 объектов с заряд=пуст
действия:
  пощупать:
    - если заряд=полный то гудит
    - если заряд=полу то трепещет
    - иначе молчит
  ударить:
    - если заряд=полный то отскочило
    - если заряд=полу то треснуло
    - иначе разбилось [исчезает]
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать полу (5%)
    - если заряд=полу то шанс_стать пуст (5%)
вмешательство:
  добыть:
    выбираешь: [оттенок]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
