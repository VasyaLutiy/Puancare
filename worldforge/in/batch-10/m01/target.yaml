мир: угасание_тонуса
объекты:
  зовутся: плита
  видимое:
    блеск: [яркий, тусклый]
  скрытое:
    тонус: [крепкий, ослаб, ветхий]
  ловушки:
    - если тонус=крепкий то блеск=яркий (70%)
  гарантии:
    - минимум 2 объектов с тонус=крепкий
    - минимум 2 объектов с тонус=ослаб
    - минимум 2 объектов с тонус=ветхий
действия:
  пощупать:
    - если тонус=крепкий то звенит
    - если тонус=ослаб то шепчет
    - иначе нем
  ударить:
    - если тонус=крепкий то отскочило
    - если тонус=ослаб то треснуло
    - иначе разбилось [исчезает]
динамика:
  каждый_шаг:
    - если тонус=крепкий то шанс_стать ослаб (5%)
    - если тонус=ослаб то шанс_стать ветхий (5%)
вмешательство:
  выточить:
    выбираешь: [блеск]
    фиксировано: тонус=крепкий
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
