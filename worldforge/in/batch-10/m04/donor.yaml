мир: кольцо_фаз
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, искрящийся]
  скрытое:
    фаза: [альфа, бета, гамма]
  ловушки:
    - если фаза=альфа то блеск=матовый (70%)
  гарантии:
    - минимум 2 объектов с фаза=альфа
    - минимум 2 объектов с фаза=бета
    - минимум 2 объектов с фаза=гамма
действия:
  пощупать:
    - если фаза=альфа то тепло
    - если фаза=бета то прохладно
    - иначе холодно
  ударить:
    - если фаза=альфа то гудит
    - если фаза=бета то звенит
    - иначе молчит
динамика:
  каждый_шаг:
    - если фаза=альфа то шанс_стать бета (12%)
    - если фаза=бета то шанс_стать гамма (12%)
    - если фаза=гамма то шанс_стать альфа (12%)
вмешательство:
  вырастить:
    выбираешь: [блеск]
    фиксировано: фаза=альфа
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
