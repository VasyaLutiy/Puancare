мир: цикл_тонов
объекты:
  зовутся: сфера
  видимое:
    оттенок: [рыжий, сизый]
  скрытое:
    тон: [низкий, средний, высокий]
  ловушки:
    - если тон=низкий то оттенок=рыжий (70%)
  гарантии:
    - минимум 2 объектов с тон=низкий
    - минимум 2 объектов с тон=средний
    - минимум 2 объектов с тон=высокий
действия:
  пощупать:
    - если тон=низкий то упруго
    - если тон=средний то вязко
    - иначе жидко
  ударить:
    - если тон=низкий то гудит
    - если тон=средний то звенит
    - иначе молчит
динамика:
  каждый_шаг:
    - если тон=низкий то шанс_стать средний (12%)
    - если тон=средний то шанс_стать высокий (12%)
    - если тон=высокий то шанс_стать низкий (12%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: тон=низкий
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
