мир: тумблер_искры
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [алый, сизый]
  скрытое:
    ток: [плюс, минус]
  ловушки:
    - если ток=плюс то оттенок=алый (75%)
  гарантии:
    - минимум 3 объектов с ток=плюс
    - минимум 3 объектов с ток=минус
действия:
  пощупать:
    - если ток=плюс то вибрирует
    - иначе холодный
  ударить:
    - если ток=плюс то вспышка
    - иначе тишина
динамика:
  каждый_шаг:
    - если ток=плюс то шанс_стать минус (34%)
    - если ток=минус то шанс_стать плюс (34%)
вмешательство:
  зарядить:
    выбираешь: [оттенок]
    фиксировано: ток=плюс
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
