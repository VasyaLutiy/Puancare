мир: дыхание_руды
объекты:
  зовутся: самородок
  видимое:
    фактура: [гладкий, шершавый]
  скрытое:
    импульс: [живой, спящий]
  ловушки:
    - если импульс=живой то фактура=гладкий (70%)
  гарантии:
    - минимум 3 объектов с импульс=живой
    - минимум 3 объектов с импульс=спящий
действия:
  пощупать:
    - если импульс=живой то пульсирует
    - иначе немой
динамика:
  каждый_шаг:
    - если импульс=живой то шанс_стать спящий (27%)
    - если импульс=спящий то шанс_стать живой (27%)
вмешательство:
  оживить:
    выбираешь: [фактура]
    фиксировано: импульс=живой
объектов: 8
