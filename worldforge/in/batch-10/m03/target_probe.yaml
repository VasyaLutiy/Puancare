мир: колодец_глубин_четыре
объекты:
  зовутся: реликвия
  видимое:
    тон: [высокий, низкий, ровный]
    край: [острый, гладкий]
  скрытое:
    слой: [верх, середина, низина, бездна]
  ловушки:
    - если слой=верх то тон=высокий (70%)
    - если слой=бездна то край=гладкий (75%)
  гарантии:
    - минимум 2 объектов с слой=верх
    - минимум 2 объектов с слой=середина
    - минимум 1 объектов с слой=низина
    - минимум 1 объектов с слой=бездна
действия:
  пощупать:
    - если слой=верх то звенит
    - если слой=середина то глухо
    - если слой=низина то мягко
    - иначе беззвучно
динамика:
  каждый_шаг:
    - если слой=верх то шанс_стать середина (12%)
    - если слой=середина то шанс_стать низина (12%)
    - если слой=низина то шанс_стать бездна (12%)
вмешательство:
  поднять:
    выбираешь: [тон, край]
    фиксировано: слой=верх
объектов: 8
