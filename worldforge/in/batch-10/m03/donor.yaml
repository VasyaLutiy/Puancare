мир: лестница_четырёх_искр
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, искрящийся, тусклый]
    вес: [лёгкий, тяжёлый]
  скрытое:
    стадия: [искра, уголёк, зола, пыль]
  ловушки:
    - если стадия=искра то блеск=искрящийся (75%)
    - если стадия=пыль то вес=лёгкий (70%)
  гарантии:
    - минимум 2 объектов с стадия=искра
    - минимум 2 объектов с стадия=уголёк
    - минимум 1 объектов с стадия=зола
    - минимум 1 объектов с стадия=пыль
действия:
  пощупать:
    - если стадия=искра то жжёт
    - если стадия=уголёк то тепло
    - если стадия=зола то прохладно
    - иначе холодно
  ударить:
    - если стадия=искра то вспыхнуло
    - если стадия=уголёк то треснуло
    - если стадия=зола то рассыпалось
    - иначе пустота [исчезает]
динамика:
  каждый_шаг:
    - если стадия=искра то шанс_стать уголёк (12%)
    - если стадия=уголёк то шанс_стать зола (12%)
    - если стадия=зола то шанс_стать пыль (12%)
вмешательство:
  выковать:
    выбираешь: [блеск, вес]
    фиксировано: стадия=искра
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
