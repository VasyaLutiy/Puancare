мир: гаснущий_колодец
объекты:
  зовутся: кувшин
  видимое:
    блеск: [яркий, мутный, погасший]
  скрытое:
    наполнение: [полный, полу, сухой]
  ловушки:
    - если наполнение=полный то блеск=яркий (72%)
    - если наполнение=сухой то блеск=погасший (68%)
  гарантии:
    - минимум 2 объектов с наполнение=полный
    - минимум 2 объектов с наполнение=полу
    - минимум 2 объектов с наполнение=сухой
действия:
  пощупать:
    - если наполнение=полный то тяжёлый
    - если наполнение=полу то зыбкий
    - иначе пустотелый
  ударить:
    - если наполнение=полный то отскок
    - если наполнение=полу то треск
    - иначе пыль [исчезает]
динамика:
  каждый_шаг:
    - если наполнение=полный то шанс_стать полу (11%)
    - если наполнение=полу то шанс_стать сухой (22%)
вмешательство:
  наполнить:
    выбираешь: [блеск]
    фиксировано: наполнение=полный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
