мир: угасающий_рудник
объекты:
  зовутся: глыба
  видимое:
    оттенок: [светлый, тусклый, тёмный]
  скрытое:
    крепость: [цельн, надлом, прах]
  ловушки:
    - если крепость=цельн то оттенок=светлый (75%)
    - если крепость=прах то оттенок=тёмный (70%)
  гарантии:
    - минимум 2 объектов с крепость=цельн
    - минимум 2 объектов с крепость=надлом
    - минимум 2 объектов с крепость=прах
действия:
  пощупать:
    - если крепость=цельн то упруго
    - если крепость=надлом то крошится
    - иначе сыплется
  ударить:
    - если крепость=цельн то отскок
    - если крепость=надлом то треск
    - иначе пыль [исчезает]
динамика:
  каждый_шаг:
    - если крепость=цельн то шанс_стать надлом (14%)
    - если крепость=надлом то шанс_стать прах (18%)
вмешательство:
  высечь:
    выбираешь: [оттенок]
    фиксировано: крепость=цельн
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
