мир: лестница_тления
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [ясный, мутный, тусклый]
  скрытое:
    заряд: [полный, средний, пустой]
  ловушки:
    - если заряд=полный то оттенок=ясный (75%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=средний
    - минимум 2 объектов с заряд=пустой
действия:
  пощупать:
    - если заряд=полный то вибрирует
    - если заряд=средний то теплеет
    - иначе холодит
  использовать:
    - если заряд=полный то вспыхнуло
    - если заряд=средний то тлеет
    - иначе погасло [исчезает]
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (5%)
    - если заряд=средний то шанс_стать пустой (5%)
вмешательство:
  вырастить:
    выбираешь: [оттенок]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос использовать
объектов: 8
