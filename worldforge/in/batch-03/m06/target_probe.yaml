мир: каскад_истощения
объекты:
  зовутся: сфера
  видимое:
    фактура: [гладкая, шершавая, пористая]
  скрытое:
    потенция: [пик, спад, ноль]
  ловушки:
    - если потенция=пик то фактура=гладкая (75%)
  гарантии:
    - минимум 2 объектов с потенция=пик
    - минимум 2 объектов с потенция=спад
    - минимум 2 объектов с потенция=ноль
действия:
  пощупать:
    - если потенция=пик то звенит
    - если потенция=спад то хрустит
    - иначе глухо
динамика:
  каждый_шаг:
    - если потенция=пик то шанс_стать спад (5%)
    - если потенция=спад то шанс_стать ноль (5%)
вмешательство:
  соткать:
    выбираешь: [фактура]
    фиксировано: потенция=пик
объектов: 8
