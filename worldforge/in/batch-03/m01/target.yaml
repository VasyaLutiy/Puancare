мир: болото_шёпота
объекты:
  зовутся: комок
  видимое:
    фактура: [гладкая, шершавая, пористая]
  скрытое:
    наполнение: [густое, жидкое, сухое]
  ловушки:
    - если наполнение=густое то фактура=гладкая (75%)
  гарантии:
    - минимум 2 объектов с наполнение=густое
    - минимум 2 объектов с наполнение=жидкое
    - минимум 2 объектов с наполнение=сухое
действия:
  пощупать:
    - если наполнение=густое то пружинит
    - если наполнение=жидкое то мнётся
    - иначе крошится
  ударить:
    - если наполнение=густое то отскочило
    - если наполнение=жидкое то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если наполнение=густое то шанс_стать жидкое (25%)
    - если наполнение=жидкое то шанс_стать сухое (25%)
вмешательство:
  собрать:
    выбираешь: [фактура]
    фиксировано: наполнение=густое
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
