мир: пещера_эха
объекты:
  зовутся: камень
  видимое:
    оттенок: [бледный, тусклый, иссиня]
  скрытое:
    сердцевина: [твёрдая, рыхлая, пустая]
  ловушки:
    - если сердцевина=твёрдая то оттенок=бледный (70%)
  гарантии:
    - минимум 2 объектов с сердцевина=твёрдая
    - минимум 2 объектов с сердцевина=рыхлая
    - минимум 2 объектов с сердцевина=пустая
действия:
  пощупать:
    - если сердцевина=твёрдая то холодно
    - если сердцевина=рыхлая то тепло
    - иначе влажно
  ударить:
    - если сердцевина=твёрдая то отскочило
    - если сердцевина=рыхлая то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если сердцевина=твёрдая то шанс_стать рыхлая (5%)
    - если сердцевина=рыхлая то шанс_стать пустая (5%)
вмешательство:
  высечь:
    выбираешь: [оттенок]
    фиксировано: сердцевина=твёрдая
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
