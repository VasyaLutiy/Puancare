мир: пульс
объекты:
  зовутся: сфера
  видимое:
    тон: [глухой, звонкий]
  скрытое:
    фаза: [взведён, спущен]
  ловушки:
    - если фаза=взведён то тон=звонкий (70%)
  гарантии:
    - минимум 3 объектов с фаза=взведён
    - минимум 3 объектов с фаза=спущен
действия:
  пощупать:
    - если фаза=взведён то пружинит
    - иначе вялый
  разбить:
    - если фаза=взведён то вспышка
    - иначе крошится
динамика:
  каждый_шаг:
    - если фаза=взведён то шанс_стать спущен (21%)
    - если фаза=спущен то шанс_стать взведён (3%)
вмешательство:
  собрать:
    выбираешь: [тон]
    фиксировано: фаза=взведён
экзамены:
  - зонд пощупать вопрос разбить
объектов: 8
