мир: резонанс
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, искрящийся]
  скрытое:
    полюс: [северный, южный]
  ловушки:
    - если полюс=северный то блеск=искрящийся (75%)
  гарантии:
    - минимум 3 объектов с полюс=северный
    - минимум 3 объектов с полюс=южный
действия:
  пощупать:
    - если полюс=северный то вибрирует
    - иначе холоден
  разбить:
    - если полюс=северный то вспышка
    - иначе крошится
динамика:
  каждый_шаг:
    - если полюс=северный то шанс_стать южный (21%)
    - если полюс=южный то шанс_стать северный (3%)
вмешательство:
  вырастить:
    выбираешь: [блеск]
    фиксировано: полюс=северный
экзамены:
  - зонд пощупать вопрос разбить
объектов: 8
