мир: склон_глыб
объекты:
  зовутся: глыба
  видимое:
    оттенок: [пепельный, ржавый, сизый]
  скрытое:
    слой: [кора, толща, ядро]
  ловушки:
    - если слой=кора то оттенок=пепельный (72%)
  гарантии:
    - минимум 2 объектов с слой=кора
    - минимум 2 объектов с слой=толща
    - минимум 2 объектов с слой=ядро
действия:
  послушать:
    - если слой=кора то гул
    - если слой=толща то шелест
    - иначе тишина
  расколоть:
    - если слой=кора то крошится
    - если слой=толща то трещит
    - иначе звенит
динамика:
  каждый_шаг:
    - если слой=кора то шанс_стать толща (18%)
    - если слой=толща то шанс_стать ядро (18%)
вмешательство:
  высечь:
    выбираешь: [оттенок]
    фиксировано: слой=кора
экзамены:
  - зонд послушать вопрос расколоть
объектов: 8
