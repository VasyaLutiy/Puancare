мир: круг_струи
объекты:
  зовутся: капля
  видимое:
    блеск: [матовый, искрящийся]
  скрытое:
    виток: [первый, второй, третий]
  ловушки:
    - если виток=первый то блеск=матовый (75%)
  гарантии:
    - минимум 2 объектов с виток=первый
    - минимум 2 объектов с виток=второй
    - минимум 2 объектов с виток=третий
действия:
  послушать:
    - если виток=первый то пульсация
    - если виток=второй то шум
    - иначе эхо
  расколоть:
    - если виток=первый то крошится
    - если виток=второй то трещит
    - иначе звенит
динамика:
  каждый_шаг:
    - если виток=первый то шанс_стать второй (15%)
    - если виток=второй то шанс_стать третий (15%)
    - если виток=третий то шанс_стать первый (15%)
вмешательство:
  накапать:
    выбираешь: [блеск]
    фиксировано: виток=первый
экзамены:
  - зонд послушать вопрос расколоть
объектов: 8
