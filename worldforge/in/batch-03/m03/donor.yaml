мир: лестница_распада
объекты:
  зовутся: слиток
  видимое:
    отлив: [бледный, тусклый, яркий]
  скрытое:
    ступень: [нулевая, средняя, крайняя]
  ловушки:
    - если ступень=нулевая то отлив=бледный (70%)
  гарантии:
    - минимум 2 объектов с ступень=нулевая
    - минимум 2 объектов с ступень=средняя
    - минимум 2 объектов с ступень=крайняя
действия:
  пощупать:
    - если ступень=нулевая то податливый
    - если ступень=средняя то упругий
    - иначе жёсткий
  ударить:
    - если ступень=нулевая то рассыпалось [исчезает]
    - если ступень=средняя то треснуло
    - иначе отбило
динамика:
  каждый_шаг:
    - если ступень=нулевая то шанс_стать средняя (12%)
    - если ступень=средняя то шанс_стать крайняя (12%)
вмешательство:
  добыть:
    выбираешь: [отлив]
    фиксировано: ступень=нулевая
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
