мир: зыбкий_цикл
объекты:
  зовутся: шар
  видимое:
    фактура: [гладкая, шероховатая, зернистая]
  скрытое:
    фаза: [начало, середина, финал]
  ловушки:
    - если фаза=начало то фактура=гладкая (75%)
  гарантии:
    - минимум 2 объектов с фаза=начало
    - минимум 2 объектов с фаза=середина
    - минимум 2 объектов с фаза=финал
действия:
  пощупать:
    - если фаза=начало то холодный
    - если фаза=середина то тёплый
    - иначе обжигающий
  ударить:
    - если фаза=начало то рассыпалось [исчезает]
    - если фаза=середина то треснуло
    - иначе отбило
динамика:
  каждый_шаг:
    - если фаза=начало то шанс_стать середина (14%)
    - если фаза=середина то шанс_стать начало (10%)
    - если фаза=середина то шанс_стать финал (10%)
    - если фаза=финал то шанс_стать середина (14%)
вмешательство:
  вызвать:
    выбираешь: [фактура]
    фиксировано: фаза=начало
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
