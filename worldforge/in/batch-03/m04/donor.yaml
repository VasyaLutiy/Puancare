мир: глубина_заряда
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [бледный, насыщенный]
  скрытое:
    заряд: [полный, полуполный, полупустой, пустой]
  ловушки:
    - если заряд=полный то оттенок=насыщенный (70%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=пустой
действия:
  прощупать:
    - если заряд=полный то твёрдый
    - если заряд=полуполный то пружинит
    - если заряд=полупустой то мягкий
    - иначе зыбкий
  использовать:
    - если заряд=полный то звенит
    - если заряд=полуполный то шуршит
    - если заряд=полупустой то скрипит
    - иначе молчит
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать полуполный (12%)
    - если заряд=полуполный то шанс_стать полупустой (12%)
    - если заряд=полупустой то шанс_стать пустой (12%)
вмешательство:
  создать_свежий:
    выбираешь: [оттенок]
    фиксировано: заряд=полный
объектов: 8
