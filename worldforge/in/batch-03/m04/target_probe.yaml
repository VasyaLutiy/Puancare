мир: каскад_слоёв
объекты:
  зовутся: реликвия
  видимое:
    блеск: [матовый, глянцевый]
  скрытое:
    слой: [верхний, второй, третий, дно]
  ловушки:
    - если слой=верхний то блеск=глянцевый (75%)
  гарантии:
    - минимум 2 объектов с слой=верхний
    - минимум 2 объектов с слой=дно
действия:
  прощупать:
    - если слой=верхний то гладкий
    - если слой=второй то шершавый
    - если слой=третий то липкий
    - иначе пористый
динамика:
  каждый_шаг:
    - если слой=верхний то шанс_стать второй (12%)
    - если слой=второй то шанс_стать третий (12%)
    - если слой=третий то шанс_стать дно (12%)
вмешательство:
  добыть_новый:
    выбираешь: [блеск]
    фиксировано: слой=верхний
объектов: 8
