мир: цикл_струн_цель
объекты:
  зовутся: струна
  видимое:
    тон: [низкий, средний, высокий]
  скрытое:
    лад: [кварто, квинто, октаво]
  ловушки:
    - если лад=кварто то тон=высокий (75%)
    - если лад=октаво то тон=низкий (70%)
  гарантии:
    - минимум 2 объектов с лад=кварто
    - минимум 2 объектов с лад=квинто
    - минимум 2 объектов с лад=октаво
действия:
  пощупать:
    - если лад=кварто то упруго
    - если лад=квинто то вязко
    - иначе рыхло
  слушать:
    - если лад=октаво то рокот
    - если лад=квинто то шелест
    - иначе молчание
динамика:
  каждый_шаг:
    - если лад=кварто то шанс_стать квинто (18%)
    - если лад=квинто то шанс_стать октаво (18%)
    - если лад=октаво то шанс_стать кварто (18%)
вмешательство:
  натянуть:
    выбираешь: [тон]
    фиксировано: лад=кварто
объектов: 8
