мир: кольцо_фаз_донор
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, глянцевый, искрящийся]
  скрытое:
    фаза: [искра, дуга, пульс]
  ловушки:
    - если фаза=искра то блеск=искрящийся (75%)
    - если фаза=пульс то блеск=матовый (70%)
  гарантии:
    - минимум 2 объектов с фаза=искра
    - минимум 2 объектов с фаза=дуга
    - минимум 2 объектов с фаза=пульс
действия:
  пощупать:
    - если фаза=искра то тепло
    - если фаза=дуга то дрожь
    - иначе холод
  ударить:
    - если фаза=искра то звонко
    - если фаза=дуга то глухо
    - иначе треск
  слушать:
    - если фаза=пульс то гул
    - если фаза=дуга то свист
    - иначе тишина
динамика:
  каждый_шаг:
    - если фаза=искра то шанс_стать дуга (18%)
    - если фаза=дуга то шанс_стать пульс (18%)
    - если фаза=пульс то шанс_стать искра (18%)
вмешательство:
  закрепить:
    выбираешь: [блеск]
    фиксировано: фаза=искра
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
