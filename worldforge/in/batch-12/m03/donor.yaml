мир: глубокий_распад
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [алый, лазурный, серый, золотой]
  скрытое:
    заряд: [полный, высокий, средний, скудный, пустой]
  ловушки:
    - если заряд=полный то оттенок=алый (70%)
    - если заряд=пустой то оттенок=серый (65%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=пустой
    - минимум 1 объектов с заряд=средний
действия:
  пощупать:
    - если заряд=полный то обжигает
    - если заряд=высокий то тепло
    - если заряд=средний то прохладно
    - если заряд=скудный то зябко
    - иначе ледяной
  ударить:
    - если заряд=полный то вспышка
    - если заряд=высокий то искра
    - если заряд=средний то треск
    - если заряд=скудный то хруст
    - иначе тишина
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать высокий (14%)
    - если заряд=высокий то шанс_стать средний (14%)
    - если заряд=средний то шанс_стать скудный (14%)
    - если заряд=скудный то шанс_стать пустой (14%)
вмешательство:
  добыть:
    выбираешь: [оттенок]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
