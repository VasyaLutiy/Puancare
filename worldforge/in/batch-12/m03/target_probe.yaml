мир: каскад_слоёв
объекты:
  зовутся: реликвия
  видимое:
    поверхность: [гладкая, шершавая, трещиноватая]
  скрытое:
    слой: [край, верх, середина, низина, дно]
  ловушки:
    - если слой=край то поверхность=гладкая (75%)
    - если слой=дно то поверхность=трещиноватая (60%)
  гарантии:
    - минимум 2 объектов с слой=край
    - минимум 2 объектов с слой=дно
    - минимум 1 объектов с слой=середина
действия:
  пощупать:
    - если слой=край то гулко
    - если слой=верх то звонко
    - если слой=середина то глухо
    - если слой=низина то матово
    - иначе немо
динамика:
  каждый_шаг:
    - если слой=край то шанс_стать верх (14%)
    - если слой=верх то шанс_стать середина (14%)
    - если слой=середина то шанс_стать низина (14%)
    - если слой=низина то шанс_стать дно (14%)
вмешательство:
  выковать:
    выбираешь: [поверхность]
    фиксировано: слой=край
объектов: 8
