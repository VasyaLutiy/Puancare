мир: оболочка_напора
объекты:
  зовутся: мембрана
  видимое:
    оттенок: [пепельный, золотистый, сизый]
  скрытое:
    напор: [высокий, умеренный, низкий]
  ловушки:
    - если напор=высокий то оттенок=золотистый (70%)
    - если напор=низкий то оттенок=пепельный (65%)
  гарантии:
    - минимум 2 объектов с напор=высокий
    - минимум 2 объектов с напор=умеренный
    - минимум 2 объектов с напор=низкий
действия:
  пощупать:
    - если напор=высокий то упруго
    - если напор=умеренный то упруго
    - иначе вязко
динамика:
  каждый_шаг:
    - если напор=высокий то шанс_стать умеренный (12%)
    - если напор=умеренный то шанс_стать низкий (12%)
вмешательство:
  накачать:
    выбираешь: [оттенок]
    фиксировано: напор=высокий
объектов: 8
