мир: каскад_заряда
объекты:
  зовутся: кристалл
  видимое:
    блеск: [тусклый, яркий, радужный]
  скрытое:
    заряд: [полный, средний, пустой]
  ловушки:
    - если заряд=полный то блеск=яркий (70%)
    - если заряд=пустой то блеск=тусклый (65%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=средний
    - минимум 2 объектов с заряд=пустой
действия:
  пощупать:
    - если заряд=полный то тепло
    - если заряд=средний то тепло
    - иначе холодно
  ударить:
    - если заряд=полный то гудит
    - если заряд=средний то треск
    - иначе тишина
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (12%)
    - если заряд=средний то шанс_стать пустой (12%)
вмешательство:
  зарядить:
    выбираешь: [блеск]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
