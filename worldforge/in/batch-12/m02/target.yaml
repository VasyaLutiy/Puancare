мир: контур_сдвиг
объекты:
  зовутся: сфера
  видимое:
    оттенок: [тёплый, холодный]
  скрытое:
    ток: [включён, выключен]
  ловушки:
    - если ток=включён то оттенок=тёплый (70%)
  гарантии:
    - минимум 3 объектов с ток=включён
    - минимум 3 объектов с ток=выключен
действия:
  постучать:
    - если ток=включён то звенит
    - иначе молчит
  сжать:
    - если ток=включён то пружинит
    - иначе крошится
динамика:
  каждый_шаг:
    - если ток=включён то шанс_стать выключен (28%)
    - если ток=выключен то шанс_стать включён (33%)
вмешательство:
  подать_ток:
    выбираешь: [оттенок]
    фиксировано: ток=включён
экзамены:
  - зонд постучать вопрос сжать
объектов: 8
