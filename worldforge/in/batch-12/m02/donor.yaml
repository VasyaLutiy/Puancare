мир: резонанс_тумблер
объекты:
  зовутся: кристалл
  видимое:
    блеск: [яркий, тусклый]
  скрытое:
    пульс: [живой, спящий]
  ловушки:
    - если пульс=живой то блеск=яркий (75%)
  гарантии:
    - минимум 3 объектов с пульс=живой
    - минимум 3 объектов с пульс=спящий
действия:
  постучать:
    - если пульс=живой то гулко
    - иначе глухо
  сжать:
    - если пульс=живой то пружинит
    - иначе крошится
динамика:
  каждый_шаг:
    - если пульс=живой то шанс_стать спящий (35%)
    - если пульс=спящий то шанс_стать живой (30%)
вмешательство:
  зарядить:
    выбираешь: [блеск]
    фиксировано: пульс=живой
экзамены:
  - зонд постучать вопрос сжать
объектов: 8
