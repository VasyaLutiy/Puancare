мир: каньон_отголосков
объекты:
  зовутся: глыба
  видимое:
    оттенок: [бледный, мутный, яркий]
  скрытое:
    крепь: [цельн, треснул, прахлый]
  ловушки:
    - если крепь=цельн то оттенок=яркий (78%)
    - если крепь=прахлый то оттенок=мутный (70%)
  гарантии:
    - минимум 2 объектов с крепь=цельн
    - минимум 2 объектов с крепь=прахлый
    - минимум 2 объектов с крепь=треснул
действия:
  послушать:
    - если крепь=цельн то гулкий
    - если крепь=треснул то дребезг
    - иначе глухо
  бросить:
    - если крепь=цельн то отскок
    - если крепь=треснул то треск
    - иначе прах [исчезает]
динамика:
  каждый_шаг:
    - если крепь=цельн то шанс_стать треснул (12%)
    - если крепь=треснул то шанс_стать прахлый (18%)
вмешательство:
  выточить:
    выбираешь: [оттенок]
    фиксировано: крепь=цельн
экзамены:
  - зонд послушать вопрос бросить
объектов: 8
