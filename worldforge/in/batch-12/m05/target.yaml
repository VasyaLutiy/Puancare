мир: горн_слитков
объекты:
  зовутся: слиток
  видимое:
    блеск: [матовый, лоснящийся, тусклый]
  скрытое:
    сплав: [твёрд, хрупок, ломкий]
  ловушки:
    - если сплав=твёрд то блеск=лоснящийся (72%)
    - если сплав=ломкий то блеск=тусклый (68%)
  гарантии:
    - минимум 2 объектов с сплав=твёрд
    - минимум 2 объектов с сплав=ломкий
    - минимум 2 объектов с сплав=хрупок
действия:
  послушать:
    - если сплав=твёрд то звонкий
    - если сплав=хрупок то сиплый
    - иначе немой
  бросить:
    - если сплав=твёрд то отскок
    - если сплав=хрупок то треск
    - иначе прах [исчезает]
динамика:
  каждый_шаг:
    - если сплав=твёрд то шанс_стать хрупок (9%)
    - если сплав=хрупок то шанс_стать ломкий (15%)
вмешательство:
  отлить:
    выбираешь: [блеск]
    фиксировано: сплав=твёрд
экзамены:
  - зонд послушать вопрос бросить
объектов: 8
