мир: лестница_раскола
объекты:
  зовутся: глыба
  видимое:
    оттенок: [бледный, насыщенный]
  скрытое:
    целостность: [целый, треснутый, крошка]
  ловушки:
    - если целостность=целый то оттенок=насыщенный (70%)
  гарантии:
    - минимум 3 объектов с целостность=целый
    - минимум 2 объектов с целостность=треснутый
действия:
  пощупать:
    - если целостность=целый то твёрдый
    - если целостность=треснутый то зыбкий
    - иначе порошится
  ударить:
    - если целостность=целый то гулкий_звон
    - если целостность=треснутый то глухой_стук
    - иначе пыль_в_руках [исчезает]
динамика:
  каждый_шаг:
    - если целостность=целый то шанс_стать треснутый (5%)
    - если целостность=треснутый то шанс_стать крошка (5%)
вмешательство:
  выточить:
    выбираешь: [оттенок]
    фиксировано: целостность=целый
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
