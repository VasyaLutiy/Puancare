мир: увядание_ткани
объекты:
  зовутся: полотно
  видимое:
    край: [ровный, рваный]
  скрытое:
    свежесть: [сок, вялый, сухой]
  ловушки:
    - если свежесть=сок то край=ровный (70%)
  гарантии:
    - минимум 3 объектов с свежесть=сок
    - минимум 2 объектов с свежесть=вялый
действия:
  пощупать:
    - если свежесть=сок то упругий
    - если свежесть=вялый то мягкий
    - иначе ломкий
динамика:
  каждый_шаг:
    - если свежесть=сок то шанс_стать вялый (5%)
    - если свежесть=вялый то шанс_стать сухой (5%)
вмешательство:
  натянуть:
    выбираешь: [край]
    фиксировано: свежесть=сок
объектов: 8
