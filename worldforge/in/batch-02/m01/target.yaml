мир: rubble_fast
объекты:
  зовутся: глыба
  видимое:
    фактура: [гладкая, шершавая]
  скрытое:
    монолитность: [цельный, треснутый, дроблёный]
  ловушки:
    - если монолитность=цельный то фактура=гладкая (70%)
  гарантии:
    - минимум 2 объектов с монолитность=цельный
    - минимум 2 объектов с монолитность=треснутый
    - минимум 2 объектов с монолитность=дроблёный
действия:
  прощупать:
    - если монолитность=цельный то холодно
    - если монолитность=треснутый то вибрирует
    - иначе пыль
  ударить:
    - если монолитность=цельный то отскочило
    - если монолитность=треснутый то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если монолитность=цельный то шанс_стать треснутый (30%)
    - если монолитность=треснутый то шанс_стать дроблёный (30%)
вмешательство:
  вырезать:
    выбираешь: [фактура]
    фиксировано: монолитность=цельный
экзамены:
  - зонд прощупать вопрос ударить
объектов: 8
