мир: cascade_slow
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [ясный, мутный]
  скрытое:
    плотность: [густая, рыхлая, рассыпавшаяся]
  ловушки:
    - если плотность=густая то оттенок=ясный (75%)
  гарантии:
    - минимум 2 объектов с плотность=густая
    - минимум 2 объектов с плотность=рыхлая
    - минимум 2 объектов с плотность=рассыпавшаяся
действия:
  прощупать:
    - если плотность=густая то упруго
    - если плотность=рыхлая то податливо
    - иначе крошится
  ударить:
    - если плотность=густая то отскочило
    - если плотность=рыхлая то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если плотность=густая то шанс_стать рыхлая (5%)
    - если плотность=рыхлая то шанс_стать рассыпавшаяся (5%)
вмешательство:
  извлечь:
    выбираешь: [оттенок]
    фиксировано: плотность=густая
экзамены:
  - зонд прощупать вопрос ударить
объектов: 8
