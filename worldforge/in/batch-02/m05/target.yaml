мир: тумблер_неравный_цель
объекты:
  зовутся: звезда
  видимое:
    фактура: [гладкая, шершавая]
  скрытое:
    полюс: [северный, южный]
  ловушки:
    - если полюс=северный то фактура=гладкая (65%)
  гарантии:
    - минимум 3 объектов с полюс=северный
    - минимум 3 объектов с полюс=южный
действия:
  пощупать:
    - если полюс=северный то звенит
    - иначе глухо
  разломить:
    - если полюс=северный то вспышка
    - иначе пепел
динамика:
  каждый_шаг:
    - если полюс=северный то шанс_стать южный (30%)
    - если полюс=южный то шанс_стать северный (8%)
вмешательство:
  добыть:
    выбираешь: [фактура]
    фиксировано: полюс=северный
экзамены:
  - зонд пощупать вопрос разломить
объектов: 8
