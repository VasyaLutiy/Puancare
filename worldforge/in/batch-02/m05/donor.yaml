мир: тумблер_неравный_донор
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, глянцевый]
  скрытое:
    заряд: [плюс, минус]
  ловушки:
    - если заряд=плюс то блеск=глянцевый (70%)
  гарантии:
    - минимум 3 объектов с заряд=плюс
    - минимум 3 объектов с заряд=минус
действия:
  пощупать:
    - если заряд=плюс то тепло
    - иначе холодно
  разломить:
    - если заряд=плюс то вспышка
    - иначе пепел
динамика:
  каждый_шаг:
    - если заряд=плюс то шанс_стать минус (30%)
    - если заряд=минус то шанс_стать плюс (8%)
вмешательство:
  создать:
    выбираешь: [блеск]
    фиксировано: заряд=плюс
экзамены:
  - зонд пощупать вопрос разломить
объектов: 8
