мир: глиняный_каскад
объекты:
  зовутся: глыба
  видимое:
    фактура: [гладкая, шершавая]
  скрытое:
    плотность: [монолитный, рыхлый, ноздреватый, песок]
  ловушки:
    - если плотность=монолитный то фактура=гладкая (75%)
  гарантии:
    - минимум 2 объектов с плотность=монолитный
    - минимум 2 объектов с плотность=рыхлый
    - минимум 1 объектов с плотность=ноздреватый
    - минимум 1 объектов с плотность=песок
действия:
  пощупать:
    - если плотность=монолитный то упруго
    - если плотность=рыхлый то продавливается
    - если плотность=ноздреватый то проваливается
    - иначе пусто
динамика:
  каждый_шаг:
    - если плотность=монолитный то шанс_стать рыхлый (12%)
    - если плотность=рыхлый то шанс_стать ноздреватый (12%)
    - если плотность=ноздреватый то шанс_стать песок (12%)
вмешательство:
  слепить:
    выбираешь: [фактура]
    фиксировано: плотность=монолитный
объектов: 8
