мир: хрустальная_лестница
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [ясный, мутный]
  скрытое:
    целостность: [монолит, трещина, осколок, пыль]
  ловушки:
    - если целостность=монолит то оттенок=ясный (70%)
  гарантии:
    - минимум 2 объектов с целостность=монолит
    - минимум 2 объектов с целостность=трещина
    - минимум 1 объектов с целостность=осколок
    - минимум 1 объектов с целостность=пыль
действия:
  пощупать:
    - если целостность=монолит то твёрдо
    - если целостность=трещина то зыбко
    - если целостность=осколок то остро
    - иначе рассыпается
  ударить:
    - если целостность=монолит то звон
    - если целостность=трещина то треск
    - если целостность=осколок то грохот
    - иначе тишина [исчезает]
динамика:
  каждый_шаг:
    - если целостность=монолит то шанс_стать трещина (12%)
    - если целостность=трещина то шанс_стать осколок (12%)
    - если целостность=осколок то шанс_стать пыль (12%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: целостность=монолит
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
