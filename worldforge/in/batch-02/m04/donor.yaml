мир: глубокая_лестница_донор
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [алый, сизый, золотой]
  скрытое:
    слой: [верх, средне, низко, ядро]
  ловушки:
    - если слой=верх то оттенок=алый (75%)
    - если слой=ядро то оттенок=сизый (70%)
  гарантии:
    - минимум 2 объектов с слой=верх
    - минимум 2 объектов с слой=средне
    - минимум 1 объектов с слой=низко
    - минимум 1 объектов с слой=ядро
действия:
  потрогать:
    - если слой=верх то гладко
    - если слой=средне то шершаво
    - если слой=низко то вязко
    - иначе хрустко
  швырнуть:
    - если слой=верх то вспыхнуло
    - если слой=средне то раскололось
    - если слой=низко то затмилось
    - иначе осыпалось [исчезает]
динамика:
  каждый_шаг:
    - если слой=верх то шанс_стать средне (12%)
    - если слой=средне то шанс_стать низко (12%)
    - если слой=низко то шанс_стать ядро (12%)
вмешательство:
  вырастить:
    выбираешь: [оттенок]
    фиксировано: слой=верх
экзамены:
  - зонд потрогать вопрос швырнуть
объектов: 8
