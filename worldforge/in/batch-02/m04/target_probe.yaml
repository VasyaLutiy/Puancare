мир: глубокая_лестница_цель
объекты:
  зовутся: сфера
  видимое:
    блеск: [матовый, глянцевый, искрящийся]
  скрытое:
    фаза: [полная, убыль, серп, пустая]
  ловушки:
    - если фаза=полная то блеск=искрящийся (72%)
    - если фаза=пустая то блеск=матовый (68%)
  гарантии:
    - минимум 2 объектов с фаза=полная
    - минимум 2 объектов с фаза=убыль
    - минимум 1 объектов с фаза=серп
    - минимум 1 объектов с фаза=пустая
действия:
  потрогать:
    - если фаза=полная то тепло
    - если фаза=убыль то зябко
    - если фаза=серп то мокро
    - иначе сухо
динамика:
  каждый_шаг:
    - если фаза=полная то шанс_стать убыль (12%)
    - если фаза=убыль то шанс_стать серп (12%)
    - если фаза=серп то шанс_стать пустая (12%)
вмешательство:
  сотворить:
    выбираешь: [блеск]
    фиксировано: фаза=полная
объектов: 8
