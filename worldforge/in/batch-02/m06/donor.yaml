мир: лестница_тлеющего_ядра
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [ясный, мутный]
  скрытое:
    фаза: [заряжен, ослаблен, истощён]
  ловушки:
    - если фаза=заряжен то оттенок=ясный (75%)
  гарантии:
    - минимум 3 объектов с фаза=заряжен
    - минимум 2 объектов с фаза=ослаблен
    - минимум 1 объектов с фаза=истощён
действия:
  пощупать:
    - если фаза=заряжен то гудит
    - если фаза=ослаблен то теплеет
    - иначе холодит
  ударить:
    - если фаза=заряжен то вспыхнуло
    - если фаза=ослаблен то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если фаза=заряжен то шанс_стать ослаблен (5%)
    - если фаза=ослаблен то шанс_стать истощён (5%)
вмешательство:
  вырастить:
    выбираешь: [оттенок]
    фиксировано: фаза=заряжен
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
