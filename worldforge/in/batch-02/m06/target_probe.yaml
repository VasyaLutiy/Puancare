мир: цепь_тускнеющей_скрижали
объекты:
  зовутся: скрижаль
  видимое:
    блеск: [яркий, тусклый]
  скрытое:
    заряд: [новый, изношен, мёртвый]
  ловушки:
    - если заряд=новый то блеск=яркий (70%)
  гарантии:
    - минимум 3 объектов с заряд=новый
    - минимум 2 объектов с заряд=изношен
    - минимум 1 объектов с заряд=мёртвый
действия:
  пощупать:
    - если заряд=новый то звенит
    - если заряд=изношен то шелестит
    - иначе молчит
динамика:
  каждый_шаг:
    - если заряд=новый то шанс_стать изношен (5%)
    - если заряд=изношен то шанс_стать мёртвый (5%)
вмешательство:
  выковать:
    выбираешь: [блеск]
    фиксировано: заряд=новый
объектов: 8
