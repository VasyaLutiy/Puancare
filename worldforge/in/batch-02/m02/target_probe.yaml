мир: кольцо_пульса
объекты:
  зовутся: сфера
  видимое:
    фактура: [шершавая, гладкая]
  скрытое:
    пульс: [звено_х, звено_у, звено_з]
  ловушки:
    - если пульс=звено_х то фактура=гладкая (80%)
    - если пульс=звено_з то фактура=шершавая (65%)
  гарантии:
    - минимум 2 объектов с пульс=звено_х
    - минимум 2 объектов с пульс=звено_у
    - минимум 2 объектов с пульс=звено_з
действия:
  тронуть:
    - если пульс=звено_х то гудит
    - если пульс=звено_у то молчит
    - иначе вибрирует
динамика:
  каждый_шаг:
    - если пульс=звено_х то шанс_стать звено_у (12%)
    - если пульс=звено_у то шанс_стать звено_з (12%)
    - если пульс=звено_з то шанс_стать звено_х (12%)
вмешательство:
  собрать:
    выбираешь: [фактура]
    фиксировано: пульс=звено_х
объектов: 8
