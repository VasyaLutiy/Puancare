мир: лестница_ядер
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [бледный, насыщенный]
  скрытое:
    суть: [ядро_а, ядро_б, ядро_в]
  ловушки:
    - если суть=ядро_а то оттенок=насыщенный (75%)
    - если суть=ядро_в то оттенок=бледный (70%)
  гарантии:
    - минимум 2 объектов с суть=ядро_а
    - минимум 2 объектов с суть=ядро_б
    - минимум 2 объектов с суть=ядро_в
действия:
  тронуть:
    - если суть=ядро_а то мягко
    - если суть=ядро_б то упруго
    - иначе крошится
  разбить:
    - если суть=ядро_а то раскололось [исчезает]
    - если суть=ядро_б то разлетелось [исчезает]
    - иначе устояло
динамика:
  каждый_шаг:
    - если суть=ядро_а то шанс_стать ядро_б (12%)
    - если суть=ядро_б то шанс_стать ядро_в (12%)
вмешательство:
  вырастить:
    выбираешь: [оттенок]
    фиксировано: суть=ядро_а
экзамены:
  - зонд тронуть вопрос разбить
объектов: 8
