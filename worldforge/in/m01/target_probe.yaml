мир: осыпь_камня
объекты:
  зовутся: валун
  видимое:
    зерно: [крупное, среднее, мелкое]
  скрытое:
    прочность: [монолит, треснутый, крошка]
  ловушки:
    - если прочность=монолит то зерно=крупное (80%)
    - если прочность=крошка то зерно=мелкое (70%)
  гарантии:
    - минимум 3 объектов с прочность=монолит
    - минимум 2 объектов с прочность=треснутый
действия:
  пощупать:
    - если прочность=монолит то гладкий_холод
    - если прочность=треснутый то шершавый
    - иначе пыль_на_пальцах
динамика:
  каждый_шаг:
    - если прочность=монолит то шанс_стать треснутый (4%)
    - если прочность=треснутый то шанс_стать крошка (5%)
вмешательство:
  высечь_монолит:
    выбираешь: [зерно]
    фиксировано: прочность=монолит
объектов: 8
