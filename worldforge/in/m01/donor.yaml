мир: лестница_спелости
объекты:
  зовутся: плод
  видимое:
    оттенок: [бледный, сочный, тёмный]
  скрытое:
    фаза: [незрелый, зрелый, перезрелый]
  ловушки:
    - если фаза=незрелый то оттенок=бледный (80%)
    - если фаза=перезрелый то оттенок=тёмный (70%)
  гарантии:
    - минимум 3 объектов с фаза=незрелый
    - минимум 2 объектов с фаза=зрелый
действия:
  пощупать:
    - если фаза=незрелый то упруго
    - если фаза=зрелый то мягко
    - иначе давится
  надломить:
    - если фаза=незрелый то сухо_хруст
    - если фаза=зрелый то сок
    - иначе чахлый_ком [исчезает]
динамика:
  каждый_шаг:
    - если фаза=незрелый то шанс_стать зрелый (4%)
    - если фаза=зрелый то шанс_стать перезрелый (5%)
вмешательство:
  сорвать_незрелый:
    выбираешь: [оттенок]
    фиксировано: фаза=незрелый
экзамены:
  - зонд пощупать вопрос надломить
объектов: 8
