мир: каскад_распада
объекты:
  зовутся: кристалл
  видимое:
    отлив: [серебристый, тусклый]
  скрытое:
    целостность: [монолит, трещина, прах]
  ловушки:
    - если целостность=монолит то отлив=серебристый (75%)
  гарантии:
    - минимум 2 объектов с целостность=монолит
    - минимум 2 объектов с целостность=трещина
    - минимум 2 объектов с целостность=прах
действия:
  прощупать:
    - если целостность=монолит то звонко
    - если целостность=трещина то хрустко
    - если целостность=прах то глухо
  запустить:
    - если целостность=монолит то гудит
    - если целостность=трещина то трепещет
    - если целостность=прах то молчит
динамика:
  каждый_шаг:
    - если целостность=монолит то шанс_стать трещина (17%)
    - если целостность=трещина то шанс_стать прах (17%)
вмешательство:
  выковать:
    выбираешь: [отлив]
    фиксировано: целостность=монолит
экзамены:
  - зонд прощупать вопрос запустить
объектов: 8
