мир: спуск_ступеней
объекты:
  зовутся: плита
  видимое:
    фактура: [гладкая, шершавая]
  скрытое:
    ярус: [верх, середина, низ]
  ловушки:
    - если ярус=верх то фактура=гладкая (70%)
  гарантии:
    - минимум 2 объектов с ярус=верх
    - минимум 2 объектов с ярус=середина
    - минимум 2 объектов с ярус=низ
действия:
  прощупать:
    - если ярус=верх то плотно
    - если ярус=середина то зыбко
    - если ярус=низ то проваливается
  запустить:
    - если ярус=верх то гудит
    - если ярус=середина то трепещет
    - если ярус=низ то молчит
динамика:
  каждый_шаг:
    - если ярус=верх то шанс_стать середина (17%)
    - если ярус=середина то шанс_стать низ (17%)
вмешательство:
  возвести:
    выбираешь: [фактура]
    фиксировано: ярус=верх
экзамены:
  - зонд прощупать вопрос запустить
объектов: 8
