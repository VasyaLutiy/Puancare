мир: каскад_монолита
объекты:
  зовутся: глыба
  видимое:
    блеск: [матовый, глянцевый, искристый]
  скрытое:
    слой: [ядро, корка, пласт, труха]
  ловушки:
    - если слой=ядро то блеск=искристый (70%)
    - если слой=труха то блеск=матовый (75%)
  гарантии:
    - минимум 2 объектов с слой=ядро
    - минимум 2 объектов с слой=корка
    - минимум 1 объектов с слой=пласт
действия:
  пощупать:
    - если слой=ядро то холодно
    - если слой=корка то тепло
    - если слой=пласт то влажно
    - иначе сухо
  ударить:
    - если слой=ядро то звон
    - если слой=корка то треск
    - если слой=пласт то хруст
    - иначе прах [исчезает]
динамика:
  каждый_шаг:
    - если слой=ядро то шанс_стать корка (12%)
    - если слой=корка то шанс_стать пласт (12%)
    - если слой=пласт то шанс_стать труха (12%)
вмешательство:
  вырезать:
    выбираешь: [блеск]
    фиксировано: слой=ядро
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
