мир: цепь_расслоения
объекты:
  зовутся: плита
  видимое:
    кромка: [ровная, зубчатая, рваная]
  скрытое:
    фаза: [цельный, надлом, скол, пыль]
  ловушки:
    - если фаза=цельный то кромка=ровная (70%)
    - если фаза=пыль то кромка=рваная (75%)
  гарантии:
    - минимум 2 объектов с фаза=цельный
    - минимум 2 объектов с фаза=надлом
    - минимум 1 объектов с фаза=скол
действия:
  пощупать:
    - если фаза=цельный то упруго
    - если фаза=надлом то зыбко
    - если фаза=скол то хрупко
    - иначе пусто
динамика:
  каждый_шаг:
    - если фаза=цельный то шанс_стать надлом (12%)
    - если фаза=надлом то шанс_стать скол (12%)
    - если фаза=скол то шанс_стать пыль (12%)
вмешательство:
  отколоть:
    выбираешь: [кромка]
    фиксировано: фаза=цельный
объектов: 8
