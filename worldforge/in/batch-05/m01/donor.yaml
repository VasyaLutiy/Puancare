мир: медленная_лестница_альфа
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, глянцевый, искрящийся]
  скрытое:
    слой: [верх, середина, низ, ядро]
  ловушки:
    - если слой=верх то блеск=искрящийся (70%)
    - если слой=ядро то блеск=матовый (65%)
  гарантии:
    - минимум 2 объектов с слой=верх
    - минимум 2 объектов с слой=ядро
действия:
  прощупать:
    - если слой=верх то упруго
    - если слой=середина то податливо
    - если слой=низ то твёрдо
    - иначе каменное
  ударить:
    - если слой=верх то разлетелось
    - если слой=середина то треснуло
    - если слой=низ то скол
    - иначе гул
динамика:
  каждый_шаг:
    - если слой=верх то шанс_стать середина (5%)
    - если слой=середина то шанс_стать низ (5%)
    - если слой=низ то шанс_стать ядро (5%)
вмешательство:
  вырастить:
    выбираешь: [блеск]
    фиксировано: слой=верх
экзамены:
  - зонд прощупать вопрос ударить
объектов: 8
