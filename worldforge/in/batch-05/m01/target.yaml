мир: тихая_каскада_омега
объекты:
  зовутся: сгусток
  видимое:
    тон: [бледный, насыщенный, серый]
  скрытое:
    глубина: [поверхность, пласт, бездна, сердце]
  ловушки:
    - если глубина=поверхность то тон=насыщенный (72%)
    - если глубина=сердце то тон=серый (60%)
  гарантии:
    - минимум 2 объектов с глубина=поверхность
    - минимум 2 объектов с глубина=сердце
действия:
  прощупать:
    - если глубина=поверхность то звонко
    - если глубина=пласт то глухо
    - если глубина=бездна то вязко
    - иначе нема
  ударить:
    - если глубина=поверхность то разлетелось
    - если глубина=пласт то треснуло
    - если глубина=бездна то скол
    - иначе гул
динамика:
  каждый_шаг:
    - если глубина=поверхность то шанс_стать пласт (5%)
    - если глубина=пласт то шанс_стать бездна (5%)
    - если глубина=бездна то шанс_стать сердце (5%)
вмешательство:
  собрать:
    выбираешь: [тон]
    фиксировано: глубина=поверхность
экзамены:
  - зонд прощупать вопрос ударить
объектов: 8
