мир: фантом_пыль_цель
объекты:
  зовутся: зернышко
  видимое:
    блик: [матовый, глянцевый, дымный]
  скрытое:
    сердцевина: [гамма, дельта]
  ловушки:
    - если сердцевина=гамма то блик=матовый (65%)
  гарантии:
    - минимум 3 объектов с сердцевина=гамма
    - минимум 3 объектов с сердцевина=дельта
действия:
  пощупать:
    - если сердцевина=гамма то тепло_тс
    - иначе холодно_тс
  вскрыть:
    - если сердцевина=гамма то рассыпалось
    - иначе устояло
динамика:
  каждый_шаг:
    - если сердцевина=гамма то шанс_стать дельта (8%)
    - если сердцевина=дельта то шанс_стать гамма (8%)
вмешательство:
  соткать:
    выбираешь: [блик]
    фиксировано: сердцевина=гамма
экзамены:
  - зонд пощупать вопрос вскрыть
объектов: 8
