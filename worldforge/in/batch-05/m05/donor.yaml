мир: фантом_пыль_донор
объекты:
  зовутся: крупинка
  видимое:
    оттенок: [пыльный, ясный, тусклый]
  скрытое:
    ядро: [альфа, бета]
  ловушки:
    - если ядро=альфа то оттенок=пыльный (65%)
  гарантии:
    - минимум 3 объектов с ядро=альфа
    - минимум 3 объектов с ядро=бета
действия:
  пощупать:
    - если ядро=альфа то мягко_姆斯
    - иначе жёстко_мс
  вскрыть:
    - если ядро=альфа то рассыпалось
    - иначе устояло
динамика:
  каждый_шаг:
    - если ядро=альфа то шанс_стать бета (8%)
    - если ядро=бета то шанс_стать альфа (8%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: ядро=альфа
экзамены:
  - зонд пощупать вопрос вскрыть
объектов: 8
