мир: якорь_лестница_медл_донор
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, яркий, тусклый]
  скрытое:
    наполнение: [полное, среднее, пустое]
  ловушки:
    - если наполнение=полное то блеск=яркий (75%)
    - если наполнение=пустое то блеск=матовый (60%)
  гарантии:
    - минимум 2 объектов с наполнение=полное
    - минимум 2 объектов с наполнение=среднее
    - минимум 2 объектов с наполнение=пустое
действия:
  пощупать:
    - если наполнение=полное то тёплое
    - если наполнение=среднее то прохладное
    - иначе ледяное
  ударить:
    - если наполнение=полное то звенит
    - если наполнение=среднее то глухо
    - иначе крошится [исчезает]
динамика:
  каждый_шаг:
    - если наполнение=полное то шанс_стать среднее (5%)
    - если наполнение=среднее то шанс_стать пустое (5%)
вмешательство:
  добыть:
    выбираешь: [блеск]
    фиксировано: наполнение=полное
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
