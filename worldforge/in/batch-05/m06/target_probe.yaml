мир: якорь_лестница_медл_цель
объекты:
  зовутся: артефакт
  видимое:
    тон: [холодный, нейтральный, тёплый]
  скрытое:
    фаза: [актив, полу, стоп]
  ловушки:
    - если фаза=актив то тон=тёплый (80%)
    - если фаза=стоп то тон=холодный (65%)
  гарантии:
    - минимум 2 объектов с фаза=актив
    - минимум 2 объектов с фаза=полу
    - минимум 2 объектов с фаза=стоп
действия:
  пощупать:
    - если фаза=актив то вибрирует
    - если фаза=полу то дрожит
    - иначе неподвижно
динамика:
  каждый_шаг:
    - если фаза=актив то шанс_стать полу (5%)
    - если фаза=полу то шанс_стать стоп (5%)
вмешательство:
  добыть:
    выбираешь: [тон]
    фиксировано: фаза=актив
объектов: 8
