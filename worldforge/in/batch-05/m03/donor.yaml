мир: сосуды_распада
объекты:
  зовутся: сосуд
  видимое:
    оттенок: [светлый, тусклый, тёмный]
  скрытое:
    прочность: [целый, трещинка, скол, крошится]
  ловушки:
    - если прочность=целый то оттенок=светлый (75%)
  гарантии:
    - минимум 2 объектов с прочность=целый
    - минимум 2 объектов с прочность=крошится
действия:
  пощупать:
    - если прочность=целый то упруго
    - если прочность=трещинка то зыбко
    - если прочность=скол то рыхло
    - иначе рассыпается_в_руках
  ударить:
    - если прочность=целый то звон_металла
    - если прочность=трещинка то глухой_стук
    - если прочность=скол то хруст
    - иначе мгновенный_распад [исчезает]
динамика:
  каждый_шаг:
    - если прочность=целый то шанс_стать трещинка (18%)
    - если прочность=трещинка то шанс_стать скол (18%)
    - если прочность=скол то шанс_стать крошится (18%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: прочность=целый
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
