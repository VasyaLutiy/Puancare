мир: плоды_старения
объекты:
  зовутся: плод
  видимое:
    окраска: [зеленоватый, желтоватый, бурый]
  скрытое:
    зрелость: [твёрдый, мягковатый, сочный, вялый]
  ловушки:
    - если зрелость=твёрдый то окраска=зеленоватый (75%)
  гарантии:
    - минимум 2 объектов с зрелость=твёрдый
    - минимум 2 объектов с зрелость=вялый
действия:
  пощупать:
    - если зрелость=твёрдый то жёстко
    - если зрелость=мягковатый то податливо
    - если зрелость=сочный то влажно
    - иначе кашица
  ударить:
    - если зрелость=твёрдый то звон_металла
    - если зрелость=мягковатый то глухой_стук
    - если зрелость=сочный то хруст
    - иначе мгновенный_распад [исчезает]
динамика:
  каждый_шаг:
    - если зрелость=твёрдый то шанс_стать мягковатый (18%)
    - если зрелость=мягковатый то шанс_стать сочный (18%)
    - если зрелость=сочный то шанс_стать вялый (18%)
вмешательство:
  сорвать_незрелый:
    выбираешь: [окраска]
    фиксировано: зрелость=твёрдый
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
