мир: кристалл_ритма
объекты:
  зовутся: фрагмент
  видимое:
    яркость: [тусклый, искристый]
  скрытое:
    фаза: [альфа, бета, гамма]
  ловушки:
    - если фаза=альфа то яркость=тусклый (100%)
  гарантии:
    - минимум 3 объектов с фаза=альфа
действия:
  простучать:
    - если фаза=альфа то глухо
    - если фаза=бета то звонко
    - иначе резонирует
  воздействовать:
    - если фаза=альфа то замерло [починка]
    - если фаза=бета то трещина [исчезает]
    - иначе вибрация [каскад]
динамика:
  каждый_шаг:
    - если фаза=альфа то шанс_стать бета (100%)
    - если фаза=бета то шанс_стать гамма (100%)
    - если фаза=гамма то шанс_стать альфа (100%)
вмешательство:
  настроить:
    выбираешь: [яркость]
    фиксировано: фаза=альфа
экзамены:
  - зонд простучать вопрос воздействовать
объектов: 9
