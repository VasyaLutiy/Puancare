мир: эхо_цикла
объекты:
  зовутся: мембрана
  видимое:
    оттенок: [матовый, яркий]
  скрытое:
    ритм: [один, два, три]
  ловушки:
    - если ритм=один то оттенок=матовый (90%)
  гарантии:
    - минимум 3 объектов с ритм=один
действия:
  простучать:
    - если ритм=один то глухо
    - если ритм=два то звонко
    - иначе резонирует
динамика:
  каждый_шаг:
    - если ритм=один то шанс_стать два (100%)
    - если ритм=два то шанс_стать три (100%)
    - если ритм=три то шанс_стать один (100%)
вмешательство:
  инициировать:
    выбираешь: [оттенок]
    фиксировано: ритм=один
объектов: 9
