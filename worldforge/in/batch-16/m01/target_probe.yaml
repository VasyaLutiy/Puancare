мир: эхо_портала
объекты:
  зовутся: мембрана
  видимое:
    оттенок: [бледный, яркий]
  скрытое:
    режим: [резонанс, статика]
  ловушки:
    - если режим=резонанс то оттенок=яркий (95%)
  гарантии:
    - минимум 4 объектов с режим=резонанс
действия:
  постучать:
    - если режим=резонанс то чисто
    - иначе мутно
динамика:
  каждый_шаг:
    - если режим=резонанс то шанс_стать статика (28%)
    - если режим=статика то шанс_стать резонанс (28%)
вмешательство:
  настроить:
    выбираешь: [оттенок]
    фиксировано: режим=резонанс
объектов: 8
