мир: кристалл_пульса
объекты:
  зовутся: фрагмент
  видимое:
    тон: [высокий, низкий]
  скрытое:
    фаза: [актив, пассив]
  ловушки:
    - если фаза=актив то тон=высокий (90%)
  гарантии:
    - минимум 4 объектов с фаза=актив
действия:
  постучать:
    - если фаза=актив то звонко
    - иначе глухо
  прижать:
    - если фаза=актив то поток [исчезает]
    - иначе вспышка [исчезает]
динамика:
  каждый_шаг:
    - если фаза=актив то шанс_стать пассив (35%)
    - если фаза=пассив то шанс_стать актив (35%)
вмешательство:
  активировать:
    выбираешь: [тон]
    фиксировано: фаза=актив
экзамены:
  - зонд постучать вопрос прижать
объектов: 8
