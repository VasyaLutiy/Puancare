мир: кристалл_памяти
объекты:
  зовутся: фрагмент
  видимое:
    яркость: [тусклый, мерцающий, яркий]
  скрытое:
    заряд: [нулевой, малый, средний, полный]
  ловушки:
    - если заряд=нулевой то яркость=тусклый (90%)
  гарантии:
    - минимум 2 объектов с заряд=полный
действия:
  проверить:
    - если заряд=нулевой то тишина
    - если заряд=малый то гул
    - если заряд=средний то звон
    - иначе рокот
  активировать:
    - если заряд=полный то взрыв [исчезает]
    - иначе пульсация [починка]
динамика:
  каждый_шаг:
    - если заряд=нулевой то шанс_стать малый (15%)
    - если заряд=малый то шанс_стать средний (15%)
    - если заряд=средний то шанс_стать полный (15%)
    - если заряд=полный то шанс_стать нулевой (5%)
вмешательство:
  подзарядить:
    выбираешь: [яркость]
    фиксировано: заряд=средний
экзамены:
  - зонд проверить вопрос активировать
объектов: 12
