мир: семя_вихря
объекты:
  зовутся: искра
  видимое:
    оттенок: [серый, синий, фиолетовый]
  скрытое:
    фаза: [инертный, активация, рост, предел]
  ловушки:
    - если фаза=инертный то оттенок=серый (95%)
  гарантии:
    - минимум 2 объектов с фаза=предел
действия:
  проверить:
    - если фаза=инертный то замирание
    - если фаза=активация то трепет
    - если фаза=рост то вибрация
    - иначе резонанс
  активировать:
    - если фаза=предел то взрыв [исчезает]
    - иначе пульсация [починка]
динамика:
  каждый_шаг:
    - если фаза=инертный то шанс_стать активация (15%)
    - если фаза=активация то шанс_стать рост (15%)
    - если фаза=рост то шанс_стать предел (15%)
    - если фаза=предел то шанс_стать инертный (5%)
вмешательство:
  стимулировать:
    выбираешь: [оттенок]
    фиксировано: фаза=рост
экзамены:
  - зонд проверить вопрос активировать
объектов: 12
