мир: тумблер_быстрый_донор
объекты:
  зовутся: кристалл
  видимое:
    фактура: [гладкий, шершавый]
  скрытое:
    фаза: [натяг, спад]
  ловушки:
    - если фаза=натяг то фактура=гладкий (75%)
  гарантии:
    - минимум 3 объектов с фаза=натяг
    - минимум 2 объектов с фаза=спад
действия:
  ощупать:
    - если фаза=натяг то пружинит
    - иначе твёрдый
  ударить:
    - если фаза=спад то отскок
    - иначе треснул [исчезает]
динамика:
  каждый_шаг:
    - если фаза=натяг то шанс_стать спад (35%)
    - если фаза=спад то шанс_стать натяг (35%)
вмешательство:
  выковать:
    выбираешь: [фактура]
    фиксировано: фаза=натяг
экзамены:
  - зонд ощупать вопрос ударить
объектов: 8
