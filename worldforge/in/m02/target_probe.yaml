мир: тумблер_быстрый_цель
объекты:
  зовутся: ядро
  видимое:
    блеск: [матовый, глянцевый]
  скрытое:
    заряд: [полный, пустой]
  ловушки:
    - если заряд=полный то блеск=глянцевый (70%)
  гарантии:
    - минимум 3 объектов с заряд=полный
    - минимум 2 объектов с заряд=пустой
действия:
  ощупать:
    - если заряд=полный то упруго
    - иначе жёстко
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать пустой (28%)
    - если заряд=пустой то шанс_стать полный (28%)
вмешательство:
  собрать:
    выбираешь: [блеск]
    фиксировано: заряд=полный
объектов: 8
