мир: пепельный_сток
объекты:
  зовутся: уголёк
  видимое:
    блеск: [искорка, матовый]
  скрытое:
    жар: [искра, пламя, пепел]
  ловушки:
    - если жар=искра то блеск=искорка (78%)
  гарантии:
    - минимум 2 объектов с жар=искра
    - минимум 2 объектов с жар=пламя
    - минимум 2 объектов с жар=пепел
действия:
  послушать:
    - если жар=искра то звенит
    - если жар=пламя то гудит
    - иначе молчит
  раздавить:
    - если жар=искра то вспыхнуло
    - если жар=пламя то тлеет
    - иначе крошится [исчезает]
динамика:
  каждый_шаг:
    - если жар=искра то шанс_стать пламя (14%)
    - если жар=пламя то шанс_стать пепел (22%)
вмешательство:
  разжечь:
    выбираешь: [блеск]
    фиксировано: жар=искра
экзамены:
  - зонд послушать вопрос раздавить
объектов: 8
