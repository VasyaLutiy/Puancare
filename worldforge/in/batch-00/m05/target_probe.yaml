мир: глиняный_сток
объекты:
  зовутся: комок
  видимое:
    поверхность: [влажная, потрескавшаяся]
  скрытое:
    стадия: [сырой, сушащийся, кирпич]
  ловушки:
    - если стадия=сырой то поверхность=влажная (72%)
  гарантии:
    - минимум 2 объектов с стадия=сырой
    - минимум 2 объектов с стадия=сушащийся
    - минимум 2 объектов с стадия=кирпич
действия:
  послушать:
    - если стадия=сырой то чавкает
    - если стадия=сушащийся то шуршит
    - иначе глухо
динамика:
  каждый_шаг:
    - если стадия=сырой то шанс_стать сушащийся (9%)
    - если стадия=сушащийся то шанс_стать кирпич (27%)
вмешательство:
  замесить:
    выбираешь: [поверхность]
    фиксировано: стадия=сырой
объектов: 8
