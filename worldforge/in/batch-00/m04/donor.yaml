мир: кольцо_заря
объекты:
  зовутся: сфера
  видимое:
    блеск: [тусклый, яркий]
  скрытое:
    фаза: [заря, полдень, сумерки]
  ловушки:
    - если фаза=заря то блеск=тусклый (75%)
  гарантии:
    - минимум 2 объектов с фаза=заря
    - минимум 2 объектов с фаза=полдень
    - минимум 2 объектов с фаза=сумерки
действия:
  прозвонить:
    - если фаза=заря то гул
    - если фаза=полдень то писк
    - если фаза=сумерки то тишина
  встряхнуть:
    - если фаза=заря то раскололось [исчезает]
    - если фаза=полдень то дребезг
    - если фаза=сумерки то отскочило
динамика:
  каждый_шаг:
    - если фаза=заря то шанс_стать полдень (12%)
    - если фаза=полдень то шанс_стать сумерки (12%)
    - если фаза=сумерки то шанс_стать заря (12%)
вмешательство:
  выплавить:
    выбираешь: [блеск]
    фиксировано: фаза=заря
экзамены:
  - зонд прозвонить вопрос встряхнуть
объектов: 8
