мир: цикл_орбит
объекты:
  зовутся: ядро
  видимое:
    тон: [холодный, тёплый]
  скрытое:
    орбита: [низ, середина, верх]
  ловушки:
    - если орбита=низ то тон=холодный (75%)
  гарантии:
    - минимум 2 объектов с орбита=низ
    - минимум 2 объектов с орбита=середина
    - минимум 2 объектов с орбита=верх
действия:
  прозвонить:
    - если орбита=низ то рокот
    - если орбита=середина то звон
    - если орбита=верх то немота
  встряхнуть:
    - если орбита=низ то рассыпалось [исчезает]
    - если орбита=середина то скрип
    - если орбита=верх то отпрянуло
динамика:
  каждый_шаг:
    - если орбита=низ то шанс_стать середина (12%)
    - если орбита=середина то шанс_стать верх (12%)
    - если орбита=верх то шанс_стать низ (12%)
вмешательство:
  собрать:
    выбираешь: [тон]
    фиксировано: орбита=низ
экзамены:
  - зонд прозвонить вопрос встряхнуть
объектов: 8
