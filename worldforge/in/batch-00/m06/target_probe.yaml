мир: топь
объекты:
  зовутся: комок
  видимое:
    тон: [бурый, зелёный, белёсый]
  скрытое:
    влажность: [сухой, влажный, мокрый]
  ловушки:
    - если влажность=сухой то тон=бурый (70%)
  гарантии:
    - минимум 2 объектов с влажность=сухой
    - минимум 2 объектов с влажность=влажный
    - минимум 2 объектов с влажность=мокрый
действия:
  пощупать:
    - если влажность=сухой то скрипит
    - иначе липнет
динамика:
  каждый_шаг:
    - если влажность=сухой то шанс_стать влажный (12%)
    - если влажность=влажный то шанс_стать мокрый (12%)
вмешательство:
  высушить:
    выбираешь: [тон]
    фиксировано: влажность=сухой
объектов: 8
