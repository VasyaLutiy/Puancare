мир: базальт
объекты:
  зовутся: глыба
  видимое:
    цвет: [пепельный, угольный, ржавый]
  скрытое:
    связность: [монолит, трещиноватый, крошка]
  ловушки:
    - если связность=монолит то цвет=угольный (70%)
  гарантии:
    - минимум 2 объектов с связность=монолит
    - минимум 2 объектов с связность=трещиноватый
    - минимум 2 объектов с связность=крошка
действия:
  пощупать:
    - если связность=монолит то холодно
    - иначе тепло
  ударить:
    - если связность=крошка то разлетелось [исчезает]
    - если связность=трещиноватый то скол
    - иначе звон
динамика:
  каждый_шаг:
    - если связность=монолит то шанс_стать трещиноватый (12%)
    - если связность=трещиноватый то шанс_стать крошка (12%)
вмешательство:
  высечь:
    выбираешь: [цвет]
    фиксировано: связность=монолит
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
