мир: лестница_распада
объекты:
  зовутся: глыба
  видимое:
    оттенок: [серый, рыжий]
  скрытое:
    износ: [целый, надтреснутый, рыхлый]
  ловушки:
    - если износ=целый то оттенок=серый (75%)
  гарантии:
    - минимум 3 объектов с износ=целый
    - минимум 2 объектов с износ=надтреснутый
действия:
  пощупать:
    - если износ=целый то гулко
    - если износ=надтреснутый то хрупко
    - иначе сыпется
  ударить:
    - если износ=целый то отскочило
    - если износ=надтреснутый то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если износ=целый то шанс_стать надтреснутый (4%)
    - если износ=надтреснутый то шанс_стать рыхлый (4%)
вмешательство:
  вытесать:
    выбираешь: [оттенок]
    фиксировано: износ=целый
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
