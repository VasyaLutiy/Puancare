мир: цепь_истощения
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, искрящий]
  скрытое:
    заряд: [полный, средний, пустой]
  ловушки:
    - если заряд=полный то блеск=искрящий (75%)
  гарантии:
    - минимум 3 объектов с заряд=полный
    - минимум 2 объектов с заряд=средний
действия:
  пощупать:
    - если заряд=полный то звенит
    - если заряд=средний то глухо
    - иначе пылится
  ударить:
    - если заряд=полный то отпрянуло
    - если заряд=средний то раскололось
    - иначе развеялось [исчезает]
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (4%)
    - если заряд=средний то шанс_стать пустой (4%)
вмешательство:
  вырастить:
    выбираешь: [блеск]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
