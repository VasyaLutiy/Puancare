мир: каскад_пяти_эпох
объекты:
  зовутся: реликт
  видимое:
    блеск: [матовый, глянцевый, рябой, искрящийся]
  скрытое:
    эпоха: [искра, пламя, жар, уголь, пепел]
  ловушки:
    - если эпоха=искра то блеск=матовый (72%)
    - если эпоха=пепел то блеск=рябой (60%)
  гарантии:
    - минимум 2 объектов с эпоха=искра
    - минимум 2 объектов с эпоха=пламя
    - минимум 1 объектов с эпоха=жар
    - минимум 1 объектов с эпоха=уголь
    - минимум 1 объектов с эпоха=пепел
действия:
  пощупать:
    - если эпоха=искра то тёплое
    - если эпоха=пламя то обжигающе
    - если эпоха=жар то сухое
    - если эпоха=уголь то хрупкое
    - иначе пыльное
  ударить:
    - если эпоха=искра то звякнуло
    - если эпоха=пламя то гулко
    - если эпоха=жар то хрустнуло
    - если эпоха=уголь то треснуло
    - иначе осыпалось [исчезает]
динамика:
  каждый_шаг:
    - если эпоха=искра то шанс_стать пламя (12%)
    - если эпоха=пламя то шанс_стать жар (12%)
    - если эпоха=жар то шанс_стать уголь (12%)
    - если эпоха=уголь то шанс_стать пепел (12%)
вмешательство:
  разжечь:
    выбираешь: [блеск]
    фиксировано: эпоха=искра
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
