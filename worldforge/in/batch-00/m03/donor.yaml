мир: лестница_пяти_звеньев
объекты:
  зовутся: образец
  видимое:
    оттенок: [бледный, яркий, мутный, пёстрый]
  скрытое:
    звено: [зерно, всход, лист, бутон, плод]
  ловушки:
    - если звено=зерно то оттенок=бледный (70%)
    - если звено=плод то оттенок=пёстрый (65%)
  гарантии:
    - минимум 2 объектов с звено=зерно
    - минимум 2 объектов с звено=всход
    - минимум 1 объектов с звено=лист
    - минимум 1 объектов с звено=бутон
    - минимум 1 объектов с звено=плод
действия:
  пощупать:
    - если звено=зерно то шершаво
    - если звено=всход то шелковисто
    - если звено=лист то гладко
    - если звено=бутон то липко
    - иначе бархатно
  ударить:
    - если звено=зерно то отскочило
    - если звено=всход то погнулось
    - если звено=лист то порвалось
    - если звено=бутон то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если звено=зерно то шанс_стать всход (12%)
    - если звено=всход то шанс_стать лист (12%)
    - если звено=лист то шанс_стать бутон (12%)
    - если звено=бутон то шанс_стать плод (12%)
вмешательство:
  прорастить:
    выбираешь: [оттенок]
    фиксировано: звено=зерно
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
