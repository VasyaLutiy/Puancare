мир: резонатор
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, блестящий]
  скрытое:
    фаза: [плюс, минус]
  ловушки:
    - если фаза=плюс то блеск=блестящий (75%)
  гарантии:
    - минимум 3 объектов с фаза=плюс
    - минимум 3 объектов с фаза=минус
действия:
  коснуться:
    - если фаза=плюс то тепло
    - иначе холодно
  сжать:
    - если фаза=минус то пружинит
    - иначе треск [исчезает]
динамика:
  каждый_шаг:
    - если фаза=плюс то шанс_стать минус (32%)
    - если фаза=минус то шанс_стать плюс (32%)
вмешательство:
  вырастить:
    выбираешь: [блеск]
    фиксировано: фаза=плюс
экзамены:
  - зонд коснуться вопрос сжать
объектов: 8
