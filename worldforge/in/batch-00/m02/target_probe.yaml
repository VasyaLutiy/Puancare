мир: осциллятор
объекты:
  зовутся: узел
  видимое:
    тон: [высокий, низкий]
  скрытое:
    полюс: [красный, синий]
  ловушки:
    - если полюс=красный то тон=высокий (70%)
  гарантии:
    - минимум 3 объектов с полюс=красный
    - минимум 3 объектов с полюс=синий
действия:
  коснуться:
    - если полюс=красный то мягко
    - иначе твёрдо
динамика:
  каждый_шаг:
    - если полюс=красный то шанс_стать синий (38%)
    - если полюс=синий то шанс_стать красный (38%)
вмешательство:
  настроить:
    выбираешь: [тон]
    фиксировано: полюс=красный
объектов: 8
