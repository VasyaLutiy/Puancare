мир: мир_цель_лестница
объекты:
  зовутся: сфера
  видимое:
    текстура: [гладкий, шероховатый, пористый]
  скрытое:
    стабильность: [активен, инертен, распад]
  ловушки:
    - если стабильность=активен то текстура=гладкий (80%)
  гарантии:
    - минимум 3 объектов с стабильность=активен
действия:
  послушать:
    - если стабильность=активен то звон
    - если стабильность=инертен то скрип
    - иначе глухо
динамика:
  каждый_шаг:
    - если стабильность=активен то шанс_стать инертен (5%)
    - если стабильность=инертен то шанс_стать распад (5%)
вмешательство:
  возбудить:
    выбираешь: [текстура]
    фиксировано: стабильность=активен
объектов: 8
