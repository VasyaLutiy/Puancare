мир: мир_донор_лестница
объекты:
  зовутся: кристалл
  видимое:
    форма: [круглый, овальный, граненый]
  скрытое:
    энергия: [заряжен, разряжен, разрушен]
  ловушки:
    - если энергия=заряжен то форма=круглый (80%)
  гарантии:
    - минимум 3 объектов с энергия=заряжен
действия:
  послушать:
    - если энергия=заряжен то гудение
    - если энергия=разряжен то шелест
    - иначе тишина
  разрезать:
    - если энергия=заряжен то вспышка [исчезает]
    - если энергия=разряжен то искра [исчезает]
    - иначе тлен [исчезает]
динамика:
  каждый_шаг:
    - если энергия=заряжен то шанс_стать разряжен (5%)
    - если энергия=разряжен то шанс_стать разрушен (5%)
вмешательство:
  зарядить:
    выбираешь: [форма]
    фиксировано: энергия=заряжен
экзамены:
  - зонд послушать вопрос разрезать
объектов: 8
