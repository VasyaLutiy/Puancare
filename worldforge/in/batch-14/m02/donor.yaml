мир: мир_донора
объекты:
  зовутся: кристалл
  видимое:
    форма: [круглая, острая]
  скрытое:
    заряд: [активен, пассивен]
  ловушки:
    - если заряд=активен то форма=круглая (85%)
  garantii:
    - минимум 3 объектов с заряд=активен
действия:
  посмотреть_близко:
    - если заряд=активен то мерцает
    - иначе тусклый
  активировать:
    - если заряд=активен то вспышка
    - иначе разряд
динамика:
  каждый_шаг:
    - если заряд=активен то шанс_стать пассивен (30%)
    - если заряд=пассивен то шанс_стать активен (30%)
вмешательство:
  зарядить:
    выбираешь: [форма]
    фиксировано: заряд=активен
экзамены:
  - зонд посмотреть_близко вопрос активировать
объектов: 8
