мир: мир_цели
объекты:
  зовутся: элемент
  видимое:
    текстура: [гладкий, шероховатый]
  скрытое:
    статус: [заряжен, разряжен]
  ловушки:
    - если статус=заряжен то текстура=гладкий (85%)
  garantii:
    - минимум 3 объектов с статус=заряжен
действия:
  посмотреть_близко:
    - если статус=заряжен то фосфоресцирует
    - иначе тёмный
  активировать:
    - если статус=заряжен то вспышка
    - иначе разряд
динамика:
  каждый_шаг:
    - если статус=заряжен то шанс_стать разряжен (40%)
    - если статус=разряжен то шанс_стать заряжен (40%)
вмешательство:
  воздействовать:
    выбираешь: [текстура]
    фиксировано: статус=заряжен
экзамены:
  - зонд посмотреть_близко вопрос активировать
объектов: 8
