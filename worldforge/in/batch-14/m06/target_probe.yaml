мир: цель_прибор
объекты:
  зовутся: девайс
  видимое:
    корпус: [новый, потертый]
  скрытое:
    заряд: [полный, слабый, разряжен]
  ловушки:
    - если заряд=полный то корпус=новый (80%)
  гарантии:
    - минимум 3 объектов с заряд=полный
действия:
  оценить:
    - если заряд=полный то гудит
    - если заряд=слабый то пищит
    - иначе молчит
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать слабый (6%)
    - если заряд=слабый то шанс_стать разряжен (6%)
вмешательство:
  зарядить:
    выбираешь: [корпус]
    фиксировано: заряд=полный
объектов: 8
