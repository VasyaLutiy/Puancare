мир: донор_сад
объекты:
  зовутся: плод
  видимое:
    текстура: [глянцевый, матовый]
  скрытое:
    зрелость: [зеленый, спелый, перезрелый]
  ловушки:
    - если зрелость=зеленый то текстура=глянцевый (80%)
  гарантии:
    - минимум 3 объектов с зрелость=зеленый
действия:
  оценить:
    - если зрелость=зеленый то твердо
    - если зрелость=спелый то податливо
    - иначе кашица
  употребить:
    - если зрелость=зеленый то вкусно [исчезает]
    - если зрелость=спелый то терпимо [исчезает]
    - иначе отравление [исчезает]
динамика:
  каждый_шаг:
    - если зрелость=зеленый то шанс_стать спелый (6%)
    - если зрелость=спелый то шанс_стать перезрелый (6%)
вмешательство:
  вырастить:
    выбираешь: [текстура]
    фиксировано: зрелость=зеленый
экзамены:
  - зонд оценить вопрос употребить
объектов: 8
