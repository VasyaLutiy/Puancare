мир: цель_древний_эфир
объекты:
  зовутся: эфирит
  видимое:
    свечение: [тусклое, яркое]
  скрытое:
    стабильность: [активный, средний, инертный]
  ловушки:
    - если стабильность=активный то свечение=яркое (85%)
  гарантии:
    - минимум 3 объектов с стабильность=активный
действия:
  сканировать:
    - если стабильность=активный то вибрация
    - иначе покой
динамика:
  каждый_шаг:
    - если стабильность=активный то шанс_стать средний (15%)
    - если стабильность=средний то шанс_стать инертный (15%)
вмешательство:
  материализовать:
    выбираешь: [свечение]
    фиксировано: стабильность=активный
объектов: 8
