мир: донор_магнитная_пыль
объекты:
  зовутся: пылинка
  видимое:
    плотность: [рыхлая, плотная]
  скрытое:
    заряд: [плюс, ноль, минус]
  ловушки:
    - если заряд=плюс то плотность=рыхлая (85%)
  гарантии:
    - минимум 3 объектов с заряд=плюс
действия:
  сканировать:
    - если заряд=плюс то гудение
    - иначе тишина
  разрядить:
    - если заряд=ноль то тлен [исчезает]
    - иначе вспышка [исчезает]
динамика:
  каждый_шаг:
    - если заряд=плюс то шанс_стать ноль (15%)
    - если заряд=ноль то шанс_стать минус (15%)
вмешательство:
  синтез:
    выбираешь: [плотность]
    фиксировано: заряд=плюс
экзамены:
  - зонд сканировать вопрос разрядить
объектов: 8
