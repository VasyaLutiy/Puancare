мир: мир_донор_сток
объекты:
  зовутся: кристалл
  видимое:
    оболочка: [гладкая, шершавая]
  скрытое:
    заряд: [полный, средний, исчерпан]
  lovyashki:
    - если заряд=полный то оболочка=гладкая (80%)
  гарантии:
    - минимум 3 объектов с заряд=полный
действия:
  измерить:
    - если заряд=полный то гудит
    - если заряд=средний то пищит
    - иначе молчит
  применить:
    - если заряд=полный то вспышка
    - если заряд=средний то искры_слабые
    - иначе тишина [исчезает]
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (15%)
    - если заряд=средний то шанс_стать исчерпан (15%)
вмешательство:
  зарядить:
    выбираешь: [оболочка]
    фиксировано: заряд=полный
экзамены:
  - зонд измерить вопрос применить
объектов: 8
