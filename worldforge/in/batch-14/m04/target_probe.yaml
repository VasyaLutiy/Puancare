мир: мир_цель_сток_родич
объекты:
  зовутся: сфера
  видимое:
    текстура: [матовая, глянцевая]
  скрытое:
    фаза: [активная, угасание, мёртвая]
  ловушки:
    - если фаза=активная то текстура=глянцевая (80%)
  гарантии:
    - минимум 3 объектов с фаза=активная
действия:
  измерить:
    - если фаза=активная то резонирует
    - если фаза=угасание то вибрирует
    - иначе покоится
динамика:
  каждый_шаг:
    - если фаза=активная то шанс_стать угасание (30%)
    - если фаза=угасание то шанс_стать мёртвая (30%)
вмешательство:
  возбудить:
    выбираешь: [текстура]
    фиксировано: фаза=активная
объектов: 8
