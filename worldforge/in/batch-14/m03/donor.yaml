мир: донор_глубокая_цепь
объекты:
  зовутся: резонатор
  видимое:
    оттенок: [светлый, темный]
  скрытое:
    энергия: [заряд_а, заряд_б, заряд_в, заряд_г]
  ловушки:
    - если энергия=заряд_а то оттенок=светлый (80%)
  гарантии:
    - минимум 2 объектов с энергия=заряд_а
    - минимум 2 объектов с энергия=заряд_б
действия:
  послушать:
    - если энергия=заряд_а то тишина
    - если энергия=заряд_б то шорох
    - если энергия=заряд_в то гул
    - иначе треск
  выхлоп:
    - если энергия=заряд_а то вспышка
    - если энергия=заряд_б то искра
    - если энергия=заряд_в то дым
    - иначе копоть
динамика:
  каждый_шаг:
    - если энергия=заряд_а то шанс_стать заряд_б (15%)
    - если энергия=заряд_б то шанс_стать заряд_в (15%)
    - если энергия=заряд_в то шанс_стать заряд_г (15%)
вмешательство:
  накачать:
    выбираешь: [оттенок]
    фиксировано: энергия=заряд_а
объектов: 8
