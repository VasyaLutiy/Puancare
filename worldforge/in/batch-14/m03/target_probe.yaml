мир: цель_глубокая_цепь
объекты:
  зовутся: излучатель
  видимое:
    глянец: [матовый, блестящий]
  скрытое:
    потенциал: [этап_0, этап_1, этап_2, этап_3]
  ловушки:
    - если потенциал=этап_0 то глянец=блестящий (80%)
  гарантии:
    - минимум 2 объектов с потенциал=этап_0
    - минимум 2 объектов с потенциал=этап_1
действия:
  послушать:
    - если потенциал=этап_0 то покой
    - если потенциал=этап_1 то скрип
    - если потенциал=этап_2 то звон
    - иначе свист
динамика:
  каждый_шаг:
    - если потенциал=этап_0 то шанс_стать этап_1 (15%)
    - если потенциал=этап_1 то шанс_стать этап_2 (15%)
    - если потенциал=этап_2 то шанс_стать этап_3 (15%)
вмешательство:
  сбросить:
    выбираешь: [глянец]
    фиксировано: потенциал=этап_0
объектов: 8
