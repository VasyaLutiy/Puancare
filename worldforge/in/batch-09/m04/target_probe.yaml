мир: выгар_печи
объекты:
  зовутся: печька
  видимое:
    жар: [розовый, оранжевый, багровый]
  скрытое:
    жаркость: [полная, средняя, остывшая]
  ловушки:
    - если жаркость=полная то жар=розовый (70%)
  гарантии:
    - минимум 2 объектов с жаркость=полная
    - минимум 2 объектов с жаркость=средняя
    - минимум 2 объектов с жаркость=остывшая
действия:
  пощупать:
    - если жаркость=полная то обжигает
    - если жаркость=средняя то тёплая
    - иначе холодная
динамика:
  каждый_шаг:
    - если жаркость=полная то шанс_стать средняя (14%)
    - если жаркость=средняя то шанс_стать остывшая (14%)
вмешательство:
  разжечь:
    выбираешь: [жар]
    фиксировано: жаркость=полная
объектов: 8
