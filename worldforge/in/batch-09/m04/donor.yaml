мир: осыпь_уступов
объекты:
  зовутся: глыба
  видимое:
    тон: [светлый, пепельный, угольный]
  скрытое:
    пласт: [верхний, средний, нижний]
  ловушки:
    - если пласт=верхний то тон=светлый (70%)
  гарантии:
    - минимум 2 объектов с пласт=верхний
    - минимум 2 объектов с пласт=средний
    - минимум 2 объектов с пласт=нижний
действия:
  пощупать:
    - если пласт=верхний то гладко
    - если пласт=средний то шершаво
    - иначе крошится
  ударить:
    - если пласт=верхний то устояло
    - если пласт=средний то треснуло
    - иначе прах [исчезает]
динамика:
  каждый_шаг:
    - если пласт=верхний то шанс_стать средний (14%)
    - если пласт=средний то шанс_стать нижний (14%)
вмешательство:
  поднять:
    выбираешь: [тон]
    фиксировано: пласт=верхний
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
