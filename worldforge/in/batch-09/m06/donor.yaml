мир: лестница_распада
объекты:
  зовутся: глыба
  видимое:
    блеск: [тусклый, искрящийся]
  скрытое:
    целостность: [цельный, надлом, крошка]
  ловушки:
    - если целостность=цельный то блеск=искрящийся (75%)
  гарантии:
    - минимум 2 объектов с целостность=цельный
    - минимум 2 объектов с целостность=надлом
    - минимум 2 объектов с целостность=крошка
действия:
  пощупать:
    - если целостность=цельный то упруго
    - если целостность=надлом то хрустко
    - иначе зыбко
  разжать:
    - если целостность=цельный то зазвенело
    - если целостность=надлом то треснуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если целостность=цельный то шанс_стать надлом (12%)
    - если целостность=надлом то шанс_стать крошка (12%)
вмешательство:
  выточить:
    выбираешь: [блеск]
    фиксировано: целостность=цельный
экзамены:
  - зонд пощупать вопрос разжать
объектов: 8
