мир: кольцо_метаморфоз
объекты:
  зовутся: семя
  видимое:
    тон: [ясный, мглистый]
  скрытое:
    фаза: [зародыш, бутон, цвет]
  ловушки:
    - если фаза=зародыш то тон=ясный (70%)
  гарантии:
    - минимум 2 объектов с фаза=зародыш
    - минимум 2 объектов с фаза=бутон
    - минимум 2 объектов с фаза=цвет
действия:
  пощупать:
    - если фаза=зародыш то твёрдо
    - если фаза=бутон то гибко
    - иначе сочно
динамика:
  каждый_шаг:
    - если фаза=зародыш то шанс_стать бутон (12%)
    - если фаза=бутон то шанс_стать цвет (12%)
    - если фаза=цвет то шанс_стать зародыш (12%)
вмешательство:
  посеять:
    выбираешь: [тон]
    фиксировано: фаза=зародыш
объектов: 8
