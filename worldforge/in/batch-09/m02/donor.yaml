мир: кристальная_лестница
объекты:
  зовутся: друза
  видимое:
    блеск: [матовый, стеклянный, искристый]
  скрытое:
    горизонт: [кора, прослой, пласт, фундамент]
  ловушки:
    - если горизонт=кора то блеск=матовый (72%)
    - если горизонт=фундамент то блеск=искристый (68%)
  гарантии:
    - минимум 2 объектов с горизонт=кора
    - минимум 2 объектов с горизонт=фундамент
    - минимум 1 объектов с горизонт=прослой
действия:
  простучать:
    - если горизонт=кора то звон
    - если горизонт=прослой то гул
    - если горизонт=пласт то треск
    - иначе глушь
  вскрыть:
    - если горизонт=кора то пыль
    - если горизонт=прослой то крошка
    - если горизонт=пласт то осколок
    - иначе монолит
динамика:
  каждый_шаг:
    - если горизонт=кора то шанс_стать прослой (10%)
    - если горизонт=прослой то шанс_стать пласт (10%)
    - если горизонт=пласт то шанс_стать фундамент (10%)
вмешательство:
  вырастить:
    выбираешь: [блеск]
    фиксировано: горизонт=кора
экзамены:
  - зонд простучать вопрос вскрыть
объектов: 8
