мир: торфяная_лестница
объекты:
  зовутся: брикет
  видимое:
    тон: [светлый, рыжий, тёмный]
  скрытое:
    слой: [пена, рыхлый, плотный, камень]
  ловушки:
    - если слой=пена то тон=светлый (74%)
    - если слой=камень то тон=тёмный (66%)
  гарантии:
    - минимум 2 объектов с слой=пена
    - минимум 2 объектов с слой=камень
    - минимум 1 объектов с слой=рыхлый
действия:
  простучать:
    - если слой=пена то шлёп
    - если слой=рыхлый то шурф
    - если слой=плотный то гулко
    - иначе звяк
  вскрыть:
    - если слой=пена то пыль
    - если слой=рыхлый то крошка
    - если слой=плотный то осколок
    - иначе монолит
динамика:
  каждый_шаг:
    - если слой=пена то шанс_стать рыхлый (10%)
    - если слой=рыхлый то шанс_стать плотный (10%)
    - если слой=плотный то шанс_стать камень (10%)
вмешательство:
  нарезать:
    выбираешь: [тон]
    фиксировано: слой=пена
экзамены:
  - зонд простучать вопрос вскрыть
объектов: 8
