мир: увядающий_сад
объекты:
  зовутся: плод
  видимое:
    оттенок: [алый, бурый, пепельный]
  скрытое:
    фаза: [живая, сохнущая, мёртвая]
  ловушки:
    - если фаза=живая то оттенок=алый (75%)
    - если фаза=мёртвая то оттенок=пепельный (70%)
  гарантии:
    - минимум 2 объектов с фаза=живая
    - минимум 2 объектов с фаза=сохнущая
    - минимум 1 объектов с фаза=мёртвая
действия:
  пощупать:
    - если фаза=живая то упруго
    - если фаза=сохнущая то мягко
    - иначе крошится
  раздавить:
    - если фаза=живая то брызнуло
    - если фаза=сохнущая то смялось
    - иначе пыль [исчезает]
динамика:
  каждый_шаг:
    - если фаза=живая то шанс_стать сохнущая (25%)
    - если фаза=сохнущая то шанс_стать мёртвая (25%)
вмешательство:
  сорвать:
    выбираешь: [оттенок]
    фиксировано: фаза=живая
экзамены:
  - зонд пощупать вопрос раздавить
объектов: 8
