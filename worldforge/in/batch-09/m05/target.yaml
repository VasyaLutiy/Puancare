мир: ржавеющая_кузня
объекты:
  зовутся: слиток
  видимое:
    блеск: [яркий, тусклый, матовый]
  скрытое:
    степень: [целый, пористый, тлен]
  ловушки:
    - если степень=целый то блеск=яркий (72%)
    - если степень=тлен то блеск=матовый (68%)
  гарантии:
    - минимум 2 объектов с степень=целый
    - минимум 2 объектов с степень=пористый
    - минимум 1 объектов с степень=тлен
действия:
  пощупать:
    - если степень=целый то гладко
    - если степень=пористый то шершаво
    - иначе рассыпается
  раздавить:
    - если степень=целый то брызнуло
    - если степень=пористый то смялось
    - иначе пыль [исчезает]
динамика:
  каждый_шаг:
    - если степень=целый то шанс_стать пористый (22%)
    - если степень=пористый то шанс_стать тлен (22%)
вмешательство:
  отлить:
    выбираешь: [блеск]
    фиксировано: степень=целый
экзамены:
  - зонд пощупать вопрос раздавить
объектов: 8
