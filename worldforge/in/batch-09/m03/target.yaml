мир: контур_реле
объекты:
  зовутся: капсула
  видимое:
    фактура: [гладкая, шероховатая]
  скрытое:
    режим: [тихий, активный]
  ловушки:
    - если режим=тихий то фактура=гладкая (70%)
  гарантии:
    - минимум 3 объектов с режим=тихий
    - минимум 3 объектов с режим=активный
действия:
  пощупать:
    - если режим=тихий то холод
    - иначе пульс
  ударить:
    - если режим=активный то сработало
    - иначе не_завелось
динамика:
  каждый_шаг:
    - если режим=тихий то шанс_стать активный (15%)
    - если режим=активный то шанс_стать тихий (15%)
вмешательство:
  настроить:
    выбираешь: [фактура]
    фиксировано: режим=активный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
