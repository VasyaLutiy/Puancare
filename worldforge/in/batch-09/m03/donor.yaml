мир: резонатор_тумблер
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [матовый, блестящий]
  скрытое:
    фаза: [покой, возбуждение]
  ловушки:
    - если фаза=покой то оттенок=матовый (75%)
  гарантии:
    - минимум 3 объектов с фаза=покой
    - минимум 3 объектов с фаза=возбуждение
действия:
  пощупать:
    - если фаза=покой то тепло
    - иначе вибрация
  ударить:
    - если фаза=возбуждение то сработало
    - иначе не_завелось
динамика:
  каждый_шаг:
    - если фаза=покой то шанс_стать возбуждение (12%)
    - если фаза=возбуждение то шанс_стать покой (12%)
вмешательство:
  зарядить:
    выбираешь: [оттенок]
    фиксировано: фаза=возбуждение
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
