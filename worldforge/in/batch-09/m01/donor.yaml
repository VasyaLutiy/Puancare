мир: лестница_затухания
объекты:
  зовутся: кристалл
  видимое:
    блеск: [яркий, тусклый, мертвый]
  скрытое:
    заряд: [полный, средний, пустой]
  ловушки:
    - если заряд=полный то блеск=яркий (75%)
    - если заряд=пустой то блеск=мертвый (70%)
  гарантии:
    - минимум 2 объектов с заряд=полный
    - минимум 2 объектов с заряд=средний
    - минимум 2 объектов с заряд=пустой
действия:
  пощупать:
    - если заряд=полный то тепло
    - если заряд=средний то тепловато
    - иначе холодно
  применить:
    - если заряд=полный то вспышка
    - если заряд=средний то мерцание
    - иначе тишина
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (4%)
    - если заряд=средний то шанс_стать пустой (4%)
вмешательство:
  выковать:
    выбираешь: [блеск]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос применить
объектов: 8
