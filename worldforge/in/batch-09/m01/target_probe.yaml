мир: тракт_оскудения
объекты:
  зовутся: сфера
  видимое:
    фактура: [гладкая, рябая, трещиноватая]
  скрытое:
    напор: [крепкий, угасающий, иссякший]
  ловушки:
    - если напор=крепкий то фактура=гладкая (75%)
    - если напор=иссякший то фактура=трещиноватая (70%)
  гарантии:
    - минимум 2 объектов с напор=крепкий
    - минимум 2 объектов с напор=угасающий
    - минимум 2 объектов с напор=иссякший
действия:
  пощупать:
    - если напор=крепкий то пульс_сильный
    - если напор=угасающий то пульс_слабый
    - иначе без_пульса
динамика:
  каждый_шаг:
    - если напор=крепкий то шанс_стать угасающий (4%)
    - если напор=угасающий то шанс_стать иссякший (4%)
вмешательство:
  сплести:
    выбираешь: [фактура]
    фиксировано: напор=крепкий
объектов: 8
