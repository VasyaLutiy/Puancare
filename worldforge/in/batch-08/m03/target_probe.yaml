мир: каскад_тока
объекты:
  зовутся: сфера
  видимое:
    рельеф: [гладкий, бугристый, зубчатый]
  скрытое:
    ступень: [верх, средне, низина, дно]
  ловушки:
    - если ступень=верх то рельеф=гладкий (80%)
    - если ступень=дно то рельеф=зубчатый (75%)
  гарантии:
    - минимум 2 объектов с ступень=верх
    - минимум 2 объектов с ступень=средне
    - минимум 2 объектов с ступень=низина
действия:
  потрогать:
    - если ступень=верх то звенит
    - если ступень=средне то гудит
    - если ступень=низина то шуршит
    - иначе молчит
динамика:
  каждый_шаг:
    - если ступень=верх то шанс_стать средне (12%)
    - если ступень=средне то шанс_стать низина (12%)
    - если ступень=низина то шанс_стать дно (12%)
вмешательство:
  сотворить:
    выбираешь: [рельеф]
    фиксировано: ступень=верх
объектов: 8
