мир: глубинная_лестница
объекты:
  зовутся: реликт
  видимое:
    оттенок: [алый, сизый, серый]
  скрытое:
    фаза: [пик, спад, низ, ноль]
  ловушки:
    - если фаза=пик то оттенок=алый (80%)
    - если фаза=ноль то оттенок=серый (75%)
  гарантии:
    - минимум 2 объектов с фаза=пик
    - минимум 2 объектов с фаза=спад
    - минимум 2 объектов с фаза=низ
действия:
  потрогать:
    - если фаза=пик то обжигает
    - если фаза=спад то теплеет
    - если фаза=низ то холодит
    - иначе леденеет
  толкнуть:
    - если фаза=пик то вспышка
    - если фаза=спад то свечение
    - если фаза=низ то мерцание
    - иначе тьма
динамика:
  каждый_шаг:
    - если фаза=пик то шанс_стать спад (12%)
    - если фаза=спад то шанс_стать низ (12%)
    - если фаза=низ то шанс_стать ноль (12%)
вмешательство:
  взрастить:
    выбираешь: [оттенок]
    фиксировано: фаза=пик
экзамены:
  - зонд потрогать вопрос толкнуть
объектов: 8
