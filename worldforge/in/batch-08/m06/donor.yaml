мир: каскад_накала
объекты:
  зовутся: искра
  видимое:
    оттенок: [бледный, насыщенный]
  скрытое:
    накал: [жарко, тепло, остыло]
  ловушки:
    - если накал=жарко то оттенок=насыщенный (75%)
  гарантии:
    - минимум 3 объектов с накал=жарко
    - минимум 2 объектов с накал=тепло
действия:
  пощупать:
    - если накал=жарко то обжигает
    - если накал=тепло то тёплое
    - иначе холодное
  ударить:
    - если накал=жарко то вспыхнуло
    - если накал=тепло то дрогнуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если накал=жарко то шанс_стать тепло (12%)
    - если накал=тепло то шанс_стать остыло (12%)
вмешательство:
  разжечь:
    выбираешь: [оттенок]
    фиксировано: накал=жарко
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
