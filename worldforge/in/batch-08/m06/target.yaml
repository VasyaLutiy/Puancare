мир: круговорот_тонов
объекты:
  зовутся: резонатор
  видимое:
    фактура: [гладкая, пористая]
  скрытое:
    тон: [высокий, средний, низкий]
  ловушки:
    - если тон=высокий то фактура=гладкая (70%)
  гарантии:
    - минимум 3 объектов с тон=высокий
    - минимум 2 объектов с тон=средний
действия:
  пощупать:
    - если тон=высокий то звенит
    - если тон=средний то гудит
    - иначе молчит
  ударить:
    - если тон=высокий то вспыхнуло
    - если тон=средний то дрогнуло
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если тон=высокий то шанс_стать средний (12%)
    - если тон=средний то шанс_стать низкий (12%)
    - если тон=низкий то шанс_стать высокий (12%)
вмешательство:
  настроить:
    выбираешь: [фактура]
    фиксировано: тон=высокий
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
