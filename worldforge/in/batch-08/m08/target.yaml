мир: колебание_контур
объекты:
  зовутся: плита
  видимое:
    фактура: [шероховатый, гладкий]
  скрытое:
    заряд: [полный, пустой]
  ловушки:
    - если заряд=полный то фактура=гладкий (72%)
  гарантии:
    - минимум 3 объектов с заряд=полный
    - минимум 3 объектов с заряд=пустой
действия:
  прозвонить:
    - если заряд=полный то вибрирует
    - иначе немой
  нажать:
    - если заряд=полный то вспыхнул
    - иначе потух
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать пустой (27%)
    - если заряд=пустой то шанс_стать полный (27%)
вмешательство:
  высечь:
    выбираешь: [фактура]
    фиксировано: заряд=полный
экзамены:
  - зонд прозвонить вопрос нажать
объектов: 8
