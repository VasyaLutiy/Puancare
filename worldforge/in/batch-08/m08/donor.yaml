мир: резонанс_маятник
объекты:
  зовутся: звено
  видимое:
    оттенок: [тёплый, холодный]
  скрытое:
    полюс: [плюс, минус]
  ловушки:
    - если полюс=плюс то оттенок=тёплый (78%)
  гарантии:
    - минимум 3 объектов с полюс=плюс
    - минимум 3 объектов с полюс=минус
действия:
  прозвонить:
    - если полюс=плюс то звенит
    - иначе глухо
  нажать:
    - если полюс=плюс то вспыхнул
    - иначе потух
динамика:
  каждый_шаг:
    - если полюс=плюс то шанс_стать минус (30%)
    - если полюс=минус то шанс_стать плюс (30%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: полюс=плюс
экзамены:
  - зонд прозвонить вопрос нажать
объектов: 8
