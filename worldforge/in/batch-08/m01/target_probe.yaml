мир: стопка_коры
объекты:
  зовутся: плита
  видимое:
    блеск: [матовый, глянцевый, тусклый]
  скрытое:
    толща: [наружный, средний, донный]
  ловушки:
    - если толща=наружный то блеск=глянцевый (72%)
    - если толща=донный то блеск=матовый (68%)
  гарантии:
    - минимум 2 объектов с толща=наружный
    - минимум 2 объектов с толща=средний
    - минимум 2 объектов с толща=донный
действия:
  пощупать:
    - если толща=наружный то сыпется
    - если толща=средний то зернисто
    - иначе плотный
динамика:
  каждый_шаг:
    - если толща=наружный то шанс_стать средний (10%)
    - если толща=средний то шанс_стать донный (14%)
вмешательство:
  отколоть:
    выбираешь: [блеск]
    фиксировано: толща=наружный
объектов: 8
