мир: осыпь_пласта
объекты:
  зовутся: глыба
  видимое:
    оттенок: [рыжий, серый, белёсый]
  скрытое:
    слой: [верх, середина, низ]
  ловушки:
    - если слой=верх то оттенок=рыжий (75%)
    - если слой=низ то оттенок=серый (70%)
  гарантии:
    - минимум 2 объектов с слой=верх
    - минимум 2 объектов с слой=середина
    - минимум 2 объектов с слой=низ
действия:
  пощупать:
    - если слой=верх то крошится
    - если слой=середина то шершаво
    - иначе твёрдый
  ударить:
    - если слой=верх то разлетелось
    - если слой=середина то треснуло
    - иначе гулко
динамика:
  каждый_шаг:
    - если слой=верх то шанс_стать середина (12%)
    - если слой=середина то шанс_стать низ (12%)
вмешательство:
  вырезать:
    выбираешь: [оттенок]
    фиксировано: слой=верх
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
