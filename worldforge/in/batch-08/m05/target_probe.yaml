мир: спираль_тонов
объекты:
  зовутся: сосуд
  видимое:
    оттенок: [бледный, насыщенный, глубокий]
  скрытое:
    слой: [верх, середина, низ]
  ловушки:
    - если слой=верх то оттенок=бледный (74%)
    - если слой=середина то оттенок=насыщенный (66%)
  гарантии:
    - минимум 2 объектов с слой=верх
    - минимум 2 объектов с слой=середина
    - минимум 2 объектов с слой=низ
действия:
  пощупать:
    - если слой=верх то нежно
    - если слой=середина то упруго
    - иначе вязко
динамика:
  каждый_шаг:
    - если слой=верх то шанс_стать середина (4%)
    - если слой=середина то шанс_стать низ (4%)
    - если слой=низ то шанс_стать верх (4%)
вмешательство:
  отлить:
    выбираешь: [оттенок]
    фиксировано: слой=верх
объектов: 8
