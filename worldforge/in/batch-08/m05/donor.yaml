мир: кольцо_зарядов
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, глянцевый, искрящийся]
  скрытое:
    фаза: [заря, полдень, закат]
  ловушки:
    - если фаза=заря то блеск=матовый (72%)
    - если фаза=полдень то блеск=глянцевый (68%)
  гарантии:
    - минимум 2 объектов с фаза=заря
    - минимум 2 объектов с фаза=полдень
    - минимум 2 объектов с фаза=закат
действия:
  пощупать:
    - если фаза=заря то тепло
    - если фаза=полдень то обжигает
    - иначе холодит
  ударить:
    - если фаза=заря то треснул
    - если фаза=полдень то звякнул
    - иначе рассыпался [исчезает]
динамика:
  каждый_шаг:
    - если фаза=заря то шанс_стать полдень (4%)
    - если фаза=полдень то шанс_стать закат (4%)
    - если фаза=закат то шанс_стать заря (4%)
вмешательство:
  вырастить:
    выбираешь: [блеск]
    фиксировано: фаза=заря
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
