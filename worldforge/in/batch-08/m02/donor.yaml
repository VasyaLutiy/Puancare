мир: кольцо_фаз
объекты:
  зовутся: сфера
  видимое:
    оттенок: [светлый, тусклый, пёстрый]
  скрытое:
    фаза: [искра, дуга, вспышка]
  ловушки:
    - если фаза=искра то оттенок=светлый (75%)
  гарантии:
    - минимум 2 объектов с фаза=искра
    - минимум 2 объектов с фаза=дуга
    - минимум 2 объектов с фаза=вспышка
действия:
  потрогать:
    - если фаза=искра то тепло
    - если фаза=дуга то зыбь
    - если фаза=вспышка то холод
  сжать:
    - если фаза=искра то крошится
    - если фаза=дуга то гнётся
    - если фаза=вспышка то звенит
динамика:
  каждый_шаг:
    - если фаза=искра то шанс_стать дуга (12%)
    - если фаза=дуга то шанс_стать вспышка (12%)
    - если фаза=вспышка то шанс_стать искра (12%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: фаза=искра
экзамены:
  - зонд потрогать вопрос сжать
объектов: 8
