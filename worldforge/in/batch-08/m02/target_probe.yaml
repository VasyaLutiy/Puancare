мир: лестница_слоёв
объекты:
  зовутся: плод
  видимое:
    поверхность: [матовая, глянцевая, шероховатая]
  скрытое:
    слой: [кора, мякоть, ядро]
  ловушки:
    - если слой=кора то поверхность=глянцевая (70%)
  гарантии:
    - минимум 2 объектов с слой=кора
    - минимум 2 объектов с слой=мякоть
    - минимум 2 объектов с слой=ядро
действия:
  потрогать:
    - если слой=кора то гладко
    - если слой=мякоть то вязко
    - если слой=ядро то твёрдо
динамика:
  каждый_шаг:
    - если слой=кора то шанс_стать мякоть (12%)
    - если слой=мякоть то шанс_стать ядро (12%)
вмешательство:
  вырастить:
    выбираешь: [поверхность]
    фиксировано: слой=кора
объектов: 8
