мир: быстрое_кольцо
объекты:
  зовутся: сфера
  видимое:
    оттенок: [бледный, густой]
  скрытое:
    фаза: [узел_р, узел_с, узел_т]
  ловушки:
    - если фаза=узел_р то оттенок=густой (65%)
  гарантии:
    - минимум 2 объектов с фаза=узел_р
    - минимум 2 объектов с фаза=узел_с
    - минимум 2 объектов с фаза=узел_т
действия:
  пощупать:
    - если фаза=узел_р то мягко
    - если фаза=узел_с то упруго
    - иначе жёстко
  вскрыть:
    - если фаза=узел_р то зарядило
    - если фаза=узел_с то искра
    - иначе пусто
динамика:
  каждый_шаг:
    - если фаза=узел_р то шанс_стать узел_с (15%)
    - если фаза=узел_с то шанс_стать узел_т (15%)
    - если фаза=узел_т то шанс_стать узел_р (15%)
вмешательство:
  создать:
    выбираешь: [оттенок]
    фиксировано: фаза=узел_р
экзамены:
  - зонд пощупать вопрос вскрыть
объектов: 8
