мир: медленное_кольцо
объекты:
  зовутся: кристалл
  видимое:
    блеск: [матовый, сверкающий]
  скрытое:
    цикл: [стадия_а, стадия_б, стадия_в]
  ловушки:
    - если цикл=стадия_а то блеск=сверкающий (70%)
  гарантии:
    - минимум 2 объектов с цикл=стадия_а
    - минимум 2 объектов с цикл=стадия_б
    - минимум 2 объектов с цикл=стадия_в
действия:
  пощупать:
    - если цикл=стадия_а то тепло
    - если цикл=стадия_б то прохладно
    - иначе ледяное
  вскрыть:
    - если цикл=стадия_а то зарядило
    - если цикл=стадия_б то искра
    - иначе пусто
динамика:
  каждый_шаг:
    - если цикл=стадия_а то шанс_стать стадия_б (4%)
    - если цикл=стадия_б то шанс_стать стадия_в (4%)
    - если цикл=стадия_в то шанс_стать стадия_а (4%)
вмешательство:
  вырастить:
    выбираешь: [блеск]
    фиксировано: цикл=стадия_а
экзамены:
  - зонд пощупать вопрос вскрыть
объектов: 8
