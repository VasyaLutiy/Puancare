мир: лестница_глыб
объекты:
  зовутся: глыба
  видимое:
    оттенок: [серый, бурый, пепельный]
  скрытое:
    прочность: [цельный, надтреснутый, крошащийся]
  ловушки:
    - если прочность=цельный то оттенок=серый (72%)
  гарантии:
    - минимум 2 объектов с прочность=цельный
    - минимум 2 объектов с прочность=надтреснутый
    - минимум 1 объектов с прочность=крошащийся
действия:
  пощупать:
    - если прочность=цельный то твёрдый
    - если прочность=надтреснутый то упругий
    - иначе рыхлый
  разбить:
    - если прочность=цельный то отскочило
    - если прочность=надтреснутый то раскололось
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если прочность=цельный то шанс_стать надтреснутый (12%)
    - если прочность=надтреснутый то шанс_стать крошащийся (12%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: прочность=цельный
экзамены:
  - зонд пощупать вопрос разбить
объектов: 8
