мир: спад_осколков
объекты:
  зовутся: осколок
  видимое:
    сияние: [яркое, тусклое, мутное]
  скрытое:
    целостность: [монолит, трещиноват, пыль]
  ловушки:
    - если целостность=монолит то сияние=яркое (68%)
  гарантии:
    - минимум 2 объектов с целостность=монолит
    - минимум 2 объектов с целостность=трещиноват
    - минимум 1 объектов с целостность=пыль
действия:
  пощупать:
    - если целостность=монолит то гладкий
    - иначе шершавый
  разбить:
    - если целостность=монолит то отскочило
    - если целостность=трещиноват то раскололось
    - иначе рассыпалось [исчезает]
динамика:
  каждый_шаг:
    - если целостность=монолит то шанс_стать трещиноват (12%)
    - если целостность=трещиноват то шанс_стать пыль (12%)
вмешательство:
  вырастить:
    выбираешь: [сияние]
    фиксировано: целостность=монолит
экзамены:
  - зонд пощупать вопрос разбить
объектов: 8
