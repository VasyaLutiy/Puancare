мир: батарейка_сток_а
объекты:
  зовутся: кругляш
  видимое:
    оттенок: [рыжий, сизый]
  скрытое:
    заряд: [бодрый, погасший]
  ловушки:
    - если заряд=бодрый то оттенок=рыжий (78%)
  гарантии:
    - минимум 3 объектов с заряд=бодрый
    - минимум 2 объектов с заряд=погасший
действия:
  послушать:
    - если заряд=бодрый то гудит
    - иначе тишь
  подключить:
    - если заряд=бодрый то вспыхнуло
    - иначе тьма
динамика:
  каждый_шаг:
    - если заряд=бодрый то шанс_стать погасший (14%)
вмешательство:
  изготовить:
    выбираешь: [оттенок]
    фиксировано: заряд=бодрый
экзамены:
  - зонд послушать вопрос подключить
объектов: 8
