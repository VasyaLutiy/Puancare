мир: искра_сток_б
объекты:
  зовутся: капсула
  видимое:
    фактура: [гладкая, шершавая]
  скрытое:
    живность: [искрит, обуглилась]
  ловушки:
    - если живность=искрит то фактура=гладкая (72%)
  гарантии:
    - минимум 3 объектов с живность=искрит
    - минимум 2 объектов с живность=обуглилась
действия:
  послушать:
    - если живность=искрит то треск
    - иначе пусто
  подключить:
    - если живность=искрит то вспыхнуло
    - иначе тьма
динамика:
  каждый_шаг:
    - если живность=искрит то шанс_стать обуглилась (11%)
вмешательство:
  собрать:
    выбираешь: [фактура]
    фиксировано: живность=искрит
экзамены:
  - зонд послушать вопрос подключить
объектов: 8
