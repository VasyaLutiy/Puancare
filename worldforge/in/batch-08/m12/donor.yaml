мир: донор_лестница_медленная
объекты:
  зовутся: валун
  видимое:
    оттенок: [бледный, густой, пёстрый]
  скрытое:
    целостность: [монолит, трещина, крошка]
  ловушки:
    - если целостность=монолит то оттенок=густой (70%)
    - если целостность=крошка то оттенок=бледный (65%)
  гарантии:
    - минимум 2 объектов с целостность=монолит
    - минимум 2 объектов с целостность=трещина
    - минимум 2 объектов с целостность=крошка
действия:
  пощупать:
    - если целостность=монолит то твёрдо
    - если целостность=трещина то шатко
    - если целостность=крошка то рассыпается
  ударить:
    - если целостность=монолит то отскочило
    - если целостность=трещина то хрустнуло
    - если целостность=крошка то пуф [исчезает]
динамика:
  каждый_шаг:
    - если целостность=монолит то шанс_стать трещина (5%)
    - если целостность=трещина то шанс_стать крошка (5%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: целостность=монолит
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
