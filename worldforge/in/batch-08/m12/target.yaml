мир: цель_лестница_быстрая
объекты:
  зовутся: глыба
  видимое:
    фактура: [гладкая, шершавая, зернистая]
  скрытое:
    плотность: [ядро, слой, пыль]
  ловушки:
    - если плотность=ядро то фактура=гладкая (75%)
    - если плотность=пыль то фактура=зернистая (70%)
  гарантии:
    - минимум 2 объектов с плотность=ядро
    - минимум 2 объектов с плотность=слой
    - минимум 2 объектов с плотность=пыль
действия:
  пощупать:
    - если плотность=ядро то массив
    - если плотность=слой то пружина
    - если плотность=пыль то пустота
  ударить:
    - если плотность=ядро то отскочило
    - если плотность=слой то хрустнуло
    - если плотность=пыль то пуф [исчезает]
динамика:
  каждый_шаг:
    - если плотность=ядро то шанс_стать слой (20%)
    - если плотность=слой то шанс_стать пыль (20%)
вмешательство:
  выплавить:
    выбираешь: [фактура]
    фиксировано: плотность=ядро
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
