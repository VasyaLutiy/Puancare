мир: остывающий_шлак
объекты:
  зовутся: глыба
  видимое:
    фактура: [гладкая, зернистая, трещиноватая]
  скрытое:
    жар: [раскалён, тёплый, стынул]
  ловушки:
    - если жар=раскалён то фактура=гладкая (75%)
    - если жар=стынул то фактура=трещиноватая (70%)
  гарантии:
    - минимум 2 объектов с жар=раскалён
    - минимум 2 объектов с жар=тёплый
    - минимум 2 объектов с жар=стынул
действия:
  потрогать:
    - если жар=раскалён то обжигает
    - если жар=тёплый то греет
    - если жар=стынул то ледяной
динамика:
  каждый_шаг:
    - если жар=раскалён то шанс_стать тёплый (12%)
    - если жар=тёплый то шанс_стать стынул (15%)
вмешательство:
  отлить:
    выбираешь: [фактура]
    фиксировано: жар=раскалён
объектов: 8
