мир: каскад_искр
объекты:
  зовутся: искра
  видимое:
    оттенок: [золотой, сизый, пепельный]
  скрытое:
    фаза: [заряжен, тусклый, погас]
  ловушки:
    - если фаза=заряжен то оттенок=золотой (70%)
    - если фаза=погас то оттенок=пепельный (65%)
  гарантии:
    - минимум 2 объектов с фаза=заряжен
    - минимум 2 объектов с фаза=тусклый
    - минимум 2 объектов с фаза=погас
действия:
  потрогать:
    - если фаза=заряжен то трепет
    - если фаза=тусклый то вибрация
    - если фаза=погас то холод
  применить:
    - если фаза=заряжен то сияние
    - если фаза=тусклый то мерцание
    - если фаза=погас то темнота
динамика:
  каждый_шаг:
    - если фаза=заряжен то шанс_стать тусклый (12%)
    - если фаза=тусклый то шанс_стать погас (15%)
    - если фаза=погас то шанс_стать заряжен (3%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: фаза=заряжен
экзамены:
  - зонд потрогать вопрос применить
объектов: 8
