мир: зыбкий_контур
объекты:
  зовутся: капсула
  видимое:
    блеск: [матовый, глянцевый]
  скрытое:
    модус: [глухой, живой]
  ловушки:
    - если модус=глухой то блеск=матовый (70%)
  гарантии:
    - минимум 3 объектов с модус=глухой
    - минимум 3 объектов с модус=живой
действия:
  пощупать:
    - если модус=глухой то туго
    - иначе пружинит
динамика:
  каждый_шаг:
    - если модус=глухой то шанс_стать живой (25%)
    - если модус=живой то шанс_стать глухой (25%)
вмешательство:
  собрать:
    выбираешь: [блеск]
    фиксировано: модус=живой
объектов: 8
