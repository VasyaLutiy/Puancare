мир: мерцающий_клинок
объекты:
  зовутся: пластина
  видимое:
    оттенок: [ясный, мутный]
  скрытое:
    фаза: [покой, дрожь]
  ловушки:
    - если фаза=покой то оттенок=ясный (78%)
  гарантии:
    - минимум 3 объектов с фаза=покой
    - минимум 3 объектов с фаза=дрожь
действия:
  пощупать:
    - если фаза=покой то бархатно
    - иначе искрит
  использовать:
    - если фаза=покой то потрескалось
    - иначе загудело
динамика:
  каждый_шаг:
    - если фаза=покой то шанс_стать дрожь (6%)
    - если фаза=дрожь то шанс_стать покой (6%)
вмешательство:
  выковать:
    выбираешь: [оттенок]
    фиксировано: фаза=покой
экзамены:
  - зонд пощупать вопрос использовать
объектов: 8
