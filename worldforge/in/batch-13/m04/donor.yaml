мир: decay_lattice
объекты:
  зовутся: shard
  видимое:
    цвет: [тусклый, яркий]
  скрытое:
    уровень: [низкий, средний, высокий]
  ловушки:
    - если уровень=низкий то цвет=тусклый (75%)
  гарантии:
    - минимум 3 объекта с уровень=низкий
    - минимум 3 объекта с уровень=средний
    - минимум 3 объекта с уровень=высокий
действия:
  сжать:
    - если уровень=низкий то мягко
    - если уровень=средний то мягко
    - если уровень=высокий то жёстко
  стукнуть:
    - если уровень=низкий то звенит
    - если уровень=средний то глухо
    - если уровень=высокий то молчит
динамика:
  каждый_шаг:
    - если уровень=низкий то шанс_стать средний (12%)
    - если уровень=средний то шанс_стать высокий (12%)
вмешательство:
  добыть:
    выбираешь: [цвет]
    фиксировано: уровень=низкий
экзамены:
  - зонд сжать вопрос стукнуть
объектов: 8
