мир: phase_grid
объекты:
  зовутся: node
  видимое:
    оттенок: [бледный, насыщенный]
  скрытое:
    фаза: [ранняя, зрелая, конечная]
  ловушки:
    - если фаза=ранняя то оттенок=бледный (70%)
  гарантии:
    - минимум 3 объекта с фаза=ранняя
    - минимум 3 объекта с фаза=зрелая
    - минимум 3 объекта с фаза=конечная
действия:
  сжать:
    - если фаза=ранняя то тепло
    - если фаза=зрелая то тепло
    - если фаза=конечная то холодно
  стукнуть:
    - если фаза=ранняя то звенит
    - если фаза=зрелая то глухо
    - если фаза=конечная то молчит
динамика:
  каждый_шаг:
    - если фаза=ранняя то шанс_стать зрелая (12%)
    - если фаза=зрелая то шанс_стать конечная (12%)
вмешательство:
  добыть:
    выбираешь: [оттенок]
    фиксировано: фаза=ранняя
экзамены:
  - зонд сжать вопрос стукнуть
объектов: 8
