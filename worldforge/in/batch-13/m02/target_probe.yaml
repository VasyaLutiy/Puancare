мир: тумблер_смещённый
объекты:
  зовутся: штука
  видимое:
    поверхность: [ровная, бугристая]
  скрытое:
    полярность: [север, юг]
  ловушки:
    - если полярность=север то поверхность=ровная (70%)
  гарантии:
    - минимум 4 объектов с полярность=север
  объектов: 8
действия:
  ощупать:
    - если полярность=север то тепло
    - иначе холодно
  встряхнуть:
    - если полярность=юг то отскочило
    - иначе прилипло
динамика:
  каждый_шаг:
    - если полярность=север то шанс_стать юг (37%)
    - если полярность=юг то шанс_стать север (37%)
вмешательство:
  добыть:
    выбираешь: [поверхность]
    фиксировано: полярность=север
