мир: тумблер_быстрый
объекты:
  зовутся: штука
  видимое:
    форма: [гладкая, шершавая]
  скрытое:
    полярность: [север, юг]
  ловушки:
    - если полярность=север то форма=гладкая (75%)
  гарантии:
    - минимум 4 объектов с полярность=север
  объектов: 8
действия:
  ощупать:
    - если полярность=север то тепло
    - иначе холодно
  толкнуть:
    - если полярность=север то щелкнуло
    - иначе не_отреагировало
  встряхнуть:
    - если полярность=юг то отскочило
    - иначе прилипло
динамика:
  каждый_шаг:
    - если полярность=север то шанс_стать юг (32%)
    - если полярность=юг то шанс_стать север (32%)
вмешательство:
  добыть:
    выбираешь: [форма]
    фиксировано: полярность=север
экзамены:
  - зонд ощупать вопрос толкнуть
