мир: цепь_спада
объекты:
  зовутся: вещь
  видимое:
    блеск: [тусклый, яркий]
  скрытое:
    фаза: [начало, середина, конец]
  ловушки:
    - если фаза=начало то блеск=яркий (75%)
  гарантии:
    - минимум 3 объекта с фаза=начало
    - минимум 3 объекта с фаза=середина
    - минимум 2 объекта с фаза=конец
действия:
  пощупать:
    - если фаза=начало то тепло
    - если фаза=середина то нейтрально
    - иначе холодно
  ударить:
    - если фаза=начало то отскочило
    - если фаза=середина то треснуло
    - иначе разбилось [исчезает]
динамика:
  каждый_шаг:
    - если фаза=начало то шанс_стать середина (4%)
    - если фаза=середина то шанс_стать конец (4%)
вмешательство:
  добыть:
    выбираешь: [блеск]
    фиксировано: фаза=начало
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
