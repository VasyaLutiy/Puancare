мир: нисхождение
объекты:
  зовутся: предмет
  видимое:
    вес: [лёгкий, тяжёлый]
  скрытое:
    стадия: [ранняя, средняя, финал]
  ловушки:
    - если стадия=ранняя то вес=лёгкий (70%)
  гарантии:
    - минимум 3 объекта с стадия=ранняя
    - минимум 3 объекта с стадия=средняя
    - минимум 2 объекта с стадия=финал
действия:
  пощупать:
    - если стадия=ранняя то гладко
    - если стадия=средняя то шершаво
    - иначе колко
  ударить:
    - если стадия=ранняя то отскочило
    - если стадия=средняя то треснуло
    - иначе разбилось [исчезает]
динамика:
  каждый_шаг:
    - если стадия=ранняя то шанс_стать средняя (3%)
    - если стадия=средняя то шанс_стать финал (3%)
вмешательство:
  добыть:
    выбираешь: [вес]
    фиксировано: стадия=ранняя
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
