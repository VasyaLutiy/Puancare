мир: тумблер_гул_цель
объекты:
  зовутся: пластина
  видимое:
    блеск: [блестящий, матовый]
  скрытое:
    тональность: [звонкая, пресная]
  ловушки:
    - если тональность=звонкая то блеск=блестящий (72%)
  гарантии:
    - минимум 3 объектов с тональность=звонкая
    - минимум 3 объектов с тональность=пресная
действия:
  послушать:
    - если тональность=звонкая то рокочет
    - иначе молчит
динамика:
  каждый_шаг:
    - если тональность=звонкая то шанс_стать пресная (27%)
    - если тональность=пресная то шанс_стать звонкая (27%)
вмешательство:
  настроить:
    выбираешь: [блеск]
    фиксировано: тональность=звонкая
объектов: 8
