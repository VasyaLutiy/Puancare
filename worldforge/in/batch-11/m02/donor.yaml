мир: тумблер_гул_донор
объекты:
  зовутся: кристалл
  видимое:
    оттенок: [яркий, тусклый]
  скрытое:
    вибрация: [гулкая, немая]
  ловушки:
    - если вибрация=гулкая то оттенок=яркий (78%)
  гарантии:
    - минимум 3 объектов с вибрация=гулкая
    - минимум 3 объектов с вибрация=немая
действия:
  послушать:
    - если вибрация=гулкая то гудит
    - иначе тишина
  ударить:
    - если вибрация=гулкая то звенит
    - иначе глухо
динамика:
  каждый_шаг:
    - если вибрация=гулкая то шанс_стать немая (34%)
    - если вибрация=немая то шанс_стать гулкая (34%)
вмешательство:
  зарядить:
    выбираешь: [оттенок]
    фиксировано: вибрация=гулкая
экзамены:
  - зонд послушать вопрос ударить
объектов: 8
