мир: руна_угасание
объекты:
  зовутся: осколок
  видимое:
    блеск: [яркий, тусклый]
  скрытое:
    заряд: [полный, средний, пустой]
  ловушки:
    - если заряд=полный то блеск=яркий (78%)
  гарантии:
    - минимум 3 объектов с заряд=полный
    - минимум 2 объектов с заряд=средний
действия:
  пощупать:
    - если заряд=полный то тепло
    - если заряд=средний то прохладно
    - иначе холодно
  ударить:
    - если заряд=полный то гул
    - если заряд=средний то треск
    - иначе прах [исчезает]
динамика:
  каждый_шаг:
    - если заряд=полный то шанс_стать средний (5%)
    - если заряд=средний то шанс_стать пустой (4%)
вмешательство:
  высечь:
    выбираешь: [блеск]
    фиксировано: заряд=полный
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
