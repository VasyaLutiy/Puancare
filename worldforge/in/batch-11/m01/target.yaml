мир: плод_увядание
объекты:
  зовутся: ягода
  видимое:
    оттенок: [насыщенный, блеклый]
  скрытое:
    спелость: [сок, мягкость, сушь]
  ловушки:
    - если спелость=сок то оттенок=насыщенный (78%)
  гарантии:
    - минимум 3 объектов с спелость=сок
    - минимум 2 объектов с спелость=мягкость
действия:
  пощупать:
    - если спелость=сок то упруго
    - если спелость=мягкость то рыхло
    - иначе крошится
  ударить:
    - если спелость=сок то гул
    - если спелость=мягкость то треск
    - иначе прах [исчезает]
динамика:
  каждый_шаг:
    - если спелость=сок то шанс_стать мягкость (5%)
    - если спелость=мягкость то шанс_стать сушь (4%)
вмешательство:
  сорвать:
    выбираешь: [оттенок]
    фиксировано: спелость=сок
экзамены:
  - зонд пощупать вопрос ударить
объектов: 8
