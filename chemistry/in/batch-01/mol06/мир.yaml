мир: салицилаль
объекты:
  зовутся: порция
  видимое:
    оттенок: [сизый, охристый, мшистый]
    крап: [есть, нет]
  скрытое:
    доокисление: [альдегидная, кислотная]
  ловушки:
    - если доокисление=альдегидная то оттенок=сизый (80%)
  гарантии:
    - минимум 2 объектов с доокисление=альдегидная
    - минимум 2 объектов с доокисление=кислотная
действия:
  проба_бромной_воды:
    - иначе белый_осадок
  проба_марганцовки:
    - если доокисление=альдегидная то обесцветилось
    - иначе нет_реакции
  проба_толленса:
    - если доокисление=альдегидная то серебряное_зеркало
    - иначе нет_реакции
  проба_хлорида_железа:
    - иначе фиолетовое_окрашивание
динамика:
  каждый_шаг:
    - если доокисление=альдегидная то шанс_стать кислотная (12%)
вмешательство:
  обновить:
    выбираешь: [оттенок]
    фиксировано: доокисление=альдегидная
экзамены:
  - зонд проба_марганцовки вопрос проба_толленса
объектов: 8
