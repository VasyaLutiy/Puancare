мир: ацетонка
объекты:
  зовутся: порция
  видимое:
    оттенок: [сизый, охристый, мшистый]
    крап: [есть, нет]
  скрытое:
    таутомерия_мк: [кетонная, енольная]
  ловушки:
    - если таутомерия_мк=кетонная то оттенок=сизый (80%)
  гарантии:
    - минимум 2 объектов с таутомерия_мк=кетонная
    - минимум 2 объектов с таутомерия_мк=енольная
действия:
  проба_бромной_воды:
    - если таутомерия_мк=енольная то обесцветилось
    - иначе нет_реакции
  проба_хлорида_железа:
    - если таутомерия_мк=енольная то красное_окрашивание
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если таутомерия_мк=кетонная то шанс_стать енольная (6%)
    - если таутомерия_мк=енольная то шанс_стать кетонная (25%)
вмешательство:
  обновить:
    выбираешь: [оттенок]
    фиксировано: таутомерия_мк=кетонная
экзамены:
  - зонд проба_бромной_воды вопрос проба_хлорида_железа
объектов: 8
