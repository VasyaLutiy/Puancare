мир: хлоргидрин
объекты:
  зовутся: порция
  видимое:
    оттенок: [сизый, охристый, мшистый]
    крап: [есть, нет]
  скрытое:
    окисление_втор: [спиртовая, кетонная]
  ловушки:
    - если окисление_втор=спиртовая то оттенок=сизый (80%)
  гарантии:
    - минимум 2 объектов с окисление_втор=спиртовая
    - минимум 2 объектов с окисление_втор=кетонная
действия:
  проба_марганцовки:
    - если окисление_втор=спиртовая то обесцветилось
    - иначе нет_реакции
  бросить_натрий:
    - если окисление_втор=спиртовая то пузырьки_водорода
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если окисление_втор=спиртовая то шанс_стать кетонная (12%)
вмешательство:
  обновить:
    выбираешь: [оттенок]
    фиксировано: окисление_втор=спиртовая
экзамены:
  - зонд проба_марганцовки вопрос бросить_натрий
объектов: 8
