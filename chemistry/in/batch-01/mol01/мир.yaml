мир: этаноль
объекты:
  зовутся: порция
  видимое:
    оттенок: [сизый, охристый, мшистый]
    крап: [есть, нет]
  скрытое:
    окисление: [спиртовая, альдегидная, кислотная]
  ловушки:
    - если окисление=спиртовая то оттенок=сизый (80%)
  гарантии:
    - минимум 2 объектов с окисление=спиртовая
    - минимум 2 объектов с окисление=альдегидная
    - минимум 2 объектов с окисление=кислотная
действия:
  проба_марганцовки:
    - если окисление=спиртовая то обесцветилось
    - если окисление=альдегидная то обесцветилось
    - иначе нет_реакции
  проба_толленса:
    - если окисление=альдегидная то серебряное_зеркало
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если окисление=спиртовая то шанс_стать альдегидная (12%)
    - если окисление=альдегидная то шанс_стать кислотная (12%)
вмешательство:
  обновить:
    выбираешь: [оттенок]
    фиксировано: окисление=спиртовая
экзамены:
  - зонд проба_марганцовки вопрос проба_толленса
объектов: 8
