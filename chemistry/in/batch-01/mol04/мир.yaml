мир: анилинум
объекты:
  зовутся: порция
  видимое:
    оттенок: [сизый, охристый, мшистый]
    крап: [есть, нет]
  скрытое:
    протонирование: [щелочная, солевая]
  ловушки:
    - если протонирование=щелочная то оттенок=сизый (80%)
  гарантии:
    - минимум 2 объектов с протонирование=щелочная
    - минимум 2 объектов с протонирование=солевая
действия:
  лакмус:
    - если протонирование=щелочная то посинел
    - если протонирование=солевая то слабо_покраснел
    - иначе не_изменился
  понюхать:
    - если протонирование=щелочная то рыбный_запах
    - иначе без_запаха
  поджечь:
    - иначе сильно_коптит
динамика:
  каждый_шаг:
    - если протонирование=щелочная то шанс_стать солевая (6%)
    - если протонирование=солевая то шанс_стать щелочная (6%)
вмешательство:
  обновить:
    выбираешь: [оттенок]
    фиксировано: протонирование=щелочная
экзамены:
  - зонд лакмус вопрос понюхать
объектов: 8
