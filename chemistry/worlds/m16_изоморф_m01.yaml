мир: m16_изоморф_m01
объекты:
  зовутся: образец
  видимое:
    корка: [ноль, один, два]
    шум: [плюс, минус]
  скрытое:
    уровень: [фаза_а, фаза_б, фаза_в]
  ловушки:
    - если уровень=фаза_а то корка=ноль (85%)
    - если уровень=фаза_в то корка=два (75%)
  гарантии:
    - минимум 2 объектов с уровень=фаза_а
    - минимум 2 объектов с уровень=фаза_б
    - минимум 2 объектов с уровень=фаза_в
действия:
  тест_один:
    - если уровень=фаза_б то блик
    - иначе молчит
  тест_два:
    - если уровень=фаза_в то шип
    - иначе молчит
  тест_три:
    - если уровень=фаза_а то поблекло
    - если уровень=фаза_б то поблекло
    - иначе молчит
динамика:
  каждый_шаг:
    - если уровень=фаза_а то шанс_стать фаза_б (12%)
    - если уровень=фаза_б то шанс_стать фаза_в (12%)
вмешательство:
  заново:
    выбираешь: [корка]
    фиксировано: уровень=фаза_а
экзамены:
  - зонд тест_один вопрос тест_два
объектов: 8
