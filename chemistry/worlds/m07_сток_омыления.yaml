мир: m07_сток_омыления
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    состав: [эфирный, распавшийся]
  ловушки:
    - если состав=эфирный то вид=светлый (80%)
  гарантии:
    - минимум 2 объектов с состав=эфирный
    - минимум 2 объектов с состав=распавшийся
действия:
  понюхать:
    - если состав=эфирный то фруктовый_запах
    - иначе без_запаха
  иодоформная_проба:
    - если состав=распавшийся то жёлтый_осадок_с_запахом
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если состав=эфирный то шанс_стать распавшийся (12%)
вмешательство:
  этерифицировать:
    выбираешь: [вид]
    фиксировано: состав=эфирный
экзамены:
  - зонд понюхать вопрос иодоформная_проба
объектов: 8
