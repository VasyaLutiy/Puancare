мир: m09_сток_полимеризации
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    степень: [мономерная, полимерная]
  ловушки:
    - если степень=полимерная то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с степень=мономерная
    - минимум 2 объектов с степень=полимерная
действия:
  проба_бромной_воды:
    - если степень=мономерная то обесцветилось
    - иначе нет_реакции
  проба_марганцовки:
    - если степень=мономерная то обесцветилось
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если степень=мономерная то шанс_стать полимерная (12%)
вмешательство:
  долить_мономера:
    выбираешь: [вид]
    фиксировано: степень=мономерная
экзамены:
  - зонд проба_бромной_воды вопрос проба_марганцовки
объектов: 8
