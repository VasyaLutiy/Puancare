мир: m02_лестница_вторичного
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    окисление: [спиртовая, кетонная]
  ловушки:
    - если окисление=спиртовая то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с окисление=спиртовая
    - минимум 2 объектов с окисление=кетонная
действия:
  бросить_натрий:
    - если окисление=спиртовая то пузырьки_водорода
    - иначе нет_реакции
  иодоформная_проба:
    - если окисление=кетонная то жёлтый_осадок_с_запахом
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если окисление=спиртовая то шанс_стать кетонная (12%)
вмешательство:
  влить_спирт:
    выбираешь: [вид]
    фиксировано: окисление=спиртовая
экзамены:
  - зонд бросить_натрий вопрос иодоформная_проба
объектов: 8
