мир: m15_галогениды
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    галоген: [хлор, бром, иод]
  ловушки:
    - если галоген=иод то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с галоген=хлор
    - минимум 2 объектов с галоген=бром
    - минимум 2 объектов с галоген=иод
действия:
  добавить_хлорной_воды:
    - если галоген=бром то желтоватое_окрашивание
    - если галоген=иод то бурое_окрашивание
    - иначе без_изменений
  капнуть_ляпис:
    - если галоген=хлор то белый_осадок
    - если галоген=бром то кремовый_осадок
    - если галоген=иод то жёлтый_осадок
    - иначе без_видимых_изменений
вмешательство:
  растворить_соль:
    выбираешь: [вид]
    фиксировано: галоген=хлор
экзамены:
  - зонд добавить_хлорной_воды вопрос капнуть_ляпис
объектов: 8
