мир: m14_альдегид_или_кетон
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    карбонил: [альдегидный, кетонный]
  ловушки:
    - если карбонил=альдегидный то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с карбонил=альдегидный
    - минимум 2 объектов с карбонил=кетонный
действия:
  проба_толленса:
    - если карбонил=альдегидный то серебряное_зеркало
    - иначе нет_реакции
  проба_фелинга:
    - если карбонил=альдегидный то кирпичный_осадок
    - иначе нет_реакции
вмешательство:
  получить:
    выбираешь: [вид]
    фиксировано: карбонил=альдегидный
экзамены:
  - зонд проба_толленса вопрос проба_фелинга
объектов: 8
