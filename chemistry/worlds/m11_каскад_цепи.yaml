мир: m11_каскад_цепи
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    активность: [активная, инертная]
  ловушки:
    - если активность=активная то вид=пёстрый (80%)
  гарантии:
    - минимум 2 объектов с активность=активная
    - минимум 2 объектов с активность=инертная
сущности:
  зовутся: цепь
  штук: 2
  состояния: [целая, рваная]
  связаны_с: 1 (активность=активная)
действия:
  осмотр:
    - если активность=активная то светится
    - иначе тускло
  осветить:
    - если активность=активная то вспышка [каскад]
    - иначе ничего
  израсходовать:
    - если активность=активная то выдохлась [исчезает]
    - иначе выдохлась [исчезает]
  осмотреть_цепь @сущность:
    - если состояние=целая то держит
    - иначе повисла
  добавить_ингибитор @сущность:
    - если состояние=целая то уже_цела
    - если связанный_отсутствует то порция_израсходована
    - иначе восстановлена [починка]
вмешательство:
  внести_инициатор:
    выбираешь: [вид]
    фиксировано: активность=активная
экзамены:
  - зонд осмотр вопрос осветить
объектов: 8
