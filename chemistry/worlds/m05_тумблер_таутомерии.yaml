мир: m05_тумблер_таутомерии
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    таутомер: [кетонная, енольная]
  ловушки:
    - если таутомер=кетонная то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с таутомер=кетонная
    - минимум 2 объектов с таутомер=енольная
действия:
  проба_хлорида_железа:
    - если таутомер=енольная то красное_окрашивание
    - иначе нет_реакции
  проба_бромной_воды:
    - если таутомер=енольная то обесцветилось
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если таутомер=кетонная то шанс_стать енольная (6%)
    - если таутомер=енольная то шанс_стать кетонная (25%)
вмешательство:
  встряхнуть:
    выбираешь: [вид]
    фиксировано: таутомер=кетонная
экзамены:
  - зонд проба_хлорида_железа вопрос проба_бромной_воды
объектов: 8
