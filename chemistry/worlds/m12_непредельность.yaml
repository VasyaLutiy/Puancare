мир: m12_непредельность
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    тип_связи: [насыщенная, ненасыщенная, кольцевая]
  ловушки:
    - если тип_связи=ненасыщенная то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с тип_связи=насыщенная
    - минимум 2 объектов с тип_связи=ненасыщенная
    - минимум 2 объектов с тип_связи=кольцевая
действия:
  поджечь:
    - если тип_связи=насыщенная то ровное_пламя
    - если тип_связи=ненасыщенная то коптящее_пламя
    - если тип_связи=кольцевая то сильно_коптит
    - иначе не_поджигали
  проба_бромной_воды:
    - если тип_связи=ненасыщенная то обесцветилось
    - иначе нет_реакции
  проба_марганцовки:
    - если тип_связи=ненасыщенная то обесцветилось
    - иначе нет_реакции
вмешательство:
  очистить:
    выбираешь: [вид]
    фиксировано: тип_связи=насыщенная
экзамены:
  - зонд поджечь вопрос проба_бромной_воды
объектов: 8
