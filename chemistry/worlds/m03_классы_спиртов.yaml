мир: m03_классы_спиртов
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    класс: [первичная, вторичная, третичная]
  ловушки:
    - если класс=третичная то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с класс=первичная
    - минимум 2 объектов с класс=вторичная
    - минимум 2 объектов с класс=третичная
действия:
  проба_лукаса:
    - если класс=первичная то прозрачно
    - если класс=вторичная то помутнело_медленно
    - если класс=третичная то помутнело_сразу
    - иначе нет_реакции
  проба_марганцовки:
    - если класс=первичная то обесцветилось
    - если класс=вторичная то обесцветилось
    - иначе нет_реакции
вмешательство:
  синтезировать:
    выбираешь: [вид]
    фиксировано: класс=первичная
экзамены:
  - зонд проба_лукаса вопрос проба_марганцовки
объектов: 8
