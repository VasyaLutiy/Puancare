мир: m04_тумблер_амина
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    форма: [щелочная, солевая]
  ловушки:
    - если форма=щелочная то вид=светлый (80%)
  гарантии:
    - минимум 2 объектов с форма=щелочная
    - минимум 2 объектов с форма=солевая
действия:
  понюхать:
    - если форма=щелочная то рыбный_запах
    - иначе без_запаха
  лакмус:
    - если форма=щелочная то посинел
    - если форма=солевая то слабо_покраснел
    - иначе не_изменился
динамика:
  каждый_шаг:
    - если форма=щелочная то шанс_стать солевая (6%)
    - если форма=солевая то шанс_стать щелочная (6%)
вмешательство:
  подщелочить:
    выбираешь: [вид]
    фиксировано: форма=щелочная
экзамены:
  - зонд понюхать вопрос лакмус
объектов: 8
