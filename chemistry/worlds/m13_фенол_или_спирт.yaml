мир: m13_фенол_или_спирт
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    природа: [кольцевой_OH, цепочечный_OH]
  ловушки:
    - если природа=кольцевой_OH то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с природа=кольцевой_OH
    - минимум 2 объектов с природа=цепочечный_OH
действия:
  проба_хлорида_железа:
    - если природа=кольцевой_OH то фиолетовое_окрашивание
    - иначе нет_реакции
  проба_бромной_воды:
    - если природа=кольцевой_OH то белый_осадок
    - иначе нет_реакции
вмешательство:
  приготовить:
    выбираешь: [вид]
    фиксировано: природа=кольцевой_OH
экзамены:
  - зонд проба_хлорида_железа вопрос проба_бромной_воды
объектов: 8
