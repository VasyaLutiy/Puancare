мир: m10_кольцо_катализа
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    стадия: [свободная, связанная, отдающая]
  ловушки:
    - если стадия=связанная то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с стадия=свободная
    - минимум 2 объектов с стадия=связанная
    - минимум 2 объектов с стадия=отдающая
действия:
  осмотреть_окраску:
    - если стадия=свободная то бледная
    - если стадия=связанная то насыщенная
    - иначе тусклая
  проверить_активность:
    - если стадия=свободная то готов
    - если стадия=связанная то занят
    - иначе сброс
динамика:
  каждый_шаг:
    - если стадия=свободная то шанс_стать связанная (25%)
    - если стадия=связанная то шанс_стать отдающая (25%)
    - если стадия=отдающая то шанс_стать свободная (25%)
вмешательство:
  запустить:
    выбираешь: [вид]
    фиксировано: стадия=свободная
экзамены:
  - зонд осмотреть_окраску вопрос проверить_активность
объектов: 8
