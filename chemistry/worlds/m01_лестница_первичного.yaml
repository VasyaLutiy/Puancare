мир: m01_лестница_первичного
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    ступень: [спиртовая, альдегидная, кислотная]
  ловушки:
    - если ступень=спиртовая то вид=тёмный (85%)
    - если ступень=кислотная то вид=пёстрый (75%)
  гарантии:
    - минимум 2 объектов с ступень=спиртовая
    - минимум 2 объектов с ступень=альдегидная
    - минимум 2 объектов с ступень=кислотная
действия:
  проба_толленса:
    - если ступень=альдегидная то серебряное_зеркало
    - иначе нет_реакции
  проба_соды:
    - если ступень=кислотная то газ_шипит
    - иначе нет_реакции
  проба_марганцовки:
    - если ступень=спиртовая то обесцветилось
    - если ступень=альдегидная то обесцветилось
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если ступень=спиртовая то шанс_стать альдегидная (12%)
    - если ступень=альдегидная то шанс_стать кислотная (12%)
вмешательство:
  перегнать:
    выбираешь: [вид]
    фиксировано: ступень=спиртовая
экзамены:
  - зонд проба_толленса вопрос проба_соды
объектов: 8
