мир: m06_тумблер_гидролиза
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    состав: [эфирный, распавшийся]
  ловушки:
    - если состав=эфирный то вид=светлый (80%)
  гарантии:
    - минимум 2 объектов с состав=эфирный
    - минимум 2 объектов с состав=распавшийся
действия:
  понюхать:
    - если состав=эфирный то фруктовый_запах
    - иначе без_запаха
  проба_соды:
    - если состав=распавшийся то газ_шипит
    - иначе нет_реакции
динамика:
  каждый_шаг:
    - если состав=эфирный то шанс_стать распавшийся (6%)
    - если состав=распавшийся то шанс_стать эфирный (6%)
вмешательство:
  подсушить:
    выбираешь: [вид]
    фиксировано: состав=эфирный
экзамены:
  - зонд понюхать вопрос проба_соды
объектов: 8
