мир: m08_сток_осаждения
объекты:
  зовутся: реактив
  видимое:
    вид: [тёмный, светлый, пёстрый]
    фон: [да, нет]
  скрытое:
    фаза: [в_растворе, в_осадке]
  ловушки:
    - если фаза=в_осадке то вид=тёмный (80%)
  гарантии:
    - минимум 2 объектов с фаза=в_растворе
    - минимум 2 объектов с фаза=в_осадке
действия:
  осмотреть:
    - если фаза=в_растворе то прозрачно
    - иначе мутно
  капнуть_ляпис:
    - если фаза=в_растворе то белый_осадок
    - иначе без_видимых_изменений
динамика:
  каждый_шаг:
    - если фаза=в_растворе то шанс_стать в_осадке (12%)
вмешательство:
  растворить:
    выбираешь: [вид]
    фиксировано: фаза=в_растворе
экзамены:
  - зонд осмотреть вопрос капнуть_ляпис
объектов: 8
