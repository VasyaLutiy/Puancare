# ============================================================
# ШАБЛОН МИРА — заполни и проверь: python3 runworld.py мой_мир.yaml --check
# Всё, что после # — комментарий, движок его не видит.
# Названия любые (русские, английские, смайлики) — для агента это
# непрозрачные строки, он не знает, что "яд" значит яд.
# ============================================================

мир: назови_свой_мир

# ---------- ОБЪЕКТЫ: то, что агент трогает своими действиями ----------
объекты:
  зовутся: штука                  # как называется один объект (для тебя)

  видимое:                        # атрибуты, которые агент ВИДИТ.
    атрибут1: [значение1, значение2, значение3]
    атрибут2: [да, нет]
    # добавь шумовой атрибут, не влияющий ни на что, —
    # проверишь, что агент его отбросит

  скрытое:                        # атрибуты, которые агент НЕ видит.
    тайна: [сорт_а, сорт_б]       # он должен ИЗОБРЕСТИ их из поведения.
    # можно два и больше скрытых — тогда проверяется факторизация:
    # каждая скрытая ось должна опираться на СВОИ действия (см. ниже)

  ловушки:                        # корреляции-обманки (не законы!):
    - если тайна=сорт_а то атрибут1=значение1 (90%)
    # агент может выучить суеверие "значение1 -> ..." — и должен
    # его сломать вмешательством

  гарантии:                       # чтобы мир не выродился:
    - минимум 2 объекта с тайна=сорт_а

# ---------- СУЩНОСТИ: то, что имеет состояние и ломается ----------
# (процессы, блюда, весы). Раздел можно целиком удалить.
сущности:
  зовутся: механизм
  штук: 2
  состояния: [работает, сломан]   # ПЕРВОЕ состояние = "живое"
  связаны_с: 1 (тайна=сорт_а)     # каждый механизм скрыто связан с
                                  # 1 объектом; фильтр в скобках
                                  # необязателен

# ---------- ДЕЙСТВИЯ: таблицы "если ... то ..." ----------
# Порядок строк важен: срабатывает ПЕРВАЯ подходящая (иначе = все прочие).
# Условия соединяются словом "и": если тайна=сорт_а и атрибут2=да то ...
# Эффекты в скобках: [исчезает]  — объект пропадает
#                    [каскад]    — живые сущности, связанные с объектом,
#                                  ломаются
#                    [починка]   — сущность возвращается в живое состояние
действия:
  пощупать:                        # дешёвый зонд скрытого
    - если тайна=сорт_а то мягко
    - иначе колется
  ударить:                         # дорогое действие с последствиями
    - если тайна=сорт_б то отскочило
    - иначе разбилось [исчезает, каскад]
  взвесить:                        # действие, объяснимое ВИДИМЫМ
    - если атрибут2=да то тяжело
    - иначе легко

  осмотреть @сущность:             # @сущность = действие над механизмом
    - если состояние=работает то гудит
    - иначе тишина
  отремонтировать @сущность:
    - если состояние=работает то и_так_работает
    - если связанный_отсутствует то нет_запчасти
    - иначе ок [починка]

# ---------- ВМЕШАТЕЛЬСТВО: создание объектов (do-оператор) ----------
# Нужно, чтобы агент мог ломать суеверия. Можно удалить, но суеверия
# останутся навечно.
вмешательство:
  добыть:
    выбираешь: [атрибут1]              # что агент задаёт сам
    фиксировано: тайна=сорт_а          # что всегда одинаково

# ---------- ЭКЗАМЕНЫ: чем проверять понимание ----------
# зонд A вопрос B: агент делает A с незнакомым объектом и должен
# предсказать исход B ДО того, как сделает. A и B должны зависеть
# от одной и той же скрытой оси.
экзамены:
  - зонд пощупать вопрос ударить

объектов: 8                        # сколько объектов в мире
